<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F5F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ready Tote">
<link rel="apple-touch-icon" href="/app-icon-180.png">
<title>Contacts · Ready Tote Oklahoma admin</title>
<link rel="stylesheet" href="admin-shared.css?v=20261022">
<script src="admin-shared.js?v=20261112"></script>
<script src="admin-rentals-shared.js?v=20261029"></script>
<style>
  /* One row per person, built from every rental and booking request:
     customers (with what they've rented and spent) and leads (people who
     asked but haven't booked yet). */
  :root{--col:1140px;}
  .num{font-variant-numeric:tabular-nums;}
  .toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .toolbar input[type=search]{flex:1 1 260px; margin:0;}
  .toolbar .grow{flex:1;}
  .toolbar button{width:auto; margin:0; height:38px; padding:0 14px; font-size:14px;}
  .fchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .fchips button{width:auto; margin:0; height:34px; padding:0 12px; font-size:14px; font-weight:600; background:#fff; color:var(--ink); border:1px solid var(--control); border-radius:999px;}
  .fchips button:hover{background:#fff; border-color:var(--ink);}
  .fchips button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
  .fchips .n{font-weight:500; opacity:.75; margin-left:4px;}
  .count-line{font-size:14px; color:var(--steel); margin:0 0 8px;}
  .count-line b{color:var(--ink);}
  table.people{width:100%; border-collapse:collapse; font-size:14px;}
  table.people th{font-size:12px; font-weight:500; color:var(--steel); text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.people td{padding:12px 10px; border-bottom:1px solid #F1EDE4; vertical-align:top; font-variant-numeric:tabular-nums;}
  table.people tr:last-child td{border-bottom:none;}
  table.people .r{text-align:right; white-space:nowrap;}
  table.people .who b{font-size:15px;}
  table.people .minor{display:block; font-size:13px; color:var(--steel); margin-top:2px;}
  table.people a{color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--control);}
  .acts{display:flex; gap:6px; justify-content:flex-end;}
  .acts a{display:inline-flex; align-items:center; height:32px; padding:0 10px; border:1px solid var(--control); border-radius:6px; font-size:13px; font-weight:600; text-decoration:none !important; white-space:nowrap;}
  .acts a:hover{border-color:var(--ink);}
  .link-btn{font-size:13px; font-weight:600; color:var(--ink);}
  .pill.neutral{background:var(--track); color:#4A433B;}
  .who-btn{all:unset; cursor:pointer; font-weight:700; font-size:15px; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--control);}
  .who-btn:hover{text-decoration-color:var(--ink);}
  .owes{color:#831C1E; font-weight:600;}
  tr.detail td{background:#FAF8F3; padding:14px 16px;}
  tr.detail[hidden]{display:none;}
  .det{display:grid; grid-template-columns:1fr 1fr; gap:14px 24px; font-size:14px;}
  .det h4{margin:0 0 6px; font-size:13px; color:var(--steel); font-weight:600;}
  .det .line{padding:4px 0; border-top:1px solid #EEE8DC; display:flex; justify-content:space-between; gap:10px;}
  .det .line:first-of-type{border-top:none;}
  .det-acts{grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .det-acts .sms-btn{padding:7px 12px; font-size:13px;}
  .card-ask{display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap; padding:9px 12px; background:#fff; border-radius:8px; font-size:14px; font-weight:600; grid-column:1 / -1;}
  .card-ask[hidden]{display:none;}
  .card-ask button{width:auto; margin:0; padding:7px 14px; font-size:14px;}
  .card-ask .linklike{all:unset; cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-weight:600;}
  @media(max-width:960px){ tr.detail{display:block !important;} tr.detail[hidden]{display:none !important;} .det{grid-template-columns:1fr;} }
  .no-results{padding:14px; border:1px dashed var(--control); border-radius:8px; color:var(--steel); font-size:14px;}
  @media(max-width:960px){
    table.people thead{display:none;}
    table.people, table.people tbody{display:block;}
    table.people tr{display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:12px 0; border-bottom:1px solid #F1EDE4;}
    table.people td{display:block; padding:0; border:none;}
    table.people td.c-who{grid-column:1; grid-row:1;}
    table.people td.c-money{grid-column:2; grid-row:1;}
    table.people td.c-contact{grid-column:1 / -1; grid-row:2;}
    table.people td.c-last{grid-column:1; grid-row:3; color:var(--steel); font-size:13px;}
    table.people td.c-act{grid-column:2; grid-row:3;}
    table.people td.c-hide{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <nav class="admin-nav wide" aria-label="Admin tools">
    <a href="admin.html">Dashboard</a>
  <a href="admin-requests.html">Requests</a>
    <a href="admin-invoice.html">Send Invoice</a>
    <a href="admin-invoice.html?mode=log">Add Rental</a>
    <a href="admin-reminders.html">Reminders</a>
  <a href="admin-rentals.html">All Rentals</a>
    <a href="admin-contacts.html" aria-current="page">Contacts</a>
    <a href="admin-finance.html">Finance</a>
    <a href="admin-outreach.html">Outreach</a>
    <a href="admin-inventory.html">Inventory</a>
  </nav>

  <h1>Contacts</h1>
  <p class="sub">Everyone who has rented or asked about renting, one row per person. Tap a name for their history.</p>

  <input type="hidden" id="secret">
  <button id="loadBtn">Refresh</button>
  <div class="status" id="status"></div>

  <div id="results" style="display:none;">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, phone, email or address" aria-label="Search contacts">
      <button type="button" class="secondary" id="copyEmailsBtn">Copy emails</button>
      <button type="button" class="secondary" id="csvBtn">Download CSV</button>
    </div>
    <div class="fchips" id="chips" role="group" aria-label="Show"></div>
    <p class="count-line" id="countLine"></p>
    <div id="peopleList"></div>
  </div>
</div>

<footer><a href="/">readytoteokc.com</a></footer>

<script>
  const $ = (id) => document.getElementById(id);
  $('secret').value = adminSessionMarker();   // signed-in marker; the session cookie is what the server checks

  let PEOPLE = [], FILTER = 'all', PARTNERS = [];
  const OPEN = new Set();   // people whose history is open
  wireTextAsks(document.getElementById('peopleList'));
  $('loadBtn').addEventListener('click', load);
  $('search').addEventListener('input', render);
  if ($('secret').value) load();

  async function load() {
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret.');
    const btn = $('loadBtn');
    btn.disabled = true; btn.textContent = 'Refreshing…';
    try {
      const post = fn => fetch('/.netlify/functions/' + fn, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ secret }) });
      const [rResp, qResp, oResp] = await Promise.all([post('get-rentals'), post('get-requests'), post('get-outreach')]);
      if (rResp.status === 401 || qResp.status === 401) { showErr('Wrong admin secret.'); return; }
      if (!rResp.ok) { showErr('Load failed (' + rResp.status + ').'); return; }
      const rd = await rResp.json();
      const rentals = (rd.rentals || []).filter(r => !r.cancelled);
      SENT_FLAGS = rd.sentFlags || {};
      PAID_FLAGS = rd.paidFlags || {};
      // Requests find leads and partners name referrals; the page still works without them
      const requests = qResp.ok ? ((await qResp.json()).requests || []) : [];
      PARTNERS = oResp.ok ? ((await oResp.json()).entries || []).filter(e => e.promoCode) : [];
      PEOPLE = buildPeople(rentals, requests);
      render();
      $('results').style.display = 'block';
      $('status').style.display = 'none';
    } catch {
      showErr('Network error. This page only works on the live site.');
    } finally {
      btn.disabled = false; btn.textContent = 'Refresh';
    }
  }

  // ---- People: rentals and requests grouped by phone, else email, else name ----
  const priceNum = p => { const m = String(p || '').replace(/[^0-9.]/g, ''); return m ? parseFloat(m) : 0; };
  const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function personKey(x) {
    const d = String(x.phone || '').replace(/\D/g, '').slice(-10);
    if (d.length === 10) return 'p' + d;
    if (x.email) return 'e' + String(x.email).trim().toLowerCase();
    return 'n' + String(x.name || '').trim().toLowerCase();
  }
  function buildPeople(rentals, requests) {
    const map = new Map();
    const get = (x) => {
      const k = personKey(x);
      if (!map.has(k)) map.set(k, { key: k, name: '', phone: '', email: '', address: '', city: '', rentals: [], leads: [], latest: '' });
      return map.get(k);
    };
    // Newest first, so the latest name, email and address win
    for (const r of [...rentals].sort((a, b) => (b.dropoffDate || '').localeCompare(a.dropoffDate || ''))) {
      const p = get(r);
      p.rentals.push(r);
      p.name ||= r.name || ''; p.phone ||= r.phone || ''; p.email ||= r.email || '';
      if (!p.address) { p.address = dropoffAddressOf(r) || ''; p.city = r.dropoffAddressCity || ''; }
      if ((r.dropoffDate || '') > p.latest) p.latest = r.dropoffDate || '';
    }
    // A request becomes a rental once invoiced; only the others are leads
    for (const q of [...requests].sort((a, b) => (b.submittedAt || '').localeCompare(a.submittedAt || ''))) {
      if (q.status === 'invoiced') continue;
      const p = get(q);
      p.leads.push(q);
      p.name ||= q.name || ''; p.phone ||= q.phone || ''; p.email ||= q.email || '';
      if (!p.address) { p.address = deliveryAddressOf(q) || ''; p.city = q.deliveryAddressCity || ''; }
    }
    const isPaid = r => paidOutsideInvoice(r) || !!PAID_FLAGS[r.key];
    const partnerFor = code => code && PARTNERS.find(e => String(e.promoCode).toUpperCase() === String(code).toUpperCase());
    return [...map.values()].map(p => ({
      ...p,
      spent: p.rentals.reduce((t, r) => t + priceNum(r.price), 0),
      paid: p.rentals.filter(isPaid).reduce((t, r) => t + priceNum(r.price), 0),
      owes: p.rentals.filter(r => !isPaid(r)).reduce((t, r) => t + priceNum(r.price), 0),
      partner: [...p.rentals, ...p.leads].map(x => partnerFor(x.promoCode)).find(Boolean) || null,
      code: [...p.rentals, ...p.leads].map(x => x.promoCode).find(Boolean) || '',
      kind: p.rentals.length > 1 ? 'repeat' : p.rentals.length ? 'customer' : 'lead',
      leadDate: p.leads.length ? (p.leads[0].submittedAt || '').slice(0, 10) : '',
    })).sort((a, b) => (b.latest || b.leadDate).localeCompare(a.latest || a.leadDate));
  }

  const FILTERS = [
    ['all', 'All', () => true],
    ['customers', 'Customers', p => p.rentals.length > 0],
    ['repeat', 'Repeat', p => p.rentals.length > 1],
    ['leads', 'Leads', p => p.kind === 'lead'],
    ['owes', 'Owes money', p => p.owes > 0],
    ['referred', 'Referred', p => !!p.partner],
  ];
  window.setFilter = f => { FILTER = f; render(); };
  function matches(p, q) {
    if (!q) return true;
    const hay = [p.name, p.phone, String(p.phone).replace(/\D/g, ''), p.email, p.address,
      ...p.rentals.map(r => r.package), ...p.rentals.map(r => pickupAddressOf(r))].join(' ').toLowerCase();
    return q.split(/\s+/).every(w => hay.includes(w));
  }
  function visible() {
    const q = $('search').value.trim().toLowerCase();
    return PEOPLE.filter(p => matches(p, q)).filter(FILTERS.find(f => f[0] === FILTER)[2]);
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const found = PEOPLE.filter(p => matches(p, q));
    $('chips').innerHTML = FILTERS.map(([id, label, fn]) =>
      `<button type="button" aria-pressed="${FILTER === id}" onclick="setFilter('${id}')">${label}<span class="n">${found.filter(fn).length}</span></button>`).join('');
    const rows = visible();
    const spent = rows.reduce((t, p) => t + p.spent, 0);
    $('countLine').innerHTML = rows.length
      ? `<b class="num">${rows.length}</b> ${rows.length === 1 ? 'person' : 'people'}${spent ? ` · <b class="num">${money(spent)}</b> in rentals` : ''}`
      : '';
    if (!rows.length) {
      $('peopleList').innerHTML = `<p class="no-results">${q ? `No one matches “${esc($('search').value.trim())}”.` : 'No one here yet.'}</p>`;
      return;
    }
    const day = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
    $('peopleList').innerHTML = `
      <table class="people">
        <thead><tr><th>Name</th><th>Contact</th><th class="r">Rentals</th><th>Last rental</th><th>Area</th><th></th></tr></thead>
        <tbody>${rows.map(p => {
          const digits = String(p.phone || '').replace(/[^0-9+]/g, '');
          const tag = p.kind === 'repeat' ? '<span class="pill ok">Repeat</span>' : p.kind === 'lead' ? '<span class="pill pending">Lead</span>' : '';
          const last = p.rentals.length ? day(p.latest) + `<span class="minor">${esc(p.rentals[0].package ? p.rentals[0].package.split(/\s+—\s+/)[0] : '')}</span>`
            : `Asked ${day(p.leadDate)}<span class="minor">${esc(p.leads[0].status === 'declined' ? 'Declined' : 'Not booked yet')}${SENT_FLAGS['leadFollowup:' + p.key] ? ' · followed up ' + esc(day(String(SENT_FLAGS['leadFollowup:' + p.key]).slice(0, 10))) : ''}</span>`;
          return `<tr>
            <td class="c-who who"><button type="button" class="who-btn" data-open="${escAttr(p.key)}" aria-expanded="${OPEN.has(p.key)}">${esc(p.name || 'No name')}</button> ${tag}${p.partner ? `<span class="minor">Referred by ${esc(p.partner.name)}</span>` : ''}</td>
            <td class="c-contact">${p.phone ? `<a href="tel:${escAttr(digits)}">${esc(fmtPhone(p.phone))}</a>` : '—'}${p.email ? `<span class="minor"><a href="mailto:${escAttr(p.email)}">${esc(p.email)}</a></span>` : ''}</td>
            <td class="c-money r">${p.rentals.length ? `${p.rentals.length} ${p.rentals.length === 1 ? 'rental' : 'rentals'}${p.paid || !p.owes ? `<span class="minor">${money(p.paid)} paid</span>` : ''}${p.owes ? `<span class="minor owes">Owes ${money(p.owes)}</span>` : ''}` : '<span style="color:var(--steel)">—</span>'}</td>
            <td class="c-last">${last}</td>
            <td class="c-hide" style="color:var(--steel);">${esc(p.city || (p.address.split(',').slice(-2, -1)[0] || '').trim() || '—')}</td>
            <td class="c-act"><div class="acts">
              ${digits ? `<a href="sms:${escAttr(normalizePhone(p.phone))}">Text</a>` : ''}
              ${p.email ? `<a href="mailto:${escAttr(p.email)}">Email</a>` : ''}
              ${p.rentals.length ? `<a href="admin-invoice.html" data-invoice="${escAttr(p.key)}">Invoice</a>` : ''}
            </div></td>
          </tr>
          <tr class="detail"${OPEN.has(p.key) ? '' : ' hidden'}><td colspan="6">${detailHtml(p)}</td></tr>`; }).join('')}
        </tbody>
      </table>`;
  }

  // ---- A person's history: rentals, requests, referral, and what to send next ----
  function detailHtml(p) {
    const first = String(p.name || '').split(' ')[0] || 'there';
    const day = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const rentalLines = p.rentals.map(r => {
      const paid = paidOutsideInvoice(r) || PAID_FLAGS[r.key];
      return `<div class="line"><span>${esc(day(r.dropoffDate))} · ${esc((r.package || '').split(/\s+—\s+/)[0] || 'Rental')}${r.notes ? `<span class="minor">${esc(r.notes)}</span>` : ''}</span><span>${esc(fmtPrice(r.price))} ${paid ? '<span class="pill ok">Paid</span>' : '<span class="pill err">Owes</span>'}</span></div>`;
    }).join('');
    const leadLines = p.leads.map(q => `<div class="line"><span>Asked ${esc(day((q.submittedAt || '').slice(0, 10)))} for ${esc(day(q.deliveryDate))}</span><span>${esc({ new: 'New', reviewed: 'Reviewed', awaiting_confirmation: 'Awaiting them', confirmed: 'Confirmed', declined: 'Declined' }[q.status] || q.status || '')}</span></div>`).join('');
    // Review: ask after their latest finished rental, once
    const done = p.rentals.filter(r => rentalPhase(r) === 'done');
    const last = done[0];
    let review = '';
    if (last) review = SENT_FLAGS['review:' + last.key]
      ? `<span class="minor">Review asked ${esc(day(String(SENT_FLAGS['review:' + last.key]).slice(0, 10)))}</span>`
      : last.reviewSms ? textBtn('review', last.key, last.reviewSms, '', 'Review request') : '';
    // Lead follow-up: people who asked and haven't booked
    let follow = '';
    if (p.kind === 'lead' && p.phone && p.leads[0] && p.leads[0].status !== 'declined') {
      const msg = `Hi ${first}, it's ${TEXT_SIGNER}! You asked about moving totes a little while back. Still need some for your move? Glad to help, just reply here.`;
      follow = textBtn('leadFollowup', p.key, smsLink(p.phone, msg), '', 'Text follow-up');
    }
    return `<div class="det" data-key="${escAttr(p.key)}" data-first="${escAttr(first)}">
      <div><h4>Rentals</h4>${rentalLines || '<span class="minor">None yet</span>'}</div>
      <div><h4>Requests</h4>${leadLines || '<span class="minor">None open</span>'}
        ${p.code ? `<h4 style="margin-top:12px;">Promo code</h4><div>${esc(p.code)}${p.partner ? ` · ${esc(p.partner.name)}` : ''}</div>` : ''}</div>
      <div class="det-acts">${review}${follow}
        ${p.rentals.length ? `<a class="link-btn" href="admin-rentals.html?q=${encodeURIComponent(p.name || '')}">Open in All rentals</a>` : ''}
        ${p.leads.length ? `<a class="link-btn" href="admin-requests.html">Open Requests</a>` : ''}</div>
      ${askFor(p.key, first)}
    </div>`;
  }
  // Repeat customer: hand Send Invoice who they are and their latest drop-off
  // address, the same way Requests does. Package and dates are left for the
  // new rental, and there's no request key, so nothing gets marked invoiced.
  document.getElementById('peopleList').addEventListener('click', (e) => {
    const a = e.target.closest('[data-invoice]'); if (!a) return;
    const p = PEOPLE.find(x => x.key === a.dataset.invoice); if (!p) return;
    e.preventDefault();
    const r = p.rentals[0];
    sessionStorage.setItem('rto-prefill-request', JSON.stringify({
      source: 'contact',
      name: p.name, email: p.email, phone: p.phone,
      deliveryAddressStreet: r.dropoffAddressStreet, deliveryAddressCity: r.dropoffAddressCity,
      deliveryAddressState: r.dropoffAddressState, deliveryAddressZip: r.dropoffAddressZip,
      deliveryAddress: r.dropoffAddress || r.address || '',
    }));
    location.href = a.href;
  });
  document.getElementById('peopleList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-open]'); if (!b) return;
    OPEN.has(b.dataset.open) ? OPEN.delete(b.dataset.open) : OPEN.add(b.dataset.open);
    const row = b.closest('tr').nextElementSibling;
    row.hidden = !OPEN.has(b.dataset.open);
    b.setAttribute('aria-expanded', String(!row.hidden));
  });

  // ---- Export: what's on screen (search and filter applied) ----
  $('copyEmailsBtn').addEventListener('click', async () => {
    const emails = [...new Set(visible().map(p => String(p.email || '').trim()).filter(Boolean))];
    if (!emails.length) return showErr('No emails in this list.');
    try {
      await navigator.clipboard.writeText(emails.join(', '));
      showOk(`Copied ${emails.length} email${emails.length === 1 ? '' : 's'}. Paste them into BCC.`);
    } catch { showErr('Couldn’t copy. Your browser blocked the clipboard.'); }
  });
  $('csvBtn').addEventListener('click', () => {
    const rows = visible();
    if (!rows.length) return showErr('Nothing to export.');
    const cols = ['name', 'type', 'phone', 'email', 'address', 'rentals', 'totalSpent', 'paid', 'owes', 'referredBy', 'lastRental', 'requested'];
    const cell = v => '"' + String(v ?? '').replaceAll('"', '""') + '"';
    const lines = [cols.join(',')].concat(rows.map(p => [p.name, p.kind, p.phone, p.email, p.address, p.rentals.length, p.spent.toFixed(2), p.paid.toFixed(2), p.owes.toFixed(2), p.partner ? p.partner.name : '', p.latest, p.leadDate].map(cell).join(',')));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/csv' }));
    a.download = 'ready-tote-contacts-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click(); URL.revokeObjectURL(a.href);
  });

  function showErr(m) { const s = $('status'); s.style.display = 'block'; s.className = 'status err'; s.textContent = m; }
  function showOk(m) { const s = $('status'); s.style.display = 'block'; s.className = 'status ok'; s.textContent = m; setTimeout(() => { s.style.display = 'none'; }, 3000); }
</script>
</body>
</html>
