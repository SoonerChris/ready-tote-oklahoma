<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F5F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{--col:960px;}

  .summary-line{margin:-6px 0 18px; font-size:15px; color:var(--steel);}
  .summary-line b{color:var(--ink); font-variant-numeric:tabular-nums;}
  .toolbar{margin:0 0 16px;}
  .toolbar input{margin:0;}
  .entry-main{flex:1; min-width:220px;}
  .entry-name .status-pill{margin-left:6px; vertical-align:2px;}
  .code-line{font-size:13px; margin-top:4px; color:var(--steel);}
  .code-line b{color:var(--ink);}
  .entry-tools{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px;}
  .entry-tools a.small-btn{display:inline-flex; align-items:center; text-decoration:none; border-radius:6px; font-weight:600;}
  .entry-tools [hidden]{display:none;}
  .del-ask{font-size:13px; font-weight:600; display:inline-flex; gap:6px; align-items:center;}
  .history{margin-top:10px; padding:10px 12px; background:#FAF8F3; border-radius:8px;}
  .history[hidden]{display:none;}
  .log-add{display:flex; gap:6px; margin-bottom:8px;}
  .log-add input{flex:1; margin:0; height:34px; padding:4px 10px; font-size:14px;}
  .log-row{display:flex; gap:10px; font-size:14px; padding:5px 0; border-top:1px solid #EEE8DC;}
  .log-row span{color:var(--steel); min-width:52px; font-variant-numeric:tabular-nums;}
  .undo-link{all:unset; cursor:pointer; margin-left:8px; text-decoration:underline; text-underline-offset:3px; font-weight:600;}
  .scard{background:var(--white);padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;}
  .scard .num{font-weight:600;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;}
  .scard .lbl{font-size:14px;color:var(--steel);margin-top:2px;}


  .section{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:24px;}
  .section h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px;justify-content:space-between;}
  .section .count-badge{font-size:15px;font-weight:500;color:var(--steel);margin-right:auto;font-variant-numeric:tabular-nums;}

  .addform{border:1px dashed var(--control);border-radius:8px;padding:14px;margin:14px 0;}
  .addform .grid2{margin-bottom:0;}
  .addform button{width:auto;padding:10px 18px;font-size:14px;}

  .entry{border-top:1px solid #F1EDE4;padding:12px 0;}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .entry-name{font-weight:600;font-size:16px;}
  .entry-meta{font-size:14px;color:var(--steel);margin-top:2px;font-variant-numeric:tabular-nums;}
  .entry-notes{font-size:14px;color:var(--steel);margin-top:6px;}
  .entry-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .status-pill{display:inline-flex;align-items:center;height:22px;font-size:12px;font-weight:600;padding:0 8px;border-radius:4px;background:var(--track);color:#4A433B;}
  .status-pill.active{background:var(--green-bg);color:#14492F;}
  .status-pill.contacted, .status-pill.followup{background:var(--gold-bg);color:#6B4C0C;}
  .status-pill.notinterested{background:var(--crate-red-bg);color:var(--crate-red);}
  select.inline-status{width:auto;padding:6px 8px;font-size:13px;}
  .small-btn{width:auto;padding:6px 12px;font-size:13px;margin-top:0;background:var(--white);border:1px solid var(--control);color:var(--ink);}
  .small-btn:hover{background:var(--white);border-color:var(--ink);}
  .small-btn.danger{color:var(--red);}

  .empty{color:var(--steel);font-size:14px;padding:8px 0;}

  /* Follow-ups: when each partner was last contacted and when to reach out next */
  .dates{font-size:13px; color:var(--steel); margin-top:4px; font-variant-numeric:tabular-nums;}
  .dates .due{color:#831C1E; font-weight:600;}
  .dates .soon{color:#6B4C0C; font-weight:600;}
  .due-box{border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin-bottom:24px;}
  .due-box.clear{background:var(--green-bg); border-color:transparent; color:#14492F; font-size:14px; font-weight:600;}
  .due-box h2{margin:0 0 8px; font-size:17px;}
  .due-box h2 .n{font-weight:500; color:var(--steel); margin-left:6px;}
  .due-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid #F1EDE4; flex-wrap:wrap;}
  .due-row:first-of-type{border-top:none;}
  .due-row .who{flex:1; min-width:200px;}
  .due-row .who b{font-size:15px;}
  .due-row .who .cat{color:var(--steel); font-size:13px;}
  .due-row .who .dates{margin-top:2px;}
  .due-row .acts{display:flex; gap:8px; flex-wrap:wrap;}
  .due-later{font-size:13px; color:var(--steel); margin:8px 0 0;}
  .add-row{display:flex;flex-wrap:wrap;gap:8px;}
  .toggle-add{width:auto;padding:8px 14px;font-size:14px;margin:0;background:var(--white);color:var(--ink);border:1px solid var(--control);}
  .toggle-add:hover{background:var(--white);border-color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <nav class="admin-nav wide" aria-label="Admin tools">
    <a href="admin.html">Dashboard</a>
  <a href="admin-requests.html">Requests</a>
    <a href="admin-invoice.html">Send Invoice</a>
    <a href="admin-invoice.html?mode=log">Add Rental</a>
    <a href="admin-reminders.html">Reminders</a>
  <a href="admin-rentals.html">All Rentals</a>
    <a href="admin-contacts.html">Contacts</a>
    <a href="admin-finance.html">Finance</a>
    <a href="admin-outreach.html" aria-current="page">Outreach</a>
    <a href="admin-inventory.html">Inventory</a>
  </nav>

  <h1>Partner outreach</h1>
  <p class="summary-line" id="summaryLine">Loading partners…</p>

  <div class="secret-bar">
  <input type="hidden" id="secret">
    <button id="loadBtn">Refresh</button>
  </div>
  <div class="status" id="status"></div>

  <div id="dueBox"></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Search partners, people, notes or codes" aria-label="Search partners">
  </div>
  <div id="sections"></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const TOP_MOVERS = [
    { name: "Thunder Moving", contactName: "", phone: "(405) 757-5354", email: "", notes: "BBB A+, family-owned since 2019, explicitly services Moore/Edmond/Norman. Top pick, largest fleet (13 trucks)." },
    { name: "Boxed Out Moving", contactName: "Jonathan", phone: "(405) 820-4552", email: "jonathan@boxedoutmoving.com", notes: "Also does apartment relocations, good overlap with our apartment partners. Explicitly covers Moore." },
    { name: "On Call Moving", contactName: "Blake Boyd", phone: "(405) 586-5243", email: "info@oncallmovingcompany.com", notes: "Established OKC metro operation, family-owned." },
    { name: "The 2 Move Crew", contactName: "", phone: "(405) 430-3529", email: "the2movecrew@gmail.com", notes: "Based in Norman, serves within 100-mile radius, easily reaches Moore/OKC." },
    { name: "High Quality Moving OKC", contactName: "", phone: "(580) 595-1262", email: "", notes: "Claims 2,000+ OKC moves. Verify current reviews before investing heavily, contact info less established." },
  ];


  const TOP_REMODELERS = [
    { name: "Guss Construction and Remodeling", contactName: "", phone: "(405) 550-7799", email: "", notes: "4.8★ (78 reviews). Moore, OK, closest to home base. Kitchen/bath remodels." },
    { name: "A2Z Construction and Remodeling", contactName: "", phone: "(405) 443-5642", email: "", notes: "4.8★ (142 reviews). Edmond + Norman locations. High-volume kitchen/bath remodeler." },
    { name: "Ten Key Home & Kitchen Remodels", contactName: "", phone: "(405) 531-9095", email: "", notes: "4.7★ (71 reviews). OKC. Kitchen/bath specialist, handles large whole-home projects." },
    { name: "OKC Renovations", contactName: "Blake", phone: "(405) 642-0015", email: "", notes: "4.8★ (161 reviews). OKC. Full home renovations, highest review volume in the list." },
    { name: "A Karen Black Company", contactName: "", phone: "(405) 858-8333", email: "", notes: "4.9★ (11 reviews). OKC. Design-build kitchen/bath remodeler, smaller shop." },
    { name: "Heritage Renovations", contactName: "Dan", phone: "(405) 887-4121", email: "", notes: "5.0★ (11 reviews). OKC. Kitchen, attic conversion, whole-home projects." },
    { name: "G1 Remodeling", contactName: "Ben", phone: "(405) 696-4050", email: "", notes: "5.0★ (4 reviews). Norman. Bathroom remodel specialist, also does rental/Airbnb remodels." },
    { name: "Roadhouse Renovations LLC", contactName: "", phone: "(580) 559-2680", email: "", notes: "New listing, no reviews yet. Ada, OK coverage." },
    { name: "TR Contracting", contactName: "", phone: "(580) 217-9342", email: "", notes: "5.0★ (40 reviews). Ada, OK. Mostly roofing/exterior/storm restoration but covers Ada." },
  ];


  // Partner types, in page order. "Other" covers storage facilities,
  // property managers, churches and anyone else who sends movers our way.
  const CATS = [
    { id: 'apartment', title: 'Apartment communities', one: 'apartment', placeholder: 'Property or management company' },
    { id: 'realtor',   title: 'Realtors and brokerages', one: 'realtor', placeholder: 'Agent or brokerage' },
    { id: 'remodeler', title: 'Remodeling companies', one: 'remodeler', placeholder: 'Remodeling or contracting company', seed: TOP_REMODELERS },
    { id: 'mover',     title: 'Moving companies', one: 'mover', placeholder: 'Moving company', seed: TOP_MOVERS },
    { id: 'other',     title: 'Other partners', one: 'partner', placeholder: 'Storage facility, property manager…' },
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

  // Pipeline. Older entries used longer names; they're read as these.
  const STATUSES = ['Not contacted', 'Contacted', 'Interested', 'Partner', 'Not interested'];
  const LEGACY = { 'Not Contacted': 'Not contacted', 'Follow-Up Scheduled': 'Contacted', 'Active Partner': 'Partner', 'Not Interested': 'Not interested' };
  const statusOf = e => LEGACY[e.status] || (STATUSES.includes(e.status) ? e.status : 'Not contacted');
  const STATUS_CLASS = { Partner: 'active', Interested: 'followup', Contacted: 'contacted', 'Not interested': 'notinterested' };

  let ENTRIES = [], RENTALS = [], REQUESTS = [];
  const OPEN = new Set();   // cards with their history open

  $('secret').value = adminSessionMarker();   // signed-in marker; the session cookie is what the server checks
  $('loadBtn').addEventListener('click', loadAll);
  $('search').addEventListener('input', render);
  if ($('secret').value) loadAll();
  function secret() { return $('secret').value.trim(); }

  const TODAY = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const shortDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const money = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const priceNum = p => { const m = String(p || '').replace(/[^0-9.]/g, ''); return m ? parseFloat(m) : 0; };
  const wantsFollowUp = e => e.nextFollowUp && statusOf(e) !== 'Not interested';

  async function api(fn, payload) {
    const resp = await fetch('/.netlify/functions/' + fn, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: secret(), ...payload }),
    });
    if (resp.status === 401) throw new Error('You’re signed out. Log in again.');
    if (!resp.ok) throw new Error(await resp.text().catch(() => '') || 'Request failed (' + resp.status + ')');
    return resp.json();
  }

  async function loadAll() {
    $('loadBtn').disabled = true;
    try {
      // Rentals and requests are only for counting what each partner's code brought in
      const [o, r, q] = await Promise.all([api('get-outreach', {}), api('get-rentals', {}).catch(() => ({})), api('get-requests', {}).catch(() => ({}))]);
      ENTRIES = o.entries || [];
      RENTALS = (r.rentals || []).filter(x => !x.cancelled);
      REQUESTS = q.requests || [];
      render();
      $('status').className = 'status';
    } catch (e) { showStatus('err', e.message); }
    $('loadBtn').disabled = false;
  }

  // What a partner's code brought in: bookings (rentals) and open requests
  function referrals(e) {
    const code = String(e.promoCode || '').toUpperCase();
    if (!code) return null;
    const hit = x => String(x.promoCode || '').toUpperCase() === code;
    const rentals = RENTALS.filter(hit);
    const open = REQUESTS.filter(x => hit(x) && !['invoiced', 'declined'].includes(x.status));
    return { rentals: rentals.length, revenue: rentals.reduce((t, x) => t + priceNum(x.price), 0), open: open.length };
  }

  // ---- Ready-made messages ----
  function intro(e) {
    const who = e.contactName ? e.contactName.split(' ')[0] : 'there';
    const code = e.promoCode ? ` If it helps, your clients can use code ${e.promoCode}${e.promoPct ? ` for ${e.promoPct}% off` : ''} when they book at readytoteokc.com.` : '';
    const pitch = {
      apartment: 'We rent clean, sturdy moving totes, delivered to the door and picked up after. They\'re a nice perk to offer new and moving-out residents, and they keep cardboard out of your dumpsters.',
      realtor: 'We rent clean, sturdy moving totes, delivered and picked up. They make a great closing gift or a simple recommendation for clients who are packing up.',
      remodeler: 'We rent clean, sturdy moving totes, delivered and picked up. When a homeowner has to clear out a kitchen or bathroom for a remodel, totes make it fast and keep their things safe.',
      mover: 'We rent clean, sturdy moving totes, delivered and picked up. They stack better than boxes, so loading is faster for your crews, and customers skip buying cardboard.',
      other: 'We rent clean, sturdy moving totes, delivered to the door and picked up after, across the OKC metro and Ada area.',
    }[e.category] || '';
    const body = `Hi ${who}, this is Chris with Ready Tote Oklahoma. ${pitch} Would you be open to recommending us?${code} Happy to drop off a few flyers. Thanks!`;
    return { subject: 'Moving totes for your ' + ({ apartment: 'residents', realtor: 'clients', remodeler: 'clients', mover: 'customers' }[e.category] || 'customers'), body };
  }

  function datesLine(e) {
    const parts = [];
    if (e.dateContacted) parts.push('Last contacted ' + shortDay(e.dateContacted));
    if (wantsFollowUp(e)) {
      const cls = e.nextFollowUp <= TODAY ? 'due' : e.nextFollowUp <= addDays(TODAY, 7) ? 'soon' : '';
      const when = e.nextFollowUp < TODAY ? 'was due ' + shortDay(e.nextFollowUp) : e.nextFollowUp === TODAY ? 'due today' : shortDay(e.nextFollowUp);
      parts.push(`<span class="${cls}">Follow up ${when}</span>`);
    }
    return parts.length ? `<div class="dates">${parts.join(' · ')}</div>` : '';
  }

  // Every save sends the whole entry
  const entryPayload = e => ({ key: e.key, category: e.category, name: e.name, contactName: e.contactName || '', email: e.email || '', phone: e.phone || '',
    notes: e.notes || '', status: statusOf(e), dateContacted: e.dateContacted || '', nextFollowUp: e.nextFollowUp || '',
    promoCode: e.promoCode || '', promoPct: e.promoPct ?? '', log: e.log || [] });
  async function saveEntry(e, next, okMsg) {
    try {
      const res = await api('save-outreach', entryPayload(next));
      Object.assign(e, next, { key: res.key || next.key });
      render();
      if (okMsg) showStatus('ok', okMsg);
      return true;
    } catch (err) { showStatus('err', err.message); return false; }
  }

  // "Contacted today": stamps today, logs it, next touch in two weeks
  async function contactedToday(key) {
    const e = ENTRIES.find(x => x.key === key); if (!e) return;
    const st = statusOf(e);
    const next = { ...e, dateContacted: TODAY, nextFollowUp: st === 'Not interested' ? '' : addDays(TODAY, 14),
      status: st === 'Not contacted' ? 'Contacted' : st, log: [{ date: TODAY, note: 'Contacted' }, ...(e.log || [])] };
    saveEntry(e, next, `${e.name}: contacted today${next.nextFollowUp ? ', follow up ' + shortDay(next.nextFollowUp) : ''}.`);
  }
  async function snooze(key) {
    const e = ENTRIES.find(x => x.key === key); if (!e) return;
    const next = { ...e, nextFollowUp: addDays(e.nextFollowUp > TODAY ? e.nextFollowUp : TODAY, 7) };
    saveEntry(e, next, `${e.name}: follow up moved to ${shortDay(next.nextFollowUp)}.`);
  }
  async function addLog(key) {
    const e = ENTRIES.find(x => x.key === key); if (!e) return;
    const input = document.querySelector(`[data-log-input="${CSS.escape(key)}"]`);
    const note = input.value.trim(); if (!note) return;
    if (await saveEntry(e, { ...e, log: [{ date: TODAY, note }, ...(e.log || [])] }, 'Added to the history.')) OPEN.add(key), render();
  }
  async function quickStatus(key, status) {
    const e = ENTRIES.find(x => x.key === key); if (!e) return;
    const next = { ...e, status, log: [{ date: TODAY, note: 'Status: ' + status }, ...(e.log || [])] };
    if (status === 'Interested' && !e.nextFollowUp) next.nextFollowUp = addDays(TODAY, 7);
    if (status === 'Not interested') next.nextFollowUp = '';
    saveEntry(e, next, 'Updated ' + e.name + '.');
  }

  // ---- Delete: confirm in the card, then Undo puts it back under the same key ----
  let LAST_DELETED = null;
  async function deleteEntry(key) {
    const e = ENTRIES.find(x => x.key === key); if (!e) return;
    try {
      await api('delete-outreach', { key });
      ENTRIES = ENTRIES.filter(x => x.key !== key);
      LAST_DELETED = e;
      render();
      showStatus('ok', `Deleted ${escapeHtml(e.name)}. <button type="button" class="undo-link" onclick="undoDelete()">Undo</button>`, true);
    } catch (err) { showStatus('err', err.message); }
  }
  async function undoDelete() {
    const e = LAST_DELETED; if (!e) return; LAST_DELETED = null;
    try { await api('save-outreach', entryPayload(e)); ENTRIES.push(e); render(); showStatus('ok', 'Put back.'); }
    catch (err) { showStatus('err', 'Couldn’t undo: ' + err.message); }
  }

  // ---- Import the researched lists (buttons hide once everything's in) ----
  async function importSeed(cat) {
    const c = CAT[cat]; let added = 0;
    for (const m of c.seed) {
      if (ENTRIES.some(e => e.category === cat && e.name === m.name)) continue;
      try {
        const payload = { category: cat, name: m.name, contactName: m.contactName, email: m.email, phone: m.phone, notes: m.notes, status: 'Not contacted' };
        const result = await api('save-outreach', payload);
        ENTRIES.push({ key: result.key, ...payload }); added++;
      } catch (err) { showStatus('err', 'Failed on ' + m.name + ': ' + err.message); return; }
    }
    render();
    showStatus('ok', `Imported ${added} ${c.one}${added === 1 ? '' : 's'}.`);
  }

  // ---- Render ----
  const ORDER = { Partner: 1, Interested: 2, Contacted: 3, 'Not contacted': 4, 'Not interested': 5 };
  function sortKey(e) {
    const due = wantsFollowUp(e) && e.nextFollowUp <= TODAY ? 0 : 1;
    return [due, ORDER[statusOf(e)] || 9, (e.name || '').toLowerCase()];
  }
  const byKey = (a, b) => { const x = sortKey(a), y = sortKey(b); return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2]); };
  function matches(e, q) {
    if (!q) return true;
    const hay = [e.name, e.contactName, e.email, e.phone, e.notes, e.promoCode, ...(e.log || []).map(l => l.note)].join(' ').toLowerCase();
    return q.split(/\s+/).every(w => hay.includes(w));
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const partners = ENTRIES.filter(e => statusOf(e) === 'Partner').length;
    const contacted = ENTRIES.filter(e => statusOf(e) !== 'Not contacted').length;
    const due = ENTRIES.filter(e => wantsFollowUp(e) && e.nextFollowUp <= TODAY).length;
    const codes = ENTRIES.map(referrals).filter(Boolean);
    const booked = codes.reduce((t, r) => t + r.rentals, 0);
    $('summaryLine').innerHTML = ENTRIES.length
      ? `<b>${partners}</b> ${partners === 1 ? 'partner' : 'partners'} · <b>${contacted}</b> of ${ENTRIES.length} contacted · <b>${due}</b> follow-up${due === 1 ? '' : 's'} due${booked ? ` · <b>${booked}</b> booking${booked === 1 ? '' : 's'} from partner codes` : ''}`
      : 'No partners yet. Add one below.';

    $('sections').innerHTML = CATS.map(c => {
      const all = ENTRIES.filter(e => e.category === c.id);
      const items = all.filter(e => matches(e, q)).sort(byKey);
      if (q && !items.length) return '';
      const seedLeft = c.seed ? c.seed.filter(m => !all.some(e => e.name === m.name)).length : 0;
      const pc = all.filter(e => statusOf(e) === 'Partner').length;
      return `<div class="section">
        <h2>${c.title} <span class="count-badge">${all.length}${pc ? ` · ${pc} partner${pc === 1 ? '' : 's'}` : ''}</span></h2>
        <div class="add-row"><button class="toggle-add" onclick="toggleForm('${c.id}')">Add ${c.one}</button>
        ${seedLeft ? `<button class="toggle-add" onclick="importSeed('${c.id}')">Import ${seedLeft} researched ${c.one}${seedLeft === 1 ? '' : 's'}</button>` : ''}</div>
        <div class="addform" id="form-${c.id}" style="display:none;"></div>
        <div>${items.length ? items.map(entryHtml).join('') : '<div class="empty">None yet.</div>'}</div>
      </div>`;
    }).join('') || '<p class="empty">No partners match that search.</p>';
    renderDue();
  }

  function entryHtml(e) {
    const st = statusOf(e);
    const opts = STATUSES.map(s => `<option${s === st ? ' selected' : ''}>${s}</option>`).join('');
    const contactLine = [e.contactName, e.email, e.phone].filter(Boolean).join(' · ');
    const ref = referrals(e);
    const m = intro(e);
    const digits = String(e.phone || '').replace(/[^0-9+]/g, '');
    const open = OPEN.has(e.key);
    return `
      <div class="entry" data-key="${escapeHtml(e.key)}">
        <div class="entry-top">
          <div class="entry-main">
            <div class="entry-name">${escapeHtml(e.name)} <span class="status-pill ${STATUS_CLASS[st] || ''}">${st}</span></div>
            ${contactLine ? `<div class="entry-meta">${escapeHtml(contactLine)}</div>` : ''}
            ${e.promoCode ? `<div class="code-line">Code <b>${escapeHtml(e.promoCode)}</b>${e.promoPct ? ` · ${e.promoPct}% off` : ' · tracking only'}${ref ? ` · ${ref.rentals ? `<b>${ref.rentals}</b> booking${ref.rentals === 1 ? '' : 's'}, ${money(ref.revenue)}` : 'no bookings yet'}${ref.open ? ` · ${ref.open} open request${ref.open === 1 ? '' : 's'}` : ''}` : ''}</div>` : ''}
            ${e.notes ? `<div class="entry-notes">${escapeHtml(e.notes)}</div>` : ''}
            ${datesLine(e)}
          </div>
          <div class="entry-actions">
            <select class="inline-status" aria-label="Status" onchange="quickStatus('${escapeHtml(e.key)}', this.value)">${opts}</select>
            <button class="small-btn" onclick="contactedToday('${escapeHtml(e.key)}')">Contacted today</button>
          </div>
        </div>
        <div class="entry-tools">
          ${e.email ? `<a class="small-btn" href="mailto:${escapeHtml(e.email)}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}">Email intro</a>` : ''}
          ${digits ? `<a class="small-btn" href="${escapeHtml(smsLink(e.phone, m.body))}">Text intro</a><a class="small-btn" href="tel:${escapeHtml(digits)}">Call</a>` : ''}
          <button class="small-btn" onclick="toggleHistory('${escapeHtml(e.key)}')" aria-expanded="${open}">History${(e.log || []).length ? ' (' + e.log.length + ')' : ''}</button>
          <button class="small-btn" onclick="editEntry('${escapeHtml(e.key)}')">Edit</button>
          <button class="small-btn danger" data-del>Delete</button>
          <span class="del-ask" hidden>Delete ${escapeHtml(e.name)}? <button class="small-btn danger" onclick="deleteEntry('${escapeHtml(e.key)}')">Delete</button> <button class="small-btn" data-keep>Keep</button></span>
        </div>
        <div class="history"${open ? '' : ' hidden'}>
          <div class="log-add"><input type="text" data-log-input="${escapeHtml(e.key)}" maxlength="300" placeholder="What happened? e.g. dropped off flyers, talked to Jen" onkeydown="if(event.key==='Enter')addLog('${escapeHtml(e.key)}')"><button class="small-btn" onclick="addLog('${escapeHtml(e.key)}')">Add</button></div>
          ${(e.log || []).length ? (e.log || []).map(l => `<div class="log-row"><span>${escapeHtml(l.date ? shortDay(l.date) : '')}</span>${escapeHtml(l.note)}</div>`).join('') : '<div class="empty">Nothing logged yet.</div>'}
        </div>
      </div>`;
  }
  function toggleHistory(key) { OPEN.has(key) ? OPEN.delete(key) : OPEN.add(key); render(); }
  // Delete asks inside the card
  document.addEventListener('click', (ev) => {
    const card = ev.target.closest('.entry'); if (!card) return;
    if (ev.target.matches('[data-del]')) { ev.target.hidden = true; card.querySelector('.del-ask').hidden = false; }
    if (ev.target.matches('[data-keep]')) { card.querySelector('[data-del]').hidden = false; card.querySelector('.del-ask').hidden = true; }
  });

  function renderDue() {
    const withDates = ENTRIES.filter(wantsFollowUp);
    const due = withDates.filter(e => e.nextFollowUp <= TODAY).sort((a, b) => a.nextFollowUp.localeCompare(b.nextFollowUp));
    const week = withDates.filter(e => e.nextFollowUp > TODAY && e.nextFollowUp <= addDays(TODAY, 7)).length;
    const box = $('dueBox');
    if (!ENTRIES.length) { box.innerHTML = ''; return; }
    if (!due.length) { box.innerHTML = `<div class="due-box clear">No follow-ups due.${week ? ` ${week} coming up this week.` : ''}</div>`; return; }
    box.innerHTML = `<div class="due-box"><h2>Follow-ups due<span class="n">${due.length}</span></h2>
      ${due.map(e => {
        const m = intro(e), digits = String(e.phone || '').replace(/[^0-9+]/g, '');
        return `<div class="due-row">
          <div class="who"><b>${escapeHtml(e.name)}</b> <span class="cat">· ${escapeHtml((CAT[e.category] || {}).one || '')}${e.contactName ? ' · ' + escapeHtml(e.contactName) : ''}</span>${datesLine(e)}</div>
          <div class="acts">
            ${digits ? `<a class="sms-btn" href="tel:${escapeHtml(digits)}" style="padding:7px 12px;">Call</a>` : ''}
            ${e.email ? `<a class="sms-btn" href="mailto:${escapeHtml(e.email)}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}" style="padding:7px 12px;">Email</a>` : ''}
            <button class="small-btn" onclick="contactedToday('${escapeHtml(e.key)}')">Contacted today</button>
            <button class="small-btn" onclick="snooze('${escapeHtml(e.key)}')">Snooze a week</button>
          </div></div>`; }).join('')}
      ${week ? `<p class="due-later">${week} more coming up this week.</p>` : ''}</div>`;
  }

  function showStatus(kind, msg, html) {
    const s = $('status');
    s.className = 'status ' + kind;
    if (html) s.innerHTML = msg; else s.textContent = msg;
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- Add / edit form ----
  function toggleForm(cat) {
    const el = $('form-' + cat);
    if (el.style.display === 'none') { el.style.display = 'block'; el.innerHTML = formHtml(cat); }
    else el.style.display = 'none';
  }
  function formHtml(cat, existing) {
    const e = existing || {}, v = x => x == null ? '' : escapeHtml(x);
    return `
      <div class="grid2">
        <div><label>Name</label><input type="text" id="f-name-${cat}" value="${v(e.name)}" placeholder="${CAT[cat].placeholder}"></div>
        <div><label>Contact person</label><input type="text" id="f-contactName-${cat}" value="${v(e.contactName)}" placeholder="Optional"></div>
      </div>
      <div class="grid2">
        <div><label>Email</label><input type="email" id="f-email-${cat}" value="${v(e.email)}"></div>
        <div><label>Phone</label><input type="text" id="f-phone-${cat}" value="${v(e.phone)}"></div>
      </div>
      <div class="grid2">
        <div><label>Last contacted</label><input type="date" id="f-dateContacted-${cat}" value="${v(e.dateContacted)}"></div>
        <div><label>Follow up on</label><input type="date" id="f-nextFollowUp-${cat}" value="${v(e.nextFollowUp)}"></div>
      </div>
      <div class="grid2">
        <div><label>Promo code (optional)</label><input type="text" id="f-promoCode-${cat}" value="${v(e.promoCode)}" placeholder="e.g. GUSS10" maxlength="20" style="text-transform:uppercase;"></div>
        <div><label>Discount for their customers</label><input type="number" id="f-promoPct-${cat}" value="${v(e.promoPct)}" min="0" max="50" step="1" placeholder="Blank = tracking only"></div>
      </div>
      <label>Notes</label>
      <input type="text" id="f-notes-${cat}" value="${v(e.notes)}" placeholder="Any context worth remembering">
      <button onclick="submitForm('${cat}'${existing ? `, '${escapeHtml(existing.key)}'` : ''})">${existing ? 'Save changes' : 'Add'}</button>`;
  }
  async function submitForm(cat, key) {
    const name = $('f-name-' + cat).value.trim();
    if (!name) return showStatus('err', 'Name is required.');
    const code = $('f-promoCode-' + cat).value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    const clash = code && ENTRIES.find(x => x.key !== key && String(x.promoCode || '').toUpperCase() === code);
    if (clash) return showStatus('err', `Code ${code} already belongs to ${clash.name}. Pick another.`);
    const base = key ? ENTRIES.find(x => x.key === key) : { category: cat, status: 'Not contacted', log: [] };
    const next = { ...base, category: cat, name,
      contactName: $('f-contactName-' + cat).value.trim(), email: $('f-email-' + cat).value.trim(), phone: $('f-phone-' + cat).value.trim(),
      notes: $('f-notes-' + cat).value.trim(), dateContacted: $('f-dateContacted-' + cat).value, nextFollowUp: $('f-nextFollowUp-' + cat).value,
      promoCode: code, promoPct: $('f-promoPct-' + cat).value === '' ? null : Number($('f-promoPct-' + cat).value) };
    try {
      const result = await api('save-outreach', entryPayload(next));
      if (key) Object.assign(base, next); else ENTRIES.push({ ...next, key: result.key });
      $('form-' + cat).style.display = 'none';
      render();
      showStatus('ok', 'Saved ' + name + '.');
    } catch (err) { showStatus('err', err.message); }
  }
  function editEntry(key) {
    const e = ENTRIES.find(x => x.key === key); if (!e) return;
    const el = $('form-' + e.category);
    el.style.display = 'block'; el.innerHTML = formHtml(e.category, e);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
</script>
</body>
</html>
