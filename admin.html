<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F5F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ready Tote">
<link rel="apple-touch-icon" href="/app-icon-180.png">
<title>Dashboard · Ready Tote Oklahoma admin</title>
<link rel="stylesheet" href="admin-shared.css?v=20261022">
<script src="admin-shared.js?v=20261108"></script>
<style>
  /* Dashboard layout: the cream body is the frame (sidebar on it, no rule),
     the work sits on one white sheet inset 8px from the window's right,
     top and bottom edges.
     Grid at 1440: 1440 - 228 sidebar - 8 inset = 1204 sheet;
     1204 - 2 x 32 padding = 1140 = 732 main + 24 gap + 384 rail. */
  :root{
    --sheet:#FFFFFF;
    --border:#E9E4D8;      /* card edge, about 1.2:1 on white */
    --rule:#F1EDE4;        /* row rules, one step lighter */
    --control:#D6CFBF;     /* control borders, one step darker */
    --muted:#6B6259;       /* the brand's steel, 5.9:1 on white */
    --data:#A87F22;        /* brand gold darkened to 3.6:1 on white, for marks only */
    --track:#EFEBE2;
    --positive:#247B50;
    --negative:#C0392B;
    --pill-go-bg:#E3F4E9;   --pill-go-ink:#14492F;
    --pill-back-bg:#FBF0D6; --pill-back-ink:#6B4C0C;
    --pill-self-bg:#F1EEE7; --pill-self-ink:#4A433B;
  }
  body{padding:8px 8px 8px 236px !important;font-size:15px;line-height:1.45;}
  .sheet{background:var(--sheet);border:1px solid var(--border);border-radius:16px;min-height:calc(100vh - 16px);padding:28px 32px 40px;}
  .num,.fig{font-variant-numeric:tabular-nums;}

  /* Title row */
  .title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:24px;}
  .title-row h1{font-family:'Barlow',Arial,sans-serif;font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-0.01em;margin:0;}
  .finding{margin:4px 0 0;color:var(--ink);font-size:15px;max-width:640px;}
  .finding .when{color:var(--muted);}
  .title-actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .fresh{font-size:13px;color:var(--muted);}
  .linkbtn{all:unset;cursor:pointer;color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control);}
  .linkbtn:hover{text-decoration-color:var(--ink);}
  .linkbtn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:2px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border-radius:6px;font:600 14px/1 'Barlow',Arial,sans-serif;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background .12s ease;}
  .btn.primary{background:var(--ink);color:#fff;border:1px solid var(--ink);}
  .btn.primary:hover{background:#3a342d;}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--control);}
  .btn.ghost:hover{border-color:var(--ink);}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

  /* Grid */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) 384px;gap:24px;align-items:start;}
  .col{display:flex;flex-direction:column;gap:24px;min-width:0;}
  .card{max-width:none;margin:0;background:#fff;border:1px solid var(--border);border-radius:10px;padding:0;box-shadow:none;}
  .card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 20px 12px;}
  .card-head h2{font-family:'Barlow',Arial,sans-serif;font-weight:700;font-size:16px;margin:0;letter-spacing:0;}
  .card-head .count{color:var(--muted);font-weight:500;margin-left:6px;}
  .card-head a,.card-foot a{color:var(--ink);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control);}
  .card-head a:hover,.card-foot a:hover{text-decoration-color:var(--ink);}
  .card-body{padding:0 20px 8px;}
  .card-foot{padding:4px 20px 16px;}
  .empty-line{margin:0 0 12px;padding:10px 12px;border:1px dashed var(--control);border-radius:8px;color:var(--muted);font-size:14px;}

  /* Rows */
  .row{display:grid;align-items:center;gap:4px 16px;padding:12px 0;border-top:1px solid var(--rule);}
  .row:first-child{border-top:none;}
  .who{font-weight:600;color:var(--ink);}
  .meta{color:var(--muted);font-size:13px;}
  .texts .row{grid-template-columns:minmax(0,1fr) auto auto auto;}
  .texts .why{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right;}
  .texts .btn{height:34px;}
  /* After tapping Text: "Sent to Hannah?" in the row, so it can be marked done */
  .texts .ask{grid-column:1 / -1; display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap; margin-top:6px; padding:8px 10px; background:#FAF8F3; border-radius:8px; font-size:14px; font-weight:600;}
  .texts .ask[hidden]{display:none;}
  .texts .ask .btn{height:32px;}
  .texts .sent{display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--rule); font-size:14px; color:var(--muted);}
  .texts .sent b{color:var(--positive); font-weight:600;}
  .texts .sent .linkbtn{margin-left:auto;}

  .day{padding:14px 0 4px;font-size:13px;font-weight:600;color:var(--muted);}
  .day:first-child{padding-top:0;}
  .day b{color:var(--ink);font-weight:700;}
  .sched .row{grid-template-columns:76px 96px minmax(0,1fr) auto;}
  .sched .day + .row{border-top:none;}
  .sched .time{font-size:14px;color:var(--ink);}
  .sched .totes{text-align:right;font-size:14px;color:var(--muted);}
  .kind{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;flex:none;justify-self:start;}
  .kind.go{background:var(--pill-go-bg);color:var(--pill-go-ink);}
  .kind.back{background:var(--pill-back-bg);color:var(--pill-back-ink);}
  .kind.self{background:var(--pill-self-bg);color:var(--pill-self-ink);}
  .kind.due{background:#FFEDEA;color:#831C1E;height:20px;font-size:11px;margin-left:6px;vertical-align:1px;}
  .sched .who a,.sched .meta a{color:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control);}
  .sched .who a:hover,.sched .meta a:hover{text-decoration-color:currentColor;}

  /* Needs you */
  .needs{display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; margin:0 0 20px; padding:12px 14px; border:1px solid var(--border); border-radius:10px; background:#FAF8F3; font-size:14px;}
  .needs[hidden]{display:none;}
  .needs-h{font-weight:700; margin-right:4px;}
  .needs a{color:var(--ink); text-decoration:none; padding:4px 10px; background:#fff; border:1px solid var(--border); border-radius:999px;}
  .needs a:hover{border-color:var(--ink);}
  .needs b{font-weight:700;}
  .needs .rush{color:#831C1E; font-weight:700;}
  .needs-pair{display:inline-flex; align-items:stretch;}
  .needs-pair a{border-radius:999px 0 0 999px;}
  .needs-x{width:auto; margin:0; padding:4px 12px 4px 10px; font-size:13px; font-weight:600; background:#fff; color:var(--steel); border:1px solid var(--border); border-left:none; border-radius:0 999px 999px 0;}
  .needs-x:hover{background:#fff; color:var(--ink); border-color:var(--ink);}
  .texts .skip{font-size:12px; color:var(--muted);}
  .otw{display:block; margin-top:6px;}
  .otw .btn{height:30px; padding:0 10px; font-size:13px;}
  .mark{display:block; margin-top:6px;}
  .mark .btn{height:30px; padding:0 10px; font-size:13px; width:auto;}
  .marked{display:block; margin-top:6px; font-size:12px; font-weight:600; color:#14492F;}
  .marked .linkbtn{font-size:12px; margin-left:4px;}
  .unpaid .pay-acts{display:flex; align-items:center; gap:12px; grid-column:1 / -1; margin-top:4px;}
  .unpaid .pay-acts .btn{width:auto; flex:none;}
  .unpaid .pay-acts .linkbtn{white-space:nowrap;}
  .unpaid .ask{grid-column:1 / -1; display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap; margin-top:6px; padding:8px 10px; background:#FAF8F3; border-radius:8px; font-size:14px; font-weight:600;}
  .unpaid .ask[hidden]{display:none;}

  /* Unpaid invoices */
  .unpaid .owed{display:flex;justify-content:space-between;align-items:baseline;padding:0 0 10px;}
  .unpaid .owed .lbl{font-size:14px;color:var(--muted);}
  .unpaid .owed .big{font-size:22px;font-weight:600;}
  .unpaid .row{grid-template-columns:minmax(0,1fr) auto;}
  .unpaid .amt{font-size:14px;font-weight:600;text-align:right;}
  .unpaid .btn{height:32px;padding:0 12px;font-size:13px;}

  /* Tote fleet: one segment per active rental, seams between them, the shelf as the grey track */
  .fleet-figs{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;}
  .fleet-figs .big{font-size:30px;font-weight:600;line-height:1;color:var(--ink);}
  .fleet-figs .lbl{font-size:13px;color:var(--muted);margin-top:6px;}
  .fleet-figs .right{text-align:right;}
  .fleet-figs .right .big{font-size:22px;font-weight:500;}
  .bar{display:flex;gap:2px;height:14px;margin:14px 0 6px;border-radius:3px;overflow:hidden;background:var(--track);}
  .bar span{display:block;height:100%;background:var(--data);}
  .bar span.over{background:var(--negative);}
  .bar span.held{background:repeating-linear-gradient(135deg,var(--data) 0 3px,#E7D6AE 3px 6px);}
  .held-line{display:flex;align-items:center;gap:8px;margin:0 0 8px;}
  .held-line .swatch{flex:none;width:12px;height:12px;border-radius:2px;background:repeating-linear-gradient(135deg,var(--data) 0 3px,#E7D6AE 3px 6px);}
  .held-line a,.dolly-line a{color:var(--ink);font-weight:600;}
  .dolly-line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 0 8px;padding:10px 0 0;border-top:1px solid var(--rule);font-size:14px;}
  .bar-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px;}
  .notice{margin:8px 0 12px;padding:8px 12px;border-radius:6px;background:#FFEDEA;color:#831C1E;font-size:13px;font-weight:600;}
  .back-list .row{grid-template-columns:minmax(0,1fr) auto auto;padding:10px 0;}
  .back-list .totes,.back-list .date{font-size:14px;text-align:right;}
  .back-list .date{min-width:72px;color:var(--muted);}

  /* Money */
  .seg{display:flex;gap:2px;padding:2px;background:var(--track);border-radius:8px;margin:0 20px 16px;}
  .seg button{all:unset;box-sizing:border-box;flex:1;text-align:center;height:30px;line-height:28px;border:1px solid transparent;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
  .seg button:hover{color:var(--ink);}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:var(--border);}
  .seg button:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  .net .lbl{font-size:14px;color:var(--muted);}
  .net .big{font-size:30px;font-weight:600;line-height:1.15;margin-top:2px;}
  .net .delta{font-size:13px;color:var(--muted);margin-top:4px;}
  .net .delta .up{color:var(--positive);font-weight:600;}
  .net .delta .down{color:var(--negative);font-weight:600;}
  .kv{margin:12px 0 4px;}
  .kv .row{grid-template-columns:1fr auto;padding:9px 0;font-size:14px;}
  .kv .row > :last-child{text-align:right;font-weight:600;}
  .kv .sub{display:block;font-size:12px;color:var(--muted);font-weight:400;}

  /* Loading: the final layout with grey bars at real size */
  .skel{display:block;height:14px;margin:14px 0;border-radius:3px;background:var(--track);}
  .skel.w60{width:60%;} .skel.w40{width:40%;} .skel.w80{width:80%;}
  .status{margin:0 0 16px;}

  footer{margin:24px 0 0;font-size:13px;color:var(--muted);}
  footer a{color:var(--ink);}

  @media(max-width:1100px){
    .grid{grid-template-columns:minmax(0,1fr);}
  }
  @media(max-width:760px){
    body{padding:48px 0 0 !important;}
    .sheet{border:none;border-radius:0;min-height:0;padding:20px 16px 32px;}
    .title-row{align-items:flex-start;}
    .title-actions{width:100%;justify-content:space-between;}
    .card-head,.card-body,.card-foot{padding-left:16px;padding-right:16px;}
    .seg{margin-left:16px;margin-right:16px;}
    .sched .row{grid-template-columns:64px minmax(0,1fr) auto;}
    .sched .row .kind{grid-column:2;grid-row:1;}
    .sched .row .person{grid-column:2 / -1;grid-row:2;}
    .sched .row .time{grid-row:1 / span 2;align-self:start;padding-top:2px;}
    .sched .row .totes{grid-column:3;grid-row:1;}
    .texts .row{grid-template-columns:minmax(0,1fr) auto;}
    .unpaid .row{grid-template-columns:minmax(0,1fr) auto;}
    .unpaid .row .btn{grid-column:1 / -1;justify-self:start;height:40px;}
    .texts .why{grid-column:1;grid-row:2;text-align:left;}
    .texts .row .btn{grid-column:2;grid-row:1 / span 2;min-height:44px;}
    .texts .row .skip{grid-column:2;grid-row:3;justify-self:center;}
    .needs a{flex:1 1 100%;}
    .needs-pair{flex:1 1 100%;}
    .needs-pair a{flex:1 1 auto;}
  }
</style>
</head>
<body>
<nav class="admin-nav" aria-label="Admin tools">
  <a href="admin.html" aria-current="page">Dashboard</a>
  <a href="admin-requests.html">Requests</a>
  <a href="admin-invoice.html">Send Invoice</a>
  <a href="admin-invoice.html?mode=log">Add Rental</a>
  <a href="admin-reminders.html">Reminders</a>
  <a href="admin-rentals.html">All Rentals</a>
  <a href="admin-contacts.html">Contacts</a>
  <a href="admin-finance.html">Finance</a>
  <a href="admin-outreach.html">Outreach</a>
  <a href="admin-inventory.html">Inventory</a>
</nav>

<main class="sheet">
  <input type="hidden" id="secret">

  <div class="title-row">
    <div>
      <h1>Dashboard</h1>
      <p class="finding" id="finding"><span class="when">Loading today's jobs…</span></p>
    </div>
    <div class="title-actions">
      <span class="fresh" id="fresh"></span>
      <button type="button" class="linkbtn" id="loadBtn">Refresh</button>
      <a class="btn primary" id="primaryAction" href="admin-invoice.html?mode=log">Add rental</a>
    </div>
  </div>

  <div class="status" id="status"></div>
  <div class="needs" id="needs" hidden></div>

  <div class="grid">
    <div class="col">
      <section class="card texts" aria-labelledby="textsTitle">
        <div class="card-head">
          <h2 id="textsTitle">Texts to send today<span class="count num" id="textsCount"></span></h2>
          <a href="admin-reminders.html">Reminders</a>
        </div>
        <div class="card-body" id="textsList"><span class="skel w80"></span><span class="skel w60"></span><span class="skel w80"></span></div>
      </section>

      <section class="card sched" aria-labelledby="schedTitle">
        <div class="card-head">
          <h2 id="schedTitle">Next 7 days<span class="count num" id="schedCount"></span></h2>
          <a href="admin-rentals.html">All rentals</a>
        </div>
        <div class="card-body" id="schedList"><span class="skel w80"></span><span class="skel w60"></span><span class="skel w80"></span><span class="skel w40"></span></div>
      </section>
    </div>

    <div class="col">
      <section class="card" aria-labelledby="fleetTitle">
        <div class="card-head">
          <h2 id="fleetTitle">Totes</h2>
          <a href="admin-inventory.html">Inventory</a>
        </div>
        <div class="card-body" id="fleet"><span class="skel w60"></span><span class="skel w80"></span></div>
      </section>

      <section class="card unpaid" aria-labelledby="unpaidTitle">
        <div class="card-head">
          <h2 id="unpaidTitle">Unpaid invoices<span class="count num" id="unpaidCount"></span></h2>
          <a href="admin-reminders.html">Reminders</a>
        </div>
        <div class="card-body" id="unpaidList"><span class="skel w80"></span><span class="skel w60"></span></div>
      </section>

      <section class="card" aria-labelledby="moneyTitle">
        <div class="card-head">
          <h2 id="moneyTitle">Money</h2>
          <a href="admin-finance.html">Finance</a>
        </div>
        <div class="seg" id="periodToggle" role="group" aria-label="Period">
          <button type="button" data-period="week" aria-pressed="false">7 days</button>
          <button type="button" data-period="month" aria-pressed="true">Month</button>
          <button type="button" data-period="year" aria-pressed="false">Year</button>
          <button type="button" data-period="all" aria-pressed="false">All</button>
        </div>
        <div class="card-body" id="money"><span class="skel w40"></span><span class="skel w80"></span></div>
      </section>
    </div>
  </div>

  <footer><a href="/">readytoteokc.com</a></footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  $('secret').value = adminSessionMarker();   // signed-in marker; the session cookie is what the server checks

  $('loadBtn').addEventListener('click', load);

  // Coming back to this tab (say, from Messages after texting someone)
  // refreshes the numbers, at most once a minute. Open "Sent to X?" questions
  // stay open through the refresh.
  let LOADED_AT = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && TODAY && Date.now() - LOADED_AT > 60000 && !$('loadBtn').disabled) load();
  });
  // Auto-load if secret is saved
  if ($('secret').value) load();

  const priceNum = p => { const m = String(p||'').replace(/[^0-9.]/g,''); return m ? parseFloat(m) : 0; };
  const sumPrice = arr => arr.reduce((t,r) => t + priceNum(r.price), 0);
  const moneyDec = n => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

  let DATA = { rentals: [], expenses: [], mileage: [], invEvents: [], requests: [], paidFlags: {}, sentFlags: {} };
  let TODAY = '';
  let PERIOD = 'month';

  document.querySelectorAll('#periodToggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#periodToggle button').forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      PERIOD = btn.dataset.period;
      renderMoney();
    });
  });

  async function load() {
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret.');
    const btn = $('loadBtn');
    btn.disabled = true; btn.textContent = 'Refreshing…';
    try {
      const [rResp, fResp, iResp, qResp] = await Promise.all([
        post('get-rentals', { secret }),
        post('finance', { secret, action: 'list' }),
        post('tote-stock', { secret, action: 'list' }),
        post('get-requests', { secret }),
      ]);
      if ([rResp, fResp, iResp, qResp].some(r => r.status === 401)) return showErr('Wrong admin secret. Log out and sign in again.');
      if (![rResp, fResp, iResp, qResp].every(r => r.ok)) return showErr(loadFailedMsg('Some data didn\'t load.'));

      const rd = await rResp.json();
      const fd = await fResp.json();
      const id = await iResp.json();
      const qd = await qResp.json();

      DATA.rentals = (rd.rentals || []).filter(r => !r.cancelled);   // cancelled rentals count nowhere
      DATA.reminders = rd.reminders || { delivery: [], pickup: [], review: [] };
      DATA.paidFlags = rd.paidFlags || {};
      DATA.paidVia = rd.paidVia || {};
      DATA.sentFlags = rd.sentFlags || {};
      DATA.expenses = fd.expenses || [];
      DATA.stripeFees = fd.stripeFees || { pct: 2.9, fixed: 0.3 };
      DATA.mileage = fd.mileage || [];
      DATA.tripSkips = fd.tripSkips || {};
      DATA.invEvents = id.events || [];
      DATA.requests = qd.requests || [];
      DATA.mileageRates = fd.mileageRates || [];
      DATA.taxPct = fd.taxPct ?? 25;
      DATA.reviewLinkMissing = !!rd.reviewLinkMissing;
      // Partner follow-ups are a nice-to-have; the page works without them
      DATA.outreach = await post('get-outreach', { secret }).then(r => r.ok ? r.json() : {}).then(d => d.entries || []).catch(() => []);
      TODAY = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });

      render();
      $('status').style.display = 'none';
      LOADED_AT = Date.now();
      $('fresh').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago' });
    } catch { showErr(loadFailedMsg('Network error. This only works on the live site.')); }
    finally { btn.disabled = false; btn.textContent = 'Refresh'; }
  }

  function loadFailedMsg(m) {
    return TODAY ? `${m} Showing data from ${$('fresh').textContent.replace('Updated ', '')}.` : m;
  }

  function post(fn, body) {
    return fetch('/.netlify/functions/' + fn, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
  }

  // Any stored time ("14:30" or "2:30 PM") -> "2:30 PM" for display
  function fmtTime(t) {
    const m = String(t || '').trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return t || '';
    const h = parseInt(m[1], 10);
    return (h % 12 || 12) + ':' + m[2] + ' ' + (h >= 12 ? 'PM' : 'AM');
  }
  // Sort key in minutes since midnight, works for either format
  function timeKey(t) {
    const m = String(t || '').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
    if (!m) return 0;
    let h = parseInt(m[1], 10);
    if (m[3]) { const pm = m[3].toUpperCase() === 'PM'; if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0; }
    return h * 60 + parseInt(m[2], 10);
  }
  // "Today", "Tomorrow", else "Thu, Oct 22"
  function dayName(iso) {
    if (iso === TODAY) return 'Today';
    if (iso === shiftDate(TODAY, 1)) return 'Tomorrow';
    return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  const shortDate = iso => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const cityOf = addr => { const parts = String(addr || '').split(',').map(s => s.trim()); return parts.length >= 3 ? parts[parts.length - 2] : ''; };

  function render() {
    const { rentals, reminders, invEvents, requests } = DATA;
    const today = TODAY;

    // Out right now: by the drop-off/pickup time on the day itself (rentalPhase)
    const activeRentals = rentals.filter(r => rentalPhase(r) === 'out');
    // Same as "waiting on you" on Requests: new, reviewed, and confirmed (ready to invoice)
    const waitingReqs = requests.filter(r => ['new', 'reviewed', 'confirmed'].includes(r.status));
    const pendingRequests = waitingReqs.length;

    const ADD_TYPES = ['purchased', 'returned-to-service'];
    // Same math as the Inventory page: real tote counts on each rental, and
    // requests awaiting or confirmed (not invoiced yet) hold their totes too.
    // Dolly stock changes are tracked separately; events with no item are totes.
    const owned = item => invEvents.filter(e => (e.item === 'dolly') === (item === 'dolly') && e.date <= today)
      .reduce((t,e) => t + (ADD_TYPES.includes(e.type) ? e.quantity : -e.quantity), 0);
    const totalTotesOwned = owned('tote');
    const totesDeployed = activeRentals.reduce((t,r) => t + toteQty(r), 0);
    const heldToday = findPendingConfirmed(requests, rentals)
      .filter(p => p.estTotes > 0 && p.deliveryDate <= today && p.pickupDate >= today);
    const totesHeld = heldToday.reduce((t,p) => t + p.estTotes, 0);
    const totesAvailable = totalTotesOwned - totesDeployed - totesHeld;
    const dolliesTracked = invEvents.some(e => e.item === 'dolly');
    const dolliesOut = activeRentals.reduce((t,r) => t + dollyQty(r), 0) + heldToday.reduce((t,p) => t + (p.estDollies || 0), 0);
    const dolliesFree = owned('dolly') - dolliesOut;
    const isUnpaid = r => !!r.invoicedAt && !r.backfilled && !DATA.paidFlags[r.key];

    // ---- Texts to send ----
    const allTexts = [
      ...reminders.delivery.map(r => ({ ...r, why: r.dropoffDate === today ? 'Delivery today' : 'Delivery tomorrow' })),
      ...(reminders.pickupTomorrow || []).map(r => ({ ...r, why: r.pickupDate === today ? 'Pickup today' : 'Pickup tomorrow' })),
      ...reminders.pickup.map(r => ({ ...r, why: 'Pickup in 2 days' })),
      ...(reminders.addressCheck || []).map(r => ({ ...r, why: r.pickupDate === shiftDate(today, 2) ? 'Pickup and address check' : 'Confirm address' })),
      ...(reminders.followup || []).map(r => ({ ...r, why: 'Invoice follow-up' })),
      ...reminders.review.map(r => ({ ...r, why: 'Ask for a review' })),
    ].map(r => ({ ...r, why: r.why + (r.overdue ? ' · overdue' : '') }));
    $('textsCount').textContent = allTexts.length ? ' ' + allTexts.length : '';
    const firstName = r => esc(String(r.name || '').split(' ')[0] || 'them');
    $('textsList').innerHTML = (allTexts.length ? allTexts.map(r => `
      <div class="row" data-flag="${escAttr(r.flagId)}">
        <div class="person">
          <div class="who">${esc(r.name)}</div>
          <div class="meta"><span class="num">${esc(fmtPhone(r.phone))}</span> · ${plural(toteQty(r), 'tote')}</div>
        </div>
        <div class="why">${r.why}</div>
        <a class="btn ghost" data-text href="${escAttr(r.sms)}">Text ${firstName(r)}</a>
        <div class="ask"${OPEN_ASKS.has(r.flagId) ? '' : ' hidden'}>
          <span>Sent to ${firstName(r)}?</span>
          <button type="button" class="btn primary" data-yes data-why="${escAttr(r.why)}" data-name="${escAttr(r.name)}">Yes, sent</button>
          <button type="button" class="linkbtn" data-no>Not yet</button>
        </div>
        <button type="button" class="linkbtn skip" data-skip data-why="${escAttr(r.why)}" data-name="${escAttr(r.name)}">Skip</button>
      </div>`).join('') : '<p class="empty-line">No texts due today.</p>')
      + JUST_SENT.map(x => `
      <div class="sent"><span><b>${x.skipped ? 'Skipped' : 'Sent'}</b> ${x.skipped ? '' : 'to '}${esc(x.name)} · ${esc(x.why)}</span><button type="button" class="linkbtn" data-undo="${escAttr(x.flagId)}">Undo</button></div>`).join('');

    // ---- Next 7 days ----
    const endDate = shiftDate(today, 7);
    const events = [];
    for (const r of rentals) {
      const self = r.serviceType === 'self';
      if (r.dropoffDate >= today && r.dropoffDate <= endDate) {
        events.push({ key: r.key, leg: 'delivery', date: r.dropoffDate, time: r.dropoffTime || '', kind: self ? 'Customer pickup' : 'Deliver',
          cls: self ? 'self' : 'go', name: r.name, phone: r.phone, totes: toteQty(r), unpaid: isUnpaid(r),
          addr: self ? '' : dropoffAddressOf(r), self, marked: r.deliveredAt || '' });
      }
      if (r.pickupDate >= today && r.pickupDate <= endDate) {
        events.push({ key: r.key, leg: 'pickup', date: r.pickupDate, time: r.pickupTime || '', kind: self ? 'Customer return' : 'Pick up',
          cls: self ? 'self' : 'back', name: r.name, phone: r.phone, totes: toteQty(r), unpaid: false,
          addr: self ? '' : pickupAddressOf(r), self, marked: r.pickedUpAt || '' });
      }
    }
    events.sort((a,b) => a.date.localeCompare(b.date) || timeKey(a.time) - timeKey(b.time));
    $('schedCount').textContent = events.length ? ' ' + events.length : '';
    let lastDay = '';
    $('schedList').innerHTML = events.length ? events.map(e => {
      const head = e.date !== lastDay ? `<div class="day"><b>${dayName(e.date)}</b>${e.date === today || e.date === shiftDate(today, 1) ? ' · ' + shortDate(e.date) : ''}</div>` : '';
      lastDay = e.date;
      return head + `
      <div class="row">
        <div class="time num">${esc(fmtTime(e.time)) || '<span class="meta">—</span>'}</div>
        <span class="kind ${e.cls}">${e.kind}</span>
        <div class="person">
          <div class="who">${e.phone ? `<a href="tel:${escAttr(normalizePhone(e.phone))}" title="Call ${escAttr(e.name)}">${esc(e.name)}</a>` : esc(e.name)}${e.unpaid ? ' <span class="kind due">Unpaid</span>' : ''}</div>
          <div class="meta">${e.addr ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.addr)}" target="_blank" rel="noopener" title="Open in Maps">${esc(e.addr)}</a>` : 'At our place'}</div>
        </div>
        <div class="totes num">${e.totes || '—'} totes${e.date === today && e.addr && e.phone && !e.marked ? `<span class="otw" data-otw="${escAttr(e.key)}" data-leg="${e.leg}"><button type="button" class="btn ghost">On the way</button></span>` : ''}${e.date === today ? markHtml(e) : ''}</div>
      </div>`;
    }).join('') : '<p class="empty-line">Nothing scheduled in the next 7 days.</p>';

    // ---- Finding line under the title ----
    const nextOut = events.find(e => e.cls === 'go');
    const parts = [];
    parts.push(allTexts.length ? plural(allTexts.length, 'text') + ' to send' : 'No texts due');
    if (nextOut) {
      const when = nextOut.date === today ? 'today' : nextOut.date === shiftDate(today, 1) ? 'tomorrow' : dayName(nextOut.date);
      const city = cityOf(nextOut.addr);
      parts.push(`next delivery ${when}${nextOut.time ? ' at ' + fmtTime(nextOut.time) : ''}, ${nextOut.name}${city ? ' in ' + city : ''}`);
    }
    if (totesAvailable < 0) parts.push(`${Math.abs(totesAvailable)} totes oversold`);
    const longDay = new Date(today + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    $('finding').innerHTML = `<span class="when">${longDay} ·</span> ${esc(parts.join(' · '))}.`;

    // ---- Primary action follows the waiting work ----
    const pa = $('primaryAction');
    if (pendingRequests > 0) { pa.href = 'admin-requests.html'; pa.textContent = `Review ${plural(pendingRequests, 'request')}`; }
    else { pa.href = 'admin-invoice.html?mode=log'; pa.textContent = 'Add rental'; }

    // ---- Tote fleet ----
    const scale = Math.max(totalTotesOwned, totesDeployed + totesHeld) || 1;
    const segs = activeRentals.slice().sort((a,b) => a.pickupDate.localeCompare(b.pickupDate));
    let used = 0;
    const segHtml = segs.map(r => {
      const n = toteQty(r);
      const fits = Math.max(0, Math.min(n, totalTotesOwned - used));
      const over = n - fits;
      used += n;
      return (fits ? `<span style="flex:0 0 calc(${(fits/scale*100).toFixed(3)}% - 2px)" title="${escAttr(r.name)}: ${n} totes"></span>` : '')
        + (over ? `<span class="over" style="flex:0 0 calc(${(over/scale*100).toFixed(3)}% - 2px)" title="${over} oversold"></span>` : '');
    }).join('') + (totesHeld ? `<span class="held" style="flex:0 0 calc(${(Math.max(0, Math.min(totesHeld, totalTotesOwned - used))/scale*100).toFixed(3)}% - 2px)" title="${totesHeld} held for bookings not invoiced yet"></span>` : '');
    const backRows = segs.slice(0, 4).map(r => `
      <div class="row">
        <div class="who">${esc(r.name)}</div>
        <div class="totes num">${toteQty(r)}</div>
        <div class="date num">${r.pickupDate === today ? 'Today' : r.pickupDate === shiftDate(today, 1) ? 'Tomorrow' : shortDate(r.pickupDate)}</div>
      </div>`).join('');
    $('fleet').innerHTML = `
      <div class="fleet-figs">
        <div><div class="big num">${totesAvailable}</div><div class="lbl">${totesHeld ? 'free to book' : 'on the shelf'}</div></div>
        <div class="right"><div class="big num">${totesDeployed}</div><div class="lbl">out with ${plural(activeRentals.length, 'customer')}</div></div>
      </div>
      <div class="bar" role="img" aria-label="${totesDeployed} of ${totalTotesOwned} totes out with customers">${segHtml}</div>
      <div class="bar-scale num"><span>0</span><span>${totalTotesOwned} owned</span></div>
      ${totesHeld ? `<div class="meta held-line"><span class="swatch"></span>${totesHeld} held for ${plural(heldToday.length, 'booking')} not invoiced yet. <a href="admin-inventory.html">See them</a></div>` : ''}
      ${dolliesTracked
        ? `<div class="dolly-line"><span class="num"><b>${dolliesFree}</b> ${dolliesFree === 1 ? 'dolly' : 'dollies'} free</span><span class="meta num">${dolliesOut} out · ${owned('dolly')} owned</span></div>`
        : dolliesOut ? `<div class="dolly-line"><span class="num"><b>${dolliesOut}</b> ${dolliesOut === 1 ? 'dolly' : 'dollies'} out</span><a class="meta" href="admin-inventory.html">Track dollies owned</a></div>` : ''}
      ${totesAvailable < 0 ? `<div class="notice">${Math.abs(totesAvailable)} totes oversold. Check availability before booking more.</div>` : ''}
      ${dolliesTracked && dolliesFree < 0 ? `<div class="notice">${Math.abs(dolliesFree)} ${Math.abs(dolliesFree) === 1 ? 'dolly' : 'dollies'} oversold.</div>` : ''}
      ${segs.length ? `<div class="meta" style="margin-top:12px">Coming back, soonest first</div><div class="back-list">${backRows}</div>` : '<p class="empty-line">No totes out right now.</p>'}`;

    renderUnpaid(isUnpaid);
    renderNeeds(today);
    renderMoney();
  }

  // ---- Unpaid invoices ----
  // Invoiced, not marked paid, oldest invoice first. Paid flags come from
  // Stripe automatically (stripe-webhook) or from Mark paid on Reminders.
  function renderUnpaid(isUnpaid) {
    const list = DATA.rentals.filter(isUnpaid)
      .sort((a,b) => (a.invoicedAt || '').localeCompare(b.invoicedAt || ''));
    const total = sumPrice(list);
    $('unpaidCount').textContent = list.length ? ' ' + list.length : '';
    if (!list.length) { $('unpaidList').innerHTML = '<p class="empty-line">Every invoice is paid.</p>'; return; }
    const ago = iso => {
      const days = Math.round((Date.parse(TODAY + 'T12:00:00Z') - Date.parse(String(iso).slice(0,10) + 'T12:00:00Z')) / 864e5);
      return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
    };
    $('unpaidList').innerHTML = `
      <div class="owed"><span class="lbl">Outstanding</span><span class="big num">${moneyDec(total)}</span></div>` + list.map(r => {
      const reminded = DATA.sentFlags['emailReminder:' + r.key];
      const late = r.dropoffDate && r.dropoffDate <= shiftDate(TODAY, 2);
      const canEmail = r.email && r.stripeUrl;
      return `
      <div class="row" data-key="${escAttr(r.key)}">
        <div class="person">
          <div class="who">${esc(r.name)}${late ? ' <span class="kind due">' + (r.dropoffDate < TODAY ? 'Out now' : 'Soon') + '</span>' : ''}</div>
          <div class="meta">Invoiced ${ago(r.invoicedAt)}${r.dropoffDate ? ' · drop-off ' + dayName(r.dropoffDate).replace(/^(Today|Tomorrow)$/, d => d.toLowerCase()) : ''}${reminded ? ' · emailed ' + shortDate(String(reminded).slice(0,10)) : ''}${canEmail ? '' : ' · no payment link on file'}</div>
        </div>
        <div class="amt num">${moneyDec(priceNum(r.price))}</div>
        <div class="pay-acts">
          ${canEmail ? `<button type="button" class="btn ghost" data-remind>${reminded ? 'Email again' : 'Email reminder'}</button>` : ''}
          <button type="button" class="linkbtn" data-paid>Mark paid</button>
        </div>
        <div class="ask" data-remind-ask hidden>
          <span>Email ${esc(String(r.name || '').split(' ')[0])} a reminder with the payment link?</span>
          <button type="button" class="btn primary" data-remind-yes>Send</button>
          <button type="button" class="linkbtn" data-remind-no>Cancel</button>
        </div>
      </div>`;
    }).join('');
  }
  $('unpaidList').addEventListener('click', async (e) => {
    const row = e.target.closest('.row'); if (!row) return;
    const ask = row.querySelector('[data-remind-ask]');
    if (e.target.closest('[data-remind]')) { ask.hidden = false; return; }
    if (e.target.closest('[data-remind-no]')) { ask.hidden = true; return; }
    if (e.target.closest('[data-paid]')) {
      const name = row.querySelector('.who').firstChild.textContent;
      try {
        const resp = await post('mark-paid', { secret: $('secret').value.trim(), key: row.dataset.key });
        if (!resp.ok) throw new Error();
        DATA.paidFlags[row.dataset.key] = new Date().toISOString();
        render();
        const st = $('status'); st.className = 'status ok'; st.style.display = 'block';
        st.innerHTML = `Marked ${esc(name)} paid. <button type="button" class="linkbtn" id="undoPaid" data-key="${escAttr(row.dataset.key)}">Undo</button>`;
      } catch { showErr('Couldn’t mark that paid. Try again.'); }
      return;
    }
    const btn = e.target.closest('[data-remind-yes]');
    if (!btn) return;
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const resp = await post('send-payment-reminder', { secret: $('secret').value.trim(), key: row.dataset.key });
      if (!resp.ok) throw new Error(await resp.text().catch(() => ''));
      DATA.sentFlags['emailReminder:' + row.dataset.key] = new Date().toISOString();
      for (const k of Object.keys(DATA.reminders)) DATA.reminders[k] = (DATA.reminders[k] || []).filter(x => x.flagId !== 'emailReminder:' + row.dataset.key);
      render();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Send';
      showErr('Couldn’t send the reminder. ' + (err.message || 'Network error.'));
    }
  });
  $('status').addEventListener('click', async (e) => {
    const u = e.target.closest('#undoPaid'); if (!u) return;
    try {
      const resp = await post('mark-paid', { secret: $('secret').value.trim(), key: u.dataset.key, paid: false });
      if (!resp.ok) throw new Error();
      delete DATA.paidFlags[u.dataset.key];
      $('status').style.display = 'none';
      render();
    } catch { showErr('Couldn’t undo. Mark it unpaid on All rentals.'); }
  });

  // ---- On the way: live ETA text for today's jobs (same as All rentals) ----
  $('schedList').addEventListener('click', async (e) => {
    const wrap = e.target.closest('[data-otw]'); if (!wrap || !e.target.closest('button')) return;
    const b = wrap.querySelector('button'); b.disabled = true; b.textContent = 'Working out ETA…';
    try {
      const resp = await post('on-my-way', { secret: $('secret').value.trim(), key: wrap.dataset.otw, type: wrap.dataset.leg, origin: sessionStorage.getItem('rto-admin-startfrom') || '' });
      const d = await resp.json().catch(() => ({}));
      if (!resp.ok || d.error) throw new Error(d.error || 'Couldn’t work out the ETA.');
      wrap.innerHTML = `<a class="btn ghost" href="${escAttr(d.sms)}">${d.arrivalTime ? `Text ETA (${esc(d.arrivalTime)})` : 'Text: on our way'}</a>`;
      if (d.warning) showErr('No ETA in the text. ' + d.warning);
    } catch (err) { b.disabled = false; b.textContent = 'On the way'; showErr(err.message); }
  });

  // ---- Clear "trips not logged" (they don't need a mileage log) ----
  let UNLOGGED = [];
  $('needs').addEventListener('click', async (e) => {
    if (!e.target.closest('[data-clear-trips]')) return;
    const trips = UNLOGGED.slice();
    if (!trips.length || !confirm(`Clear ${plural(trips.length, 'trip')} from "not logged"? Use this for trips that don't need a mileage log. You can bring them back from Finance.`)) return;
    try {
      const resp = await post('finance', { secret: $('secret').value.trim(), action: 'skipTrips', trips });
      if (!resp.ok) throw new Error();
      DATA.tripSkips = (await resp.json()).tripSkips || {};
      render();
      const st = $('status');
      st.className = 'status ok'; st.style.display = 'block';
      st.innerHTML = `Cleared ${esc(plural(trips.length, 'trip'))}. <button type="button" class="linkbtn" id="undoTrips">Undo</button>`;
      $('undoTrips').onclick = async () => {
        const r2 = await post('finance', { secret: $('secret').value.trim(), action: 'unskipTrips', trips });
        if (!r2.ok) return showErr('Couldn’t undo. Bring them back from Finance.');
        DATA.tripSkips = (await r2.json()).tripSkips || {};
        st.style.display = 'none';
        render();
      };
    } catch { showErr('Couldn’t clear those trips. Try again.'); }
  });

  // ---- Delivered / Picked up: tap when it actually happens ----
  // Marking overrides the clock (rentalPhase): a delivered rental stays out
  // until it's marked picked up, and shows as a late pickup after its time.
  const MARK_LABEL = (leg, self) => leg === 'delivery' ? (self ? 'Handed off' : 'Delivered') : (self ? 'Returned' : 'Picked up');
  function markHtml(e) {
    const mark = e.leg === 'delivery' ? 'delivered' : 'pickedUp';
    return e.marked
      ? `<span class="marked">${MARK_LABEL(e.leg, e.self)} ${esc(markText(e.marked).split(', ').pop())} <button type="button" class="linkbtn" data-mark="${mark}" data-unmark="1" data-key="${escAttr(e.key)}">Undo</button></span>`
      : `<span class="mark"><button type="button" class="btn ghost" data-mark="${mark}" data-key="${escAttr(e.key)}">${MARK_LABEL(e.leg, e.self)}</button></span>`;
  }
  async function setMark(key, mark, undo) {
    const resp = await post('edit-rental', { secret: $('secret').value.trim(), key, mark, ...(undo ? { undo: true } : {}) });
    if (!resp.ok) throw new Error(await resp.text().catch(() => ''));
    const d = await resp.json();
    const r = DATA.rentals.find(x => x.key === key);
    if (r) {
      if (d.deliveredAt) r.deliveredAt = d.deliveredAt; else delete r.deliveredAt;
      if (d.pickedUpAt) r.pickedUpAt = d.pickedUpAt; else delete r.pickedUpAt;
    }
    render();
    refreshBadge();
  }
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-mark]'); if (!b) return;
    b.disabled = true;
    try { await setMark(b.dataset.key, b.dataset.mark, !!b.dataset.unmark); }
    catch { b.disabled = false; showErr('Couldn’t save that. Try again.'); }
  });

  // ---- Needs you: one line per kind of waiting work, only when there is some ----
  function renderNeeds(today) {
    const lines = [];
    const waiting = DATA.requests.filter(r => ['new', 'reviewed', 'confirmed'].includes(r.status));
    if (waiting.length) {
      const oldest = waiting.reduce((m, r) => !m || (r.submittedAt || '') < (m.submittedAt || '') ? r : m, null);
      const days = oldest && oldest.submittedAt ? Math.floor((Date.now() - new Date(oldest.submittedAt)) / 864e5) : 0;
      const rush = waiting.filter(r => r.deliveryDate >= today && isRushBooking(r.submittedAt, r.deliveryDate, windowStart(r.deliveryWindow))).length;
      lines.push(`<a href="admin-requests.html"><b>${plural(waiting.length, 'request')}</b> waiting on you${days ? `, oldest ${plural(days, 'day')}` : ''}${rush ? ` · <span class="rush">${rush} rush</span>` : ''}</a>`);
    }
    const LEGACY_NO = s => /^not interested$/i.test(s || '');
    const dueOut = (DATA.outreach || []).filter(o => o.nextFollowUp && o.nextFollowUp <= today && !LEGACY_NO(o.status));
    if (dueOut.length) lines.push(`<a href="admin-outreach.html"><b>${plural(dueOut.length, 'partner follow-up')}</b> due${dueOut.length <= 2 ? ': ' + esc(dueOut.map(o => o.name).join(', ')) : ''}</a>`);
    // Deliveries and pickups in the last 30 days with no mileage logged (same match as Finance)
    const since = shiftDate(today, -30);
    const unlogged = [];   // [{ key, leg }], cleared ones (tripSkips) left out
    for (const r of DATA.rentals) {
      if (r.serviceType === 'self') continue;
      for (const [leg, date] of [['delivery', r.dropoffDate], ['pickup', r.pickupDate]]) {
        if (!date || date < since || date > today) continue;
        const firstName = String(r.name || '').toLowerCase().split(' ')[0];
        const logged = DATA.mileage.some(m => (m.rentalKey === r.key && m.leg === leg) || (!m.rentalKey && m.date === date && firstName && String(m.purpose || '').toLowerCase().includes(firstName)));
        if (!logged && !(DATA.tripSkips || {})[r.key + ':' + leg]) unlogged.push({ key: r.key, leg });
      }
    }
    UNLOGGED = unlogged;
    if (unlogged.length) lines.push(`<span class="needs-pair"><a href="admin-finance.html#mileage"><b>${plural(unlogged.length, 'trip')}</b> not logged in mileage yet</a><button type="button" class="needs-x" data-clear-trips title="Clear: these don't need a mileage log">Clear</button></span>`);
    // Marked delivered, pickup time has passed, not marked picked up yet
    const late = DATA.rentals.filter(r => isLatePickup(r)).sort((a, b) => a.pickupDate.localeCompare(b.pickupDate));
    for (const r of late.slice(0, 3)) {
      const due = r.pickupDate === today ? 'today' + (r.pickupTime ? ' ' + fmtTime(r.pickupTime) : '') : shortDate(r.pickupDate);
      lines.push(`<span class="needs-pair"><a href="admin-rentals.html?q=${encodeURIComponent(r.name || '')}"><b>Late pickup:</b> ${esc(r.name || 'Rental')}, due ${esc(due)}</a><button type="button" class="needs-x" data-mark="pickedUp" data-key="${escAttr(r.key)}">${r.serviceType === 'self' ? 'Returned' : 'Picked up'}</button></span>`);
    }
    if (late.length > 3) lines.push(`<a href="admin-rentals.html"><b>${late.length - 3} more</b> late pickups</a>`);
    // Back from a rental, not cleaned yet (Inventory has the Clean buttons)
    const dirty = DATA.rentals.filter(r => needsCleaning(r));
    if (dirty.length) {
      const n = dirty.reduce((t, r) => t + toteQty(r), 0);
      lines.push(`<a href="admin-inventory.html"><b>${plural(n, 'tote')}</b> need cleaning</a>`);
    }
    if (DATA.reviewLinkMissing) lines.push(`<a href="admin-reminders.html"><b>Review texts are off:</b> the Google review link isn't set in Netlify</a>`);
    $('needs').innerHTML = lines.length ? `<span class="needs-h">Needs you</span>${lines.join('')}` : '';
    $('needs').hidden = !lines.length;
  }

  // Turns a period key into a [start, end] date range for "current" plus the
  // matching prior range, so we can show a trend against it. Mirrors
  // the month-over-month comparison already used on the Finance page.
  function periodRange(period, todayISO) {
    const d = new Date(todayISO + 'T12:00:00Z');
    if (period === 'week') {
      const start = shiftDate(todayISO, -6);
      return { start, end: todayISO, prevStart: shiftDate(start, -7), prevEnd: shiftDate(start, -1), label: 'Last 7 days', vs: 'the 7 days before' };
    }
    if (period === 'month') {
      const y = d.getUTCFullYear(), m = d.getUTCMonth();
      const start = new Date(Date.UTC(y, m, 1)).toISOString().slice(0,10);
      const end = new Date(Date.UTC(y, m + 1, 0)).toISOString().slice(0,10); // last day of this month
      const prevStart = new Date(Date.UTC(y, m-1, 1)).toISOString().slice(0,10);
      const prevEnd = new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);
      const name = i => new Date(Date.UTC(y, i, 1)).toLocaleDateString('en-US', { month: 'long', timeZone: 'UTC' });
      return { start, end, prevStart, prevEnd, label: name(m) + ' so far', vs: 'all of ' + name(m - 1) };
    }
    if (period === 'year') {
      const y = d.getUTCFullYear();
      return { start: `${y}-01-01`, end: `${y}-12-31`, prevStart: `${y-1}-01-01`, prevEnd: `${y-1}-12-31`, label: y + ' so far', vs: 'all of ' + (y - 1) };
    }
    return { start: '0000-01-01', end: '9999-12-31', prevStart: null, prevEnd: null, label: 'All time', vs: '' };
  }

  // Same rules as Finance (admin-shared.js): revenue when paid or by drop-off
  // (whichever Finance is set to), recurring costs every month, Stripe fees
  function computeKPIs(period) {
    const range = periodRange(period, TODAY);
    const basis = finBasis();
    const rev = revenueEntries(DATA.rentals, DATA.paidFlags, basis);
    const spend = [...expenseCharges(DATA.expenses, TODAY), ...stripeFeeCharges(rev, DATA.paidFlags, DATA.paidVia, DATA.stripeFees)];
    const inRange = (d, s, e) => d && d >= s && d <= e;
    const revIn = rev.filter(x => inRange(x.date, range.start, range.end));
    const revenue = round2(revIn.reduce((t, x) => t + x.amount, 0));
    const expTotal = round2(spend.filter(x => inRange(x.date, range.start, range.end)).reduce((t, x) => t + Number(x.amount || 0), 0));
    let prevRevenue = null;
    if (range.prevStart) prevRevenue = round2(rev.filter(x => inRange(x.date, range.prevStart, range.prevEnd)).reduce((t, x) => t + x.amount, 0));
    return { range, revenue, expTotal, net: round2(revenue - expTotal), count: revIn.length, prevRevenue, basis };
  }

  function renderMoney() {
    if (!TODAY) return;
    const k = computeKPIs(PERIOD);
    const owed = owedRentals(DATA.rentals, DATA.paidFlags);
    const owedAmt = owed.reduce((t, r) => t + priceAmount(r.price), 0);
    // Same set-aside as Finance: profit less the mileage deduction, times your percent
    const rateOn = d => { let r = 0; for (const x of DATA.mileageRates || []) if (x.from <= d) r = x.rate; return r; };
    const deduction = DATA.mileage.filter(m => m.date >= k.range.start && m.date <= k.range.end).reduce((t, m) => t + Number(m.miles || 0) * rateOn(m.date), 0);
    const aside = Math.max(0, k.net - deduction) * Number(DATA.taxPct ?? 25) / 100;

    let monthlyOverhead = 0;
    for (const e of DATA.expenses.filter(x => !x.endDate || x.endDate >= TODAY)) {
      if (e.recurring === 'monthly') monthlyOverhead += e.amount;
      else if (e.recurring === 'yearly') monthlyOverhead += e.amount / 12;
    }

    // Revenue change in words, with its baseline named. Grey when there is nothing to compare.
    let delta = '<span>No earlier period to compare</span>';
    if (k.prevRevenue !== null) {
      const diff = k.revenue - k.prevRevenue;
      if (k.prevRevenue === 0) delta = k.revenue > 0 ? `Revenue ${moneyDec(k.revenue)} (new) vs ${k.range.vs}` : `No revenue here or in ${k.range.vs}`;
      else if (diff === 0) delta = `Revenue unchanged vs ${k.range.vs}`;
      else delta = `Revenue <span class="${diff > 0 ? 'up' : 'down'} num">${diff > 0 ? '+' : '−'}${moneyDec(Math.abs(diff))}</span> vs ${k.range.vs}`;
    }

    $('money').innerHTML = `
      <div class="net">
        <div class="lbl">Net income · ${k.range.label}</div>
        <div class="big num">${k.net < 0 ? '−' : ''}${moneyDec(Math.abs(k.net))}</div>
        <div class="delta">${delta}</div>
      </div>
      <div class="kv">
        <div class="row"><span>${k.basis === 'paid' ? 'Collected' : 'Revenue'} <span class="sub">${plural(k.count, 'rental')}</span></span><span class="num">${moneyDec(k.revenue)}</span></div>
        <div class="row"><span>Expenses <span class="sub num">${moneyDec(monthlyOverhead)}/mo recurring</span></span><span class="num">−${moneyDec(k.expTotal)}</span></div>
        ${owedAmt ? `<div class="row"><span><a href="admin-rentals.html?filter=unpaid">Still owed</a> <span class="sub">${plural(owed.length, 'invoice')}, all time</span></span><span class="num">${moneyDec(owedAmt)}</span></div>` : ''}
        ${aside > 0 ? `<div class="row"><span>Set aside for taxes <span class="sub">about ${DATA.taxPct}% of profit after mileage</span></span><span class="num">${moneyDec(aside)}</span></div>` : ''}
      </div>`;
  }

  // ---- Marking dashboard texts as sent ----
  // Same sent flags as the Reminders page (mark-sent), so a text marked sent
  // here is gone there too, and the server stops listing it.
  let JUST_SENT = [];   // marked this visit, shown with Undo
  const OPEN_ASKS = new Set();   // "Sent to X?" rows waiting for an answer; kept across refreshes
  $('textsList').addEventListener('click', async (e) => {
    const row = e.target.closest('.row');
    if (e.target.closest('[data-text]') && row) {
      // Messages opens; the question waits in the row for when you come back
      OPEN_ASKS.add(row.dataset.flag);
      setTimeout(() => { const ask = row.querySelector('.ask'); if (ask) ask.hidden = false; }, 400);
      return;
    }
    if (e.target.closest('[data-no]') && row) { OPEN_ASKS.delete(row.dataset.flag); row.querySelector('.ask').hidden = true; return; }
    const skip = e.target.closest('[data-skip]');
    if (skip && row) {
      skip.disabled = true;
      const ok = await setSent(row.dataset.flag, true, true);
      if (!ok) { skip.disabled = false; return; }
      OPEN_ASKS.delete(row.dataset.flag);
      JUST_SENT.push({ flagId: row.dataset.flag, name: skip.dataset.name, why: skip.dataset.why.replace(' · overdue', ''), skipped: true });
      for (const k of Object.keys(DATA.reminders)) DATA.reminders[k] = (DATA.reminders[k] || []).filter(x => x.flagId !== row.dataset.flag);
      render();
      return;
    }
    const yes = e.target.closest('[data-yes]');
    if (yes && row) {
      yes.disabled = true; yes.textContent = 'Saving…';
      const ok = await setSent(row.dataset.flag, true);
      if (!ok) { yes.disabled = false; yes.textContent = 'Yes, sent'; return; }
      OPEN_ASKS.delete(row.dataset.flag);
      JUST_SENT.push({ flagId: row.dataset.flag, name: yes.dataset.name, why: yes.dataset.why.replace(' · overdue', '') });
      for (const k of Object.keys(DATA.reminders)) DATA.reminders[k] = (DATA.reminders[k] || []).filter(x => x.flagId !== row.dataset.flag);
      render();
      return;
    }
    const undo = e.target.closest('[data-undo]');
    if (undo) {
      undo.disabled = true;
      if (await setSent(undo.dataset.undo, false)) { JUST_SENT = JUST_SENT.filter(x => x.flagId !== undo.dataset.undo); load(); }
      else undo.disabled = false;
    }
  });
  async function setSent(flagId, sent, skip) {
    try {
      const resp = await post('mark-sent', { secret: $('secret').value.trim(), flagId, ...(sent ? (skip ? { skip: true } : {}) : { unsent: true }) });
      if (resp.ok) return true;
      showErr(sent ? 'Couldn’t mark that text as sent. Try again.' : 'Couldn’t undo that. Try again.');
    } catch { showErr('Network error. Nothing was changed.'); }
    return false;
  }

  function shiftDate(iso, days) {
    const d = new Date(iso + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function showErr(m) { const s = $('status'); s.className = 'status err'; s.textContent = m; s.style.display = 'block'; }
</script>
</body>
