<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>All Rentals — Ready Tote Oklahoma (Internal)</title>
<link rel="stylesheet" href="admin-shared.css?v=20261022">
<script src="admin-shared.js?v=20261028"></script>
<script src="admin-rentals-shared.js?v=20261028"></script>
<style>
  .rem .who{font-weight:600;font-size:16px;}
  .rem .meta{color:var(--steel);font-size:14px;margin:3px 0 0;line-height:1.45;font-variant-numeric:tabular-nums;}
  .rem .meta.addr{margin-top:2px;}
  #results h2{margin:32px 0 10px; font-size:17px;}
  #results h2:first-child{margin-top:8px;}
  #results .empty{margin:0 0 0 2px; font-size:14px;}
  .rem{margin-bottom:8px;}
  .rem .msg{background:#FAF8F3;border-radius:8px;padding:12px 14px;font-size:14px;color:var(--ink);line-height:1.55;margin-bottom:10px;}
  /* Group related row buttons so each group wraps independently and
     lines up the same way regardless of which buttons are "Sent" */
  .rem .actions{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:8px;}
  .rem .actions:last-child{margin-bottom:0;}
  .rem .actions.delete-row{margin-top:2px; padding-top:10px; border-top:1px solid var(--line);}
  /* Payment-control row (Mark paid / Text invoice sent / Send reminder /
     Text reminder): button count varies (1-4) and labels are different
     lengths, so plain flex-wrap left them wrapping unevenly on phones
     (e.g. two buttons on one line, two dangling lower, misaligned). A
     self-arranging grid keeps every button the same width and lines
     rows up evenly no matter how many buttons are present. */
  .rem .actions.payment-actions{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; align-items:stretch;}
  .rem .actions.payment-actions > *{width:100% !important; box-sizing:border-box; text-align:center; margin:0; display:flex; align-items:center; justify-content:center; min-height:38px; line-height:1.2;}
  /* Text row (Delivery/Pickup/Confirm address/Review/Follow-up): always
     exactly one row, however narrow the card. flex-wrap:nowrap plus
     flex:1 1 0 on each button splits the row evenly between however many
     buttons are present (4 for self-service, 5 otherwise) and shrinks
     them together instead of letting the row wrap to a second line. */
  .rem .actions.text-actions{display:flex; flex-wrap:nowrap; gap:6px;}
  .rem .actions.text-actions > *{flex:1 1 0; min-width:0; box-sizing:border-box; text-align:center; margin:0; display:flex; align-items:center; justify-content:center; padding:6px 4px !important; font-size:13px !important; line-height:1.15; white-space:normal; min-height:40px;}
  .delete-btn{width:auto; padding:8px 16px; font-size:14px; background:var(--white); color:var(--red); border:1px solid var(--control); border-radius:6px; cursor:pointer;}
  .delete-btn:hover{background:var(--red-bg); border-color:var(--red);}

  /* Collapsible card: summary always visible, tap to reveal the buttons */
  .rem-summary{display:flex; align-items:flex-start; gap:10px; cursor:pointer; user-select:none;}
  .rem-summary .chevron{flex:none; color:var(--steel); font-size:13px; line-height:1.6; width:12px; text-align:center; transition:transform 0.15s ease;}
  .rem.open .rem-summary .chevron{transform:rotate(90deg);}
  .rem-details{display:none; margin-top:10px;}
  .rem.open .rem-details{display:block;}
  h2{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .section-toggle{width:auto; margin:0 0 0 auto; padding:0; font-size:13px; font-weight:600; background:none; border:none; color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--control); cursor:pointer;}
  .section-toggle:hover{background:none; text-decoration-color:var(--ink);}

  .date-edit-block, .addr-edit-block{display:none; margin-top:10px; padding-top:12px; border-top:1px dashed var(--line);}
  .date-edit-block .grid2, .addr-edit-block .grid2, .addr-edit-block .grid3{margin-bottom:10px;}
  .date-edit-block label, .addr-edit-block label{font-size:13px; margin:0 0 4px; display:block;}
  .date-edit-block button, .addr-edit-block button{margin-top:6px; width:auto; padding:7px 14px; font-size:14px;}
  .addr-edit-block h4{font-size:14px; margin:12px 0 6px; color:var(--ink);}
  .addr-edit-block h4:first-child{margin-top:0;}

  /* Edit rental / More: the per-rental edit fields and rare/destructive
     actions (military flag, delete) used to sit in the open as 9 buttons
     every time a card was expanded. They're now tucked behind two small
     toggles so the everyday actions (text buttons, photos, payment) are
     what you see first. */
  .edit-panel, .more-panel, .photo-panel{display:none; margin-top:10px; padding-top:12px; border-top:1px dashed var(--line);}
  .edit-panel .date-edit-block, .edit-panel .addr-edit-block{border-top:none; padding-top:0;}

  /* Currently active rentals (dropped off, not yet picked up) get a light
     green tint + left border so they stand out at a glance in the list,
     same green used for the "Active rentals" stat on Dashboard/Inventory. */
  .rem.active-rental{border-left:3px solid var(--green);}

  /* Find: search + filter buttons with counts */
  .list-tools{display:flex; flex-direction:column; gap:10px; margin:8px 0 16px;}
  .fchips{display:flex; flex-wrap:wrap; gap:6px;}
  .fchips button{width:auto; margin:0; height:34px; padding:0 12px; font-size:14px; font-weight:600; background:#fff; color:var(--ink); border:1px solid var(--control); border-radius:999px;}
  .fchips button:hover{background:#fff; border-color:var(--ink);}
  .fchips button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink);}
  .fchips .n{font-weight:500; opacity:.75; margin-left:4px; font-variant-numeric:tabular-nums;}
  .unpaid-link{display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; margin:0 0 14px; padding:10px 14px; background:var(--red-bg); color:#831C1E; border:none; border-radius:8px; font-size:14px; font-weight:600; text-align:left;}
  .unpaid-link:hover{background:#FFE1DC;}
  .group-h{display:flex; justify-content:space-between; align-items:baseline; margin:20px 0 8px; font-size:15px; font-weight:700;}
  .group-h:first-child{margin-top:0;}
  .group-h .n{font-weight:500; color:var(--steel); margin-left:6px;}
  .show-past{width:auto; margin:8px 0 0; background:#fff; color:var(--ink); border:1px solid var(--control);}
  .show-past:hover{background:#fff; border-color:var(--ink);}
  .no-match{padding:14px; border:1px dashed var(--control); border-radius:8px; color:var(--steel); font-size:14px;}

  /* Card summary: name and one line of facts on the left, price and status on the right */
  .rem-summary .sum-main{flex:1; min-width:0;}
  .rem-summary .sum-side{flex:none; text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  .rem-summary .price{font-weight:600; font-size:16px; font-variant-numeric:tabular-nums;}
  .rem-summary .pills{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;}
  .facts{font-size:14px; color:var(--ink-2); line-height:1.7; margin:0 0 12px; font-variant-numeric:tabular-nums;}
  .facts .k{color:var(--steel); display:inline-block; min-width:76px;}

  /* Next step: the one text that's due next, as the main button */
  .next{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 14px; background:#FAF8F3; border-radius:8px; margin-bottom:12px;}
  .next .what{font-size:14px;}
  .next .what b{display:block; font-size:15px;}
  .next .what span{color:var(--steel);}
  .next .sms-btn{background:var(--ink); color:#fff; border-color:var(--ink);}
  .next .sms-btn:hover{background:#3A342D;}
  .tool-row{display:flex; flex-wrap:wrap; gap:8px; padding-top:10px; border-top:1px solid var(--line);}
  .tool-row button{width:auto; margin:0; padding:8px 14px; font-size:14px; background:#fff; color:var(--ink); border:1px solid var(--control);}
  .tool-row button:hover{background:#fff; border-color:var(--ink);}
  .tool-row button[aria-expanded="true"]{background:var(--track); border-color:var(--track);}
  .xpanel{display:none; margin-top:12px;}
  .xpanel.shown{display:block;}

  /* One edit form per rental */
  .edit-form{background:#FAF8F3; border-radius:10px; padding:14px 16px;}
  .edit-form h4{margin:16px 0 0; font-size:14px;}
  .edit-form h4:first-child{margin-top:0;}
  .edit-form label{font-size:13px; margin:10px 0 4px;}
  .edit-form .g4{display:grid; grid-template-columns:repeat(4,1fr); gap:0 12px;}
  .edit-form .g4 .w2{grid-column:span 2;}
  .edit-form .g4 .w4{grid-column:1 / -1;}
  .edit-form .form-actions{display:flex; gap:8px; margin-top:16px;}
  .edit-form .form-actions button{width:auto; margin:0;}
  .edit-form .copy{width:auto; margin:0 0 0 8px; padding:2px 0; background:none; border:none; color:var(--ink); font-size:13px; font-weight:600; text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--control);}
  @media(max-width:640px){
    .edit-form .g4{grid-template-columns:1fr 1fr;}
    .edit-form .g4 .w2{grid-column:1 / -1;}
    .rem-summary .sum-side .pills{max-width:120px;}
  }
  .pill.neutral{background:var(--track); color:#4A433B;}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; font-weight:600; z-index:30; box-shadow:0 8px 24px rgba(30,27,24,.2);}
</style>
</head>

  <a href="admin.html">Dashboard</a>

  <a href="admin-invoice.html?mode=log">Add Rental</a>
  <a href="admin-reminders.html">Reminders</a>
  <a href="admin-rentals.html" aria-current="page">All Rentals</a>
  <a href="admin-contacts.html">Contacts</a>

<div class="card">
  <h1>All rentals</h1>
  <p class="sub">Find any rental, see what's due next, and update it in one place. Today's texts across all rentals are on Reminders.</p>

  <input type="hidden" id="secret">

  <button id="loadBtn">Refresh</button>
  <div class="status" id="status"></div>
  <input type="file" id="photoFileInput" accept="image/*" style="display:none">

  <div id="results" style="display:none;">
    <div class="list-tools">
      <input type="search" id="search" placeholder="Search name, phone, email, address or package" aria-label="Search rentals">
      <div class="fchips" id="filterChips" role="group" aria-label="Show"></div>
    </div>
    <div id="unpaidSummary"></div>
    <div id="allRentals"></div>
    <div style="margin-top:28px; max-width:520px;">
      <label for="startFrom">Starting point for “On the way” texts</label>
      <input type="text" id="startFrom" placeholder="Leave blank to use your home address">
    </div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  // Restore shared secret
  $('secret').value = adminSessionMarker();   // signed-in marker; the session cookie is what the server checks

  $('startFrom').value = sessionStorage.getItem('rto-admin-startfrom') || '';
  $('startFrom').addEventListener('input', () => sessionStorage.setItem('rto-admin-startfrom', $('startFrom').value));

  let ALL_RENTALS = [];
  let FILTER = 'all', SEARCH = '', SHOW_PAST = false;
  // ?q=Name opens the list searched for that name (links from Inventory's day breakdown)
  const Q0 = new URLSearchParams(location.search).get('q');
  const TODAY = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });

  $('loadBtn').addEventListener('click', load);
  // Auto-load if a secret is already saved (matches admin.html behavior)
  if ($('secret').value) load();

  async function load() {
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret.');
    const btn = $('loadBtn');
    btn.disabled = true; btn.textContent = 'Refresh';
    try {
      const resp = await fetch('/.netlify/functions/get-rentals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret }),
      });
      if (resp.status === 401) { showErr('Wrong admin secret.'); }
      else if (!resp.ok) { showErr('Load failed (' + resp.status + ').'); }
      else {
        const data = await resp.json();
        ALL_RENTALS = data.rentals || [];
        SENT_FLAGS = data.sentFlags || {};
        PAID_FLAGS = data.paidFlags || {};
        // Every action reloads the list from the server so text links and
        // flags stay right; the open cards, open panels and scroll position
        // are put back so you don't lose your place.
        const ui = captureUi();
        renderAll(ALL_RENTALS);
        restoreUi(ui);
        $('results').style.display = 'block';
        $('status').style.display = 'none';
      }
    } catch { showErr('Network error — use this page on the live site.'); }
    btn.disabled = false; btn.textContent = 'Refresh';
  }

  // ---- Find: groups, filters, search ----
  const isOut = r => r.dropoffDate && r.pickupDate && r.dropoffDate <= TODAY && r.pickupDate >= TODAY;
  const isUpcoming = r => !!r.dropoffDate && r.dropoffDate > TODAY;
  const isDone = r => !!r.pickupDate && r.pickupDate < TODAY;
  // "Needs info": missing what Inventory or the texts depend on
  function missingInfo(r) {
    const out = [];
    if (typeof r.toteCount !== 'number') out.push('tote count');
    if (!r.phone) out.push('phone');
    if (r.serviceType !== 'self' && !dropoffAddressOf(r)) out.push('address');
    return out;
  }
  const FILTERS = [
    ['all', 'All', () => true],
    ['out', 'Out now', isOut],
    ['upcoming', 'Upcoming', isUpcoming],
    ['unpaid', 'Unpaid', r => isUnpaid(r)],
    ['info', 'Needs info', r => missingInfo(r).length > 0],
    ['done', 'Done', isDone],
  ];
  function matchesSearch(r) {
    if (!SEARCH) return true;
    const hay = [r.name, r.phone, String(r.phone || '').replace(/\D/g, ''), r.email, r.package, dropoffAddressOf(r), pickupAddressOf(r), r.notes].join(' ').toLowerCase();
    return SEARCH.split(/\s+/).every(w => hay.includes(w));
  }

  $('search').addEventListener('input', () => { SEARCH = $('search').value.trim().toLowerCase(); renderAll(ALL_RENTALS); });
  if (Q0) { $('search').value = Q0; SEARCH = Q0.trim().toLowerCase(); }
  window.setFilter = (f) => { FILTER = f; SHOW_PAST = false; renderAll(ALL_RENTALS); window.scrollTo({ top: $('results').offsetTop - 60, behavior: 'smooth' }); };

  const shortDate = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';
  const cityOf = r => r.dropoffAddressCity || (dropoffAddressOf(r).split(',').map(x => x.trim()).slice(-2, -1)[0] || '');
  const pill = (cls, text, title) => `<span class="pill ${cls}"${title ? ` title="${escAttr(title)}"` : ''}>${esc(text)}</span>`;

  function renderAll(rentals){
    const el = $('allRentals');
    if (!rentals.length) { el.innerHTML = '<p class="empty">No rentals logged yet.</p>'; $('unpaidSummary').innerHTML = ''; $('filterChips').innerHTML = ''; return; }

    const found = rentals.filter(matchesSearch);
    $('filterChips').innerHTML = FILTERS.map(([id, label, fn]) =>
      `<button type="button" aria-pressed="${FILTER === id}" onclick="setFilter('${id}')">${label}<span class="n">${found.filter(fn).length}</span></button>`).join('');

    const unpaidCount = rentals.filter(isUnpaid).length;
    $('unpaidSummary').innerHTML = unpaidCount && FILTER !== 'unpaid'
      ? `<button type="button" class="unpaid-link" onclick="setFilter('unpaid')"><span>${unpaidCount} invoice${unpaidCount === 1 ? '' : 's'} sent, waiting on payment</span><span>Show ${unpaidCount === 1 ? 'it' : 'them'} ›</span></button>`
      : '';

    const shown = found.filter(FILTERS.find(f => f[0] === FILTER)[2]);
    if (!shown.length) {
      el.innerHTML = `<p class="no-match">${SEARCH ? `No rentals match “${esc($('search').value.trim())}”` : 'Nothing here right now'}${FILTER !== 'all' ? ` in ${FILTERS.find(f => f[0] === FILTER)[1]}` : ''}.</p>`;
      return;
    }

    // Out now: soonest back first. Upcoming: soonest out first. Past: newest first.
    const byPickup = (a, b) => (a.pickupDate||'').localeCompare(b.pickupDate||'');
    const byDropAsc = (a, b) => (a.dropoffDate||'').localeCompare(b.dropoffDate||'');
    const byDropDesc = (a, b) => (b.dropoffDate||'').localeCompare(a.dropoffDate||'');
    let html = '';
    if (FILTER === 'all' && !SEARCH) {
      const out = shown.filter(isOut).sort(byPickup), up = shown.filter(isUpcoming).sort(byDropAsc);
      const past = shown.filter(r => !isOut(r) && !isUpcoming(r)).sort(byDropDesc);
      const group = (title, list) => list.length ? `<div class="group-h"><span>${title}<span class="n">${list.length}</span></span></div>` + list.map(card).join('') : '';
      html += group('Out now', out) + group('Upcoming', up);
      if (past.length) {
        html += SHOW_PAST
          ? group('Past', past)
          : `<button type="button" class="show-past" onclick="SHOW_PAST = true; renderAll(ALL_RENTALS);">Show ${past.length} past rental${past.length === 1 ? '' : 's'}</button>`;
      }
    } else {
      const sorter = FILTER === 'out' ? byPickup : FILTER === 'upcoming' ? byDropAsc : byDropDesc;
      html = shown.sort(sorter).map(card).join('');
    }
    el.innerHTML = html;
    wireCards(el);
  }

  function card(r) {
    const k = esc(r.key);
    const grouped = FILTER === 'all' && !SEARCH;
    const status = grouped ? '' : isOut(r) ? pill('ok', 'Out now') : isUpcoming(r) ? pill('pending', 'Upcoming') : '';
    const pay = PAID_FLAGS[r.key] ? pill('ok', 'Paid') : isUnpaid(r) ? pill('err', 'Unpaid') : '';
    const missing = missingInfo(r);
    const totes = typeof r.toteCount === 'number' ? `${r.toteCount} totes` : (String(r.package || '').match(/(\d+)\s*totes?/i) ? String(r.package).match(/(\d+)\s*totes?/i)[1] + ' totes' : 'Totes not set');
    const city = r.serviceType === 'self' ? 'Customer pickup' : cityOf(r);
    const facts = [totes, `${shortDate(r.dropoffDate)} to ${shortDate(r.pickupDate)}`, city].filter(Boolean).join(' · ');
    const dOff = dropoffAddressOf(r), pOff = pickupAddressOf(r);
    const addr = r.serviceType === 'self' ? 'Customer picks up and returns' : dOff && dOff === pOff ? esc(dOff) : [dOff ? 'Drop-off: ' + esc(dOff) : '', pOff ? 'Pickup: ' + esc(pOff) : ''].filter(Boolean).join('<br>') || '—';
    const counts = typeof r.toteCount === 'number' || typeof r.dollyCount === 'number'
      ? `${typeof r.toteCount === 'number' ? r.toteCount : '—'} totes · ${typeof r.dollyCount === 'number' ? r.dollyCount : '—'} ${r.dollyCount === 1 ? 'dolly' : 'dollies'}` : '<span style="color:#831C1E;">Not set. Inventory can’t count this rental</span>';
    // Paid rentals keep "Mark unpaid" under More; it's rarely needed
    const paid = !!PAID_FLAGS[r.key];
    const paymentControls = paid ? '' : payBtn(r) + invoiceReminderBtn(r) + emailReminderBtn(r) + textReminderBtn(r);
    const tbtn = (panel, label) => `<button type="button" class="panel-btn" data-panel="${panel}-${k}" aria-expanded="false">${label}</button>`;

    return `
      <div class="rem${isOut(r) ? ' active-rental' : ''}" data-key="${k}">
        <div class="rem-summary" onclick="this.closest('.rem').classList.toggle('open')">
          <span class="chevron">▸</span>
          <div class="sum-main">
            <div class="who">${esc(r.name)}</div>
            <div class="meta">${esc(facts)}</div>
          </div>
          <div class="sum-side">
            <div class="price">${fmtPrice(r.price)}</div>
            <div class="pills">${status}${pay}${r.isMilitary ? pill('neutral', 'Military') : ''}${missing.length ? pill('err', 'Needs info', 'Missing ' + missing.join(', ')) : ''}</div>
          </div>
        </div>
        <div class="rem-details">
          <div class="facts">
            <div><span class="k">Package</span>${esc(r.package || '—')}</div>
            <div><span class="k">Counts</span>${counts}</div>
            <div><span class="k">Times</span>out ${esc(fmtDate(r.dropoffDate))} ${esc(r.dropoffTime || '')}, back ${esc(fmtDate(r.pickupDate))} ${esc(r.pickupTime || '')}</div>
            <div><span class="k">Address</span>${addr}</div>
            <div><span class="k">Contact</span>${r.phone ? `<a href="tel:${escAttr(r.phone)}">${esc(r.phone)}</a>` : '—'}${r.email ? ` · <a href="mailto:${escAttr(r.email)}">${esc(r.email)}</a>` : ''}</div>
            ${r.tosAccepted ? `<div><span class="k">Terms</span>Accepted ${esc(fmtDate((r.tosAcceptedAt || '').slice(0, 10)))}</div>` : ''}
            ${missing.length ? `<div><span class="k">Missing</span><span style="color:#831C1E;">${esc(missing.join(', '))}</span></div>` : ''}
          </div>
          ${r.notes ? `<div class="msg">${esc(r.notes)}</div>` : ''}
          ${nextStep(r)}
          ${paymentControls ? `<div class="actions payment-actions">${paymentControls}</div>` : ''}
          ${r.serviceType !== 'self' && (dOff || pOff) && !isDone(r) ? `<div class="actions">
            ${dOff && !isOut(r) ? onTheWayBtn('delivery', r.key) : ''}
            ${pOff ? onTheWayBtn('pickup', r.key) : ''}
          </div>` : ''}
          <div class="tool-row">
            ${tbtn('edit', 'Edit rental')}${tbtn('texts', 'Other texts')}${tbtn('photos', 'Photos')}${tbtn('more', 'More')}
          </div>
          <div class="xpanel" id="texts-${k}">
            <div class="actions text-actions">
              ${textBtn('delivery', r.key, r.deliverySms, '', 'Delivery', '')}
              ${r.serviceType !== 'self' ? textBtn('addressCheck', r.key, r.addressCheckSms, '', 'Confirm address', '') : ''}
              ${textBtn('pickup', r.key, r.pickupSms, '', 'Pickup', '')}
              ${r.reviewSms ? textBtn('review', r.key, r.reviewSms, '', 'Review', '') : ''}
              ${textBtn('followup', r.key, r.followupSms, '', 'Follow-up', '')}
            </div>
          </div>
          <div class="xpanel" id="photos-${k}">
            <div class="actions">${photoBtn(r, 'delivery')}${photoBtn(r, 'pickup')}${photoBtn(r, 'military_id')}</div>
          </div>
          <div class="xpanel" id="edit-${k}">${editForm(r)}</div>
          <div class="xpanel" id="more-${k}">
            <div class="actions">
              ${paid ? payBtn(r) : ''}
              <button type="button" class="edit-military-btn" data-key="${k}" data-military="${r.isMilitary ? 'true' : 'false'}" style="width:auto; padding:8px 16px; font-size:14px; background:#fff; color:var(--ink); border:1px solid var(--control); border-radius:6px; cursor:pointer;">${r.isMilitary ? 'Remove military discount' : 'Mark as military'}</button>
              <button type="button" class="delete-btn" onclick="deleteRental('${k}', '${esc(r.name).replaceAll("'", '&#39;')}')">Delete rental</button>

  // ---- Next step: the text that's due next, on the same schedule as Reminders ----
  // Each text has a due date; a text whose moment has passed (a delivery
  // reminder after drop-off, a payment follow-up once paid) drops out.
  const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  function nextStep(r) {
    const steps = [];
    const self = r.serviceType === 'self';
    if (r.invoicedAt && !r.backfilled && !PAID_FLAGS[r.key])
      steps.push({ type: 'followup', label: 'Invoice follow-up', due: addDays(r.invoicedAt.slice(0, 10), 3), until: '9999-12-31', sms: r.followupSms });
    if (r.dropoffDate) steps.push({ type: 'delivery', label: self ? 'Pickup-day reminder' : 'Delivery reminder', due: addDays(r.dropoffDate, -1), until: r.dropoffDate, sms: r.deliverySms });
    if (r.pickupDate && !self) steps.push({ type: 'addressCheck', label: 'Confirm pickup address', due: addDays(r.pickupDate, -5), until: r.pickupDate, sms: r.addressCheckSms });
    if (r.pickupDate) steps.push({ type: 'pickup', label: self ? 'Return reminder' : 'Pickup reminder', due: addDays(r.pickupDate, -2), until: r.pickupDate, sms: r.pickupSms });
    if (r.pickupDate && r.reviewSms) steps.push({ type: 'review', label: 'Ask for a review', due: addDays(r.pickupDate, 3), until: addDays(r.pickupDate, 21), sms: r.reviewSms });
    const open = steps.filter(s => !SENT_FLAGS[s.type + ':' + r.key] && TODAY <= s.until && s.sms).sort((a, b) => a.due.localeCompare(b.due));
    if (!open.length) return '';
    const s = open[0];
    const when = s.due < TODAY ? `was due ${shortDate(s.due)}` : s.due === TODAY ? 'due today' : `due ${shortDate(s.due)}`;
    return `<div class="next"><div class="what"><b>Next: ${esc(s.label)}</b><span>${when}</span></div>${textBtn(s.type, r.key, s.sms, '', 'Text ' + (r.name || '').split(' ')[0], '')}</div>`;
  }

  // ---- One edit form per rental ----

    return `<form class="edit-form" data-key="${k}" onsubmit="event.preventDefault(); saveEdit(this);">
      <h4>Customer</h4>
      <div class="g4">
        ${f('name', 'Name', r.name, 'type="text"', 'w2')}${f('phone', 'Phone', r.phone, 'type="tel"')}${f('email', 'Email', r.email, 'type="email"')}

        ${f('toteCount', 'Totes', typeof r.toteCount === 'number' ? r.toteCount : '', 'type="number" min="0" step="1"')}${f('dollyCount', 'Dollies', typeof r.dollyCount === 'number' ? r.dollyCount : '', 'type="number" min="0" step="1"')}
        ${f('dropoffDate', 'Drop-off date', r.dropoffDate, 'type="date"')}${f('dropoffTime', 'Drop-off time', to24Hour(r.dropoffTime || ''), 'type="time"')}
        ${f('pickupDate', 'Pickup date', r.pickupDate, 'type="date"')}${f('pickupTime', 'Pickup time', to24Hour(r.pickupTime || ''), 'type="time"')}

    </form>`;
  }

  function wireCards(el) {
    el.querySelectorAll('.pay-btn').forEach(btn => btn.addEventListener('click', () => togglePaid(btn.dataset.key, btn.dataset.setpaid === 'true')));
    el.querySelectorAll('.email-reminder-btn').forEach(btn => btn.addEventListener('click', () => sendEmailReminder(btn.dataset.key)));
    el.querySelectorAll('.otw-btn').forEach(btn => btn.addEventListener('click', () => onTheWay(btn.dataset.key, btn.dataset.type)));
    el.querySelectorAll('.unsend-btn').forEach(btn => btn.addEventListener('click', () => unmarkSent(btn.dataset.flagid)));
    el.querySelectorAll('.edit-military-btn').forEach(btn => btn.addEventListener('click', () => toggleMilitary(btn.dataset.key, btn.dataset.military === 'true')));
    el.querySelectorAll('.add-photo-btn').forEach(btn => btn.addEventListener('click', () => triggerPhotoCapture(btn.dataset.key, btn.dataset.type)));
    el.querySelectorAll('.view-photo-btn').forEach(btn => btn.addEventListener('click', () => viewPhoto(btn.dataset.key, btn.dataset.type)));
    el.querySelectorAll('.panel-btn').forEach(btn => btn.addEventListener('click', () => {

  // ---- Keep your place across reloads ----

  // ID photo has real consequences (verifying the wrong person), so it

  // view-only on purpose, that's a lower-stakes mistake. Replace reuses
  // the same key, so upload-photo.mjs just overwrites the existing blob.
  function photoBtn(r, type) {
    const has = type === 'delivery' ? r.hasDeliveryPhoto : type === 'pickup' ? r.hasPickupPhoto : r.hasMilitaryIdPhoto;

    if (type !== 'military_id') return viewBtn;
    const replaceBtn = `<button type="button" class="add-photo-btn" data-key="${esc(key)}" data-type="${type}" style="width:auto; padding:8px 16px; font-size:14px; background:#fff; color:var(--ink); border:1px solid var(--control); border-radius:6px; cursor:pointer;">Replace ID photo</button>`;

  // "On the Way" button: starts as a plain button, calculates a live ETA via

  function onTheWayBtn(type, key) {
    const label = type === 'delivery' ? 'Delivery' : 'Pickup';

  window.onTheWay = async (key, type) => {
    const secret = $('secret').value.trim();

  // An invoice counts as "unpaid" once it's actually been emailed (invoicedAt,

  }

  window.togglePaid = async (key, setPaid) => {

  // "2:30 PM" -> "14:30" (time inputs need 24-hour values to prefill)
  function to24Hour(t) {
    const m = String(t || '').trim().match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
    if (!m) return '';
    let h = parseInt(m[1], 10);
    if (m[3]) {
      const pm = m[3].toUpperCase() === 'PM';
      if (pm && h < 12) h += 12;
      if (!pm && h === 12) h = 0;
    }
    return String(h).padStart(2, '0') + ':' + m[2];
  }

  // "14:30" -> "2:30 PM"
  function to12Hour(t) {
    const m = String(t || '').match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return t;
    const h = parseInt(m[1], 10);
    return (h % 12 || 12) + ':' + m[2] + ' ' + (h >= 12 ? 'PM' : 'AM');
  }

  // Fills the pickup address fields from the drop-off ones, in the form, before Save.
  window.copyDropoffToPickup = (btn) => {
    const form = btn.closest('form');
    ['Street', 'City', 'State', 'Zip'].forEach(part => {
      const from = form.querySelector(`[data-ef="dropoffAddress${part}"]`);
      const to = form.querySelector(`[data-ef="pickupAddress${part}"]`);
      if (from && to) to.value = from.value;
    });

  // One Save for the whole edit form. Only fields that changed are sent;
  // edit-rental skips blank text fields (except notes), so a cleared box
  // can't wipe real data.
  window.saveEdit = async (form) => {
    const key = form.dataset.key;
    const r = ALL_RENTALS.find(x => x.key === key);
    if (!r) return showErr('That rental is no longer on file. Refresh and try again.');
    const fields = {};
    form.querySelectorAll('[data-ef]').forEach(inp => {
      const name = inp.dataset.ef;
      let val = inp.value.trim();
      let cur = r[name] == null ? '' : String(r[name]);
      if (inp.type === 'time') { cur = to24Hour(cur); }
      if (name === 'dropoffAddressState' || name === 'pickupAddressState') { val = val.toUpperCase(); if (!r[name] && val === 'OK') return; }
      if (val !== cur) fields[name] = inp.type === 'time' ? to12Hour(val) : val;
    });
    if (!Object.keys(fields).length) { closePanel('edit-' + key); return toast('No changes to save'); }
    if ('package' in fields && !fields.package) return showErr('Package can’t be empty.');
    if ('price' in fields && !fields.price) return showErr('Price can’t be empty.');
    if ('stripeUrl' in fields && fields.stripeUrl && !/^https:\/\/([a-z0-9-]+\.)?stripe\.com\//.test(fields.stripeUrl)) return showErr('That doesn’t look like a stripe.com link.');
    if ('stripeUrl' in fields && !fields.stripeUrl) return showErr('The payment link can’t be removed here. Delete the rental if it was cancelled.');
    for (const n of ['toteCount', 'dollyCount']) {
      if (n in fields) {
        if (fields[n] === '') { delete fields[n]; continue; }
        const num = Number(fields[n]);
        if (!Number.isInteger(num) || num < 0) return showErr((n === 'toteCount' ? 'Totes' : 'Dollies') + ' must be a whole number, 0 or more.');
        fields[n] = num;
      }
    }
    if ((fields.dropoffDate || r.dropoffDate) > (fields.pickupDate || r.pickupDate)) return showErr('Pickup date is before the drop-off date.');

    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret first.');
    const btn = form.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const resp = await fetch('/.netlify/functions/edit-rental', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key, ...fields }),
      });
      if (resp.ok) {
        closePanel('edit-' + key);
        toast('Saved');
        $('loadBtn').click();
      } else {
        const detail = await resp.text().catch(() => '');
        showErr('Save failed (' + resp.status + '): ' + detail);
      }
    } catch { showErr('Network error. Nothing was saved.'); }
    btn.disabled = false; btn.textContent = 'Save changes';
  };

  window.deleteRental = async (key, name) => {
    if (!confirm('Delete the rental for ' + name + '? This cannot be undone.')) return;
    const secret = $('secret').value.trim();
    try {
      const resp = await fetch('/.netlify/functions/delete-rental', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key }),
      });
      if (resp.ok) {
        $('loadBtn').click(); // reload everything
      } else {
        showErr('Delete failed (' + resp.status + ').');

  // ---- Delivery / pickup proof photos ----
  // Tapping "Add photo" opens the phone camera (or file picker on desktop);
  // the image is downsized client-side before upload to keep it well under
  // the function payload limit.
  let PENDING_PHOTO = null;

  window.triggerPhotoCapture = (key, type) => {
    PENDING_PHOTO = { key, type };
    $('photoFileInput').value = '';
    $('photoFileInput').click();
  };

  $('photoFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const pending = PENDING_PHOTO;
    PENDING_PHOTO = null;
    if (!file || !pending) return;
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret first.');
    try {
      const dataUrl = await compressImage(file, 1600, 0.72);
      const base64 = dataUrl.split(',')[1];
      const resp = await fetch('/.netlify/functions/upload-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key: pending.key, type: pending.type, imageBase64: base64, mimeType: 'image/jpeg' }),
      });
      if (resp.ok) { $('loadBtn').click(); }
      else {
        const detail = await resp.text().catch(() => '');
        showErr('Photo upload failed (' + resp.status + '): ' + detail);
      }
    } catch (err) {
      showErr('Could not process photo: ' + (err.message || err));
    }
  });

  // Resizes/compresses an image file client-side via canvas, returns a JPEG data URL.
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else { width = Math.round(width * (maxDim / height)); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('Could not read image.'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('Could not read file.'));
      reader.readAsDataURL(file);
    });
  }

  // Opens a blank tab immediately (before the async fetch) so mobile Safari
  // doesn't treat it as a popup, then fills it in once the photo loads.
  window.viewPhoto = async (key, type) => {
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret first.');
    const label = type === 'delivery' ? 'Delivery' : type === 'pickup' ? 'Pickup' : 'Military ID';
    const win = window.open('', '_blank');
    if (win) {
      win.document.write(`<title>${label} photo</title><body style="margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">Loading…</body>`);
    }
    try {
      const resp = await fetch('/.netlify/functions/get-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key, type }),
      });
      if (!resp.ok) {
        const detail = await resp.text().catch(() => '');
        const msg = 'Could not load photo (' + resp.status + '): ' + detail;
        if (win) win.document.body.textContent = msg; else showErr(msg);
        return;
      }
      const data = await resp.json();
      if (win) {
        win.document.body.innerHTML = `<img src="data:${data.mimeType};base64,${data.imageBase64}" style="max-width:100%;max-height:100vh;">`;
      }
    } catch {
      if (win) win.document.body.textContent = 'Network error loading photo.'; else showErr('Network error loading photo.');
    }
  };

  function showErr(m){const s=$('status');s.style.display='block';s.className='status err';s.textContent=m;}
</script>
</body>
</html>
