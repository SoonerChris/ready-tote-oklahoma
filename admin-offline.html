<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Offline · Ready Tote admin</title>
<style>
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F5F1E7; color:#1E1B18; font-family:'Barlow',Arial,sans-serif; padding:24px; box-sizing:border-box;}
  .box{max-width:360px; text-align:center;}
  img{width:72px; height:72px; border-radius:16px;}
  h1{font-size:22px; margin:16px 0 6px;}
  p{color:#6B6259; font-size:15px; line-height:1.5; margin:0 0 20px;}
  button{font:600 15px 'Barlow',Arial,sans-serif; background:#1E1B18; color:#fff; border:0; border-radius:8px; padding:12px 20px; cursor:pointer;}
</style>
</head>
<body>
  <div class="box">
    <img src="/app-icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Ready Tote needs a connection to show live requests, reminders and rentals. It'll work again as soon as you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
