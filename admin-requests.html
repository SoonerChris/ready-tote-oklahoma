<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Booking Requests — Ready Tote Oklahoma (Internal)</title>
<link rel="stylesheet" href="admin-shared.css?v=20261022">
<script src="admin-shared.js?v=20261022"></script>
<script src="admin-availability.js?v=20261024"></script>
<style>
  :root{--col:820px;}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .toolbar select{width:auto;margin:0;min-width:220px;}
  .toolbar input[type=search]{flex:1;min-width:180px;margin:0;}
  .count-badge{font-size:14px;color:var(--steel);white-space:nowrap;}

  .req{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;background:var(--white);}
  .req-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .req-name{font-weight:bold;font-size:16px;}
  .req-sub{font-size:13px;color:var(--steel);margin-top:2px;font-variant-numeric:tabular-nums;}
  .req-sub .late{color:#831C1E;font-weight:600;}
  .req-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .avail-row{display:flex;align-items:flex-start;}
  .avail-row .lbl{flex:none;}
  .avail-list{display:flex;flex-wrap:wrap;min-width:0;}
  /* Decline: pick a reason in place instead of a browser pop-up */
  .decline-box{display:none;margin-top:12px;padding:12px 14px;border-radius:8px;background:#FAF8F3;}
  .decline-box.shown{display:block;}
  .decline-box p{margin:0 0 8px;font-size:14px;font-weight:600;}
  .decline-box .reasons{display:flex;flex-wrap:wrap;gap:6px;}
  .decline-box .reasons button{width:auto;margin:0;padding:7px 12px;font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--control);}
  .decline-box .reasons button:hover{background:#fff;border-color:var(--red);color:var(--red);}
  .decline-box .other{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .decline-box .other input{flex:1 1 220px;margin:0;height:36px;padding:6px 10px;font-size:14px;}
  .decline-box .other button{width:auto;margin:0;height:36px;padding:0 12px;font-size:14px;}
  .req-body{font-size:14px;line-height:1.65;}
  .req-body{font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;}
  .req-body .lbl{color:var(--steel);display:inline-block;min-width:84px;}
  .req-body a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control);}
  .req-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .req-actions button{margin-top:0;width:auto;padding:8px 14px;font-size:14px;}
  .req-actions button.secondary{background:var(--white);border:1px solid var(--control);color:var(--ink);}
  .req-actions button.secondary:hover{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .req-actions button.linklike{background:var(--white);border:1px solid var(--control);color:var(--ink);}

  .toggle-note{margin-right:16px;background:none;border:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:bold;cursor:pointer;padding:0;margin-top:10px;width:auto;}
  .toggle-note:hover{background:none;}
  .note-block{display:none;margin-top:10px;}
  .note-block textarea{resize:vertical;}
  .note-block button{margin-top:8px;width:auto;padding:7px 14px;font-size:14px;}

  .edit-block{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:12px;}
  .edit-block .grid2{margin-bottom:10px;}
  .edit-block label{font-size:13px;margin:6px 0 4px;}
  .edit-block button{margin-top:6px;width:auto;padding:7px 14px;font-size:14px;}

  .no-results{padding:24px;text-align:center;color:var(--steel);font-size:15px;}
</style>
</head>
<body>
<div class="wrap">
  <nav class="admin-nav wide" aria-label="Admin tools">
    <a href="admin.html">Dashboard</a>
    <a href="admin-requests.html" aria-current="page">Requests</a>
    <a href="admin-invoice.html">Send Invoice</a>
    <a href="admin-invoice.html?mode=log">Add Rental</a>
    <a href="admin-reminders.html">Reminders</a>
  <a href="admin-rentals.html">All Rentals</a>
    <a href="admin-contacts.html">Contacts</a>
    <a href="admin-finance.html">Finance</a>
    <a href="admin-outreach.html">Outreach</a>
    <a href="admin-inventory.html">Inventory</a>
  </nav>

  <h1>Booking requests</h1>
  <p class="sub">Every request lands here first. Review it, confirm with the customer, then send the invoice — nothing skips straight from request to invoice anymore.</p>

  <div class="secret-bar">
  <input type="hidden" id="secret">
    <button id="loadBtn">Refresh</button>
  </div>
  <div class="status" id="status"></div>
  <input type="file" id="idFileInput" accept="image/*" style="display:none">

  <div id="results" style="display:none;">
    <div class="toolbar">
      <select id="statusFilter">
        <option value="active">Active pipeline</option>
        <option value="new">New</option>
        <option value="reviewed">Reviewed</option>
        <option value="awaiting_confirmation">Awaiting confirmation</option>
        <option value="confirmed">Confirmed — ready to invoice</option>
        <option value="declined">Declined</option>
        <option value="invoiced">Invoiced</option>
        <option value="all">All</option>
      </select>
      <input type="search" id="search" placeholder="Search name, phone, email…">
      <span class="count-badge" id="countBadge"></span>
    </div>
    <div id="list"></div>
  </div>
</div>

<footer><a href="/">readytoteokc.com</a></footer>

<script>
  const $ = (id) => document.getElementById(id);
  $('secret').value = localStorage.getItem('rto-admin-password') || '';

  let ALL = [];
  const STATUS_META = {
    new:                    { label: 'New',                     pill: 'pending' },
    reviewed:               { label: 'Reviewed',                 pill: 'pending' },
    awaiting_confirmation:  { label: 'Awaiting confirmation',    pill: 'pending' },
    confirmed:              { label: 'Confirmed',                pill: 'ok' },
    declined:               { label: 'Declined',                 pill: 'err' },
    invoiced:               { label: 'Invoiced',                 pill: 'ok' },
  };
  const ACTIVE_STATUSES = ['new', 'reviewed', 'awaiting_confirmation', 'confirmed'];

  $('loadBtn').addEventListener('click', load);
  $('statusFilter').addEventListener('change', render);
  $('search').addEventListener('input', render);
  if ($('secret').value) load();

  async function load() {
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret.');
    const btn = $('loadBtn');
    btn.disabled = true; btn.textContent = 'Refresh';
    try {
      const [resp] = await Promise.all([
        fetch('/.netlify/functions/get-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret }),
        }),
        loadAvailability(),   // refreshed on every load, so status changes show up
      ]);
      if (resp.status === 401) { showErr('Wrong admin secret.'); return; }
      if (!resp.ok) { showErr('Load failed (' + resp.status + ').'); return; }
      const data = await resp.json();
      ALL = (data.requests || []).sort((a, b) => (b.submittedAt || '').localeCompare(a.submittedAt || ''));
      $('results').style.display = 'block';
      $('status').style.display = 'none';
      render();
    } catch (e) {
      console.error('Load requests failed:', e);
      showErr('Load failed — check the console for details.');
    } finally {
      btn.disabled = false; btn.textContent = 'Refresh';
    }
  }

  function render() {
    const filter = $('statusFilter').value;
    const q = $('search').value.trim().toLowerCase();
    let rows = ALL;
    if (filter === 'active') rows = rows.filter(r => ACTIVE_STATUSES.includes(r.status));
    else if (filter !== 'all') rows = rows.filter(r => r.status === filter);
    if (q) {
      rows = rows.filter(r => [r.name, r.phone, r.email].filter(Boolean).join(' ').toLowerCase().includes(q));
    }
    $('countBadge').textContent = rows.length + (rows.length === 1 ? ' request' : ' requests');

    const list = $('list');
    if (!rows.length) {
      list.innerHTML = '<div class="no-results">No requests match this view.</div>';
      return;
    }
    list.innerHTML = rows.map(cardHtml).join('');
    rows.forEach(wireCard);
  }

  // Statuses still in play, where "do we have the totes?" matters
  const OPEN_STATUSES = ['new', 'reviewed', 'awaiting_confirmation', 'confirmed'];
  function requestAvailability(r) {
    const need = totesInPackageText(r.package);
    // Awaiting-confirmation and confirmed requests already hold their totes
    // in the availability numbers; add them back so it isn't counted twice.
    const needDollies = dolliesInPackageText(r.package);
    const held = ['awaiting_confirmation', 'confirmed'].includes(r.status) && need
      ? { start: r.deliveryDate, end: r.pickupDate, totes: need, dollies: needDollies } : null;
    return availabilityHtml(checkAvailability(r.deliveryDate, r.pickupDate, need, held, needDollies));
  }

  // "Submitted 5 hours ago · Oct 21, 3:41 PM". Requests waiting on you
  // (new, reviewed, confirmed) turn red after a day so nothing sits unanswered.
  const WAITING_ON_YOU = ['new', 'reviewed', 'confirmed'];
  function ago(iso) {
    const ms = Date.now() - new Date(iso).getTime();
    if (!iso || isNaN(ms)) return '';
    const m = Math.round(ms / 60000), h = Math.round(ms / 3600000), d = Math.floor(ms / 86400000);
    if (m < 2) return 'just now';
    if (m < 60) return m + ' minutes ago';
    if (h < 24) return h + (h === 1 ? ' hour' : ' hours') + ' ago';
    return d + (d === 1 ? ' day' : ' days') + ' ago';
  }
  function ageLine(r) {
    if (!r.submittedAt) return 'Submitted —';
    const when = new Date(r.submittedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const late = WAITING_ON_YOU.includes(r.status) && Date.now() - new Date(r.submittedAt).getTime() > 86400000;
    const who = WAITING_ON_YOU.includes(r.status) ? ' · waiting on you' : r.status === 'awaiting_confirmation' ? ' · waiting on the customer' : '';
    return `Submitted <span class="${late ? 'late' : ''}">${esc(ago(r.submittedAt))}</span> · ${esc(when)}${esc(who)}`;
  }

  function cardHtml(r) {
    const meta = STATUS_META[r.status] || STATUS_META.new;
    const phoneDigits = (r.phone || '').replace(/[^0-9+]/g, '');
    return `
    <div class="req" data-key="${escAttr(r.key)}">
      <div class="req-head">
        <div>
          <div class="req-name">${esc(r.name || 'Unnamed request')}</div>
          <div class="req-sub">${ageLine(r)}</div>
        </div>
        <div class="req-tags"><span class="pill ${meta.pill}">${meta.label}</span>${r.isMilitary ? '<span class="pill ok">Military</span>' : ''}</div>
      </div>
      <div class="req-body">
        <div><span class="lbl">Package</span>${r.package ? `<span class="tag">${esc(r.package)}</span>` : '—'}</div>
        <div><span class="lbl">Delivery</span>${esc(fmtReqDate(r.deliveryDate))}${r.deliveryWindow && !/no preference/i.test(r.deliveryWindow) ? ' — pref: ' + esc(r.deliveryWindow) : ''}</div>
        <div><span class="lbl">Pickup</span>${esc(fmtReqDate(r.pickupDate))}${r.pickupWindow && !/no preference/i.test(r.pickupWindow) ? ' — pref: ' + esc(r.pickupWindow) : ''}</div>
        <div><span class="lbl">Address</span>${esc(deliveryAddressOf(r) || '—')}</div>
        ${OPEN_STATUSES.includes(r.status) ? `<div class="avail-row"><span class="lbl">Stock</span><span class="avail-list">${requestAvailability(r)}</span></div>` : ''}
        <div><span class="lbl">Phone</span>${r.phone ? `<a href="tel:${escAttr(phoneDigits)}">${esc(r.phone)}</a>` : '—'}</div>
        <div><span class="lbl">Email</span>${r.email ? `<a href="mailto:${escAttr(r.email)}">${esc(r.email)}</a>` : '—'}</div>
        ${r.reviewNotes ? `<div><span class="lbl">Notes</span>${esc(r.reviewNotes)}</div>` : ''}
        ${r.status === 'declined' && r.declineReason ? `<div><span class="lbl">Declined</span>${esc(r.declineReason)}</div>` : ''}
      </div>

      <div class="req-actions" data-actions></div>
      <div class="decline-box" data-decline>
        <p>Why decline ${esc((r.name || 'this request').split(' ')[0])}?</p>
        <div class="reasons">
          <button type="button" data-reason="Booked up for these dates">Booked up</button>
          <button type="button" data-reason="Outside our service area">Outside service area</button>
          <button type="button" data-reason="Customer cancelled">Customer cancelled</button>
          <button type="button" data-reason="No response from customer">No response</button>
        </div>
        <div class="other">
          <input type="text" data-reason-other placeholder="Or type a reason" aria-label="Other reason">
          <button type="button" data-decline-other>Decline</button>
          <button type="button" class="secondary" data-decline-cancel>Cancel</button>
        </div>
      </div>

      <div class="req-actions">
        <button type="button" class="linklike" data-toggle-military>${r.isMilitary ? 'Unmark military' : 'Mark as military'}</button>
        ${r.hasMilitaryIdPhoto ? '<button type="button" class="linklike" data-view-id>View ID photo</button>' : ''}
        <button type="button" class="secondary" data-add-id>${r.hasMilitaryIdPhoto ? 'Replace ID photo' : 'Add ID photo'}</button>
      </div>

      <button type="button" class="toggle-note" data-toggle="edit">Edit details</button>
      <div class="edit-block" data-edit>
        <div class="grid2">
          <div><label>Name</label><input type="text" data-f="name" value="${escAttr(r.name || '')}"></div>
          <div><label>Phone</label><input type="tel" data-f="phone" value="${escAttr(r.phone || '')}"></div>
        </div>
        <div class="grid2">
          <div><label>Email</label><input type="email" data-f="email" value="${escAttr(r.email || '')}"></div>
          <div><label>Street Address</label><input type="text" data-f="deliveryAddressStreet" value="${escAttr(r.deliveryAddressStreet || '')}"></div>
        </div>
        <div class="grid2">
          <div><label>City</label><input type="text" data-f="deliveryAddressCity" value="${escAttr(r.deliveryAddressCity || '')}"></div>
          <div><label>State</label><input type="text" data-f="deliveryAddressState" value="${escAttr(r.deliveryAddressState || 'OK')}" maxlength="2"></div>
        </div>
        <div class="grid2">
          <div><label>Zip</label><input type="text" data-f="deliveryAddressZip" value="${escAttr(r.deliveryAddressZip || '')}" inputmode="numeric" maxlength="10"></div>
          <div></div>
        </div>
        <div class="grid2">
          <div><label>Delivery date</label><input type="date" data-f="deliveryDate" value="${escAttr(r.deliveryDate || '')}"></div>
          <div><label>Pickup date</label><input type="date" data-f="pickupDate" value="${escAttr(r.pickupDate || '')}"></div>
        </div>
        <button type="button" data-save-edit>Save changes</button>
      </div>

      <button type="button" class="toggle-note" data-toggle="note">${r.reviewNotes ? 'Edit note' : '+ Add note'}</button>
      <div class="note-block" data-note>
        <textarea rows="2" data-note-text placeholder="e.g. gate code, dog on property, availability check…">${esc(r.reviewNotes || '')}</textarea>
        <button type="button" data-save-note>Save note</button>
      </div>
    </div>`;
  }

  function wireCard(r) {
    const card = document.querySelector(`.req[data-key="${cssEscape(r.key)}"]`);
    if (!card) return;

    // Toggle note / edit blocks
    card.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const which = btn.dataset.toggle === 'note' ? '[data-note]' : '[data-edit]';
        const block = card.querySelector(which);
        block.style.display = block.style.display === 'block' ? 'none' : 'block';
      });
    });

    card.querySelector('[data-save-note]')?.addEventListener('click', () => {
      const notes = card.querySelector('[data-note-text]').value.trim();
      patch(r.key, { reviewNotes: notes }, 'Note saved.');
    });

    card.querySelector('[data-save-edit]')?.addEventListener('click', () => {
      const fields = {};
      card.querySelectorAll('[data-f]').forEach(inp => { fields[inp.dataset.f] = inp.value.trim(); });
      patch(r.key, fields, 'Details updated.');
    });

    card.querySelector('[data-toggle-military]')?.addEventListener('click', () => {
      patch(r.key, { isMilitary: !r.isMilitary }, r.isMilitary ? 'Unmarked military.' : 'Marked as military.');
    });
    card.querySelector('[data-add-id]')?.addEventListener('click', () => triggerIdCapture(r.militaryIdKey));
    card.querySelector('[data-view-id]')?.addEventListener('click', () => viewIdPhoto(r.militaryIdKey));

    const actions = card.querySelector('[data-actions]');
    actions.innerHTML = '';

    const addBtn = (label, cls, handler) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; if (cls) b.className = cls;
      b.addEventListener('click', handler);
      actions.appendChild(b);
    };

    if (r.status === 'new') {
      addBtn('Mark Reviewed', '', () => act(r.key, 'review', 'Marked reviewed.'));
      addBtn('Decline', 'secondary', () => declineFlow(r.key));
    } else if (r.status === 'reviewed') {
      addBtn('Text to Confirm →', '', () => {
        window.open(smsLink(r.phone, confirmMessage(r)), '_blank');
        act(r.key, 'send-confirmation', 'Marked awaiting confirmation.');
      });
      addBtn('Decline', 'secondary', () => declineFlow(r.key));
    } else if (r.status === 'awaiting_confirmation') {
      addBtn('Mark Confirmed', '', () => act(r.key, 'confirm', 'Marked confirmed.'));
      addBtn('Re-send Text', 'linklike', () => window.open(smsLink(r.phone, confirmMessage(r)), '_blank'));
      addBtn('Decline', 'secondary', () => declineFlow(r.key));
    } else if (r.status === 'confirmed') {
      addBtn('Create Invoice →', '', () => goToInvoice(r));
      addBtn('Decline', 'secondary', () => declineFlow(r.key));
    } else if (r.status === 'declined') {
      addBtn('Reopen', 'linklike', () => act(r.key, 'reopen', 'Reopened as new.'));
    }
    // invoiced: no actions, read-only

    // Decline opens the reasons in the card; one tap declines with that reason
    function declineFlow() { card.querySelector('[data-decline]').classList.toggle('shown'); }
    const decline = reason => act(r.key, 'decline', 'Declined' + (reason ? ': ' + reason.toLowerCase() : '') + '.', { declineReason: reason });
    card.querySelectorAll('[data-reason]').forEach(b => b.addEventListener('click', () => decline(b.dataset.reason)));
    card.querySelector('[data-decline-other]').addEventListener('click', () => decline(card.querySelector('[data-reason-other]').value.trim()));
    card.querySelector('[data-reason-other]').addEventListener('keydown', e => { if (e.key === 'Enter') decline(e.target.value.trim()); });
    card.querySelector('[data-decline-cancel]').addEventListener('click', () => card.querySelector('[data-decline]').classList.remove('shown'));
  }

  // ---- Military ID photo (staff-added) ----
  // Same upload-photo / get-photo pattern used for delivery/pickup proof
  // photos on admin-rentals.html. r.militaryIdKey already falls back to
  // r.key server-side (get-requests.mjs) when no customer self-upload
  // happened, so a staff-added photo is keyed to the request itself.
  let PENDING_ID_KEY = null;

  window.triggerIdCapture = (idKey) => {
    PENDING_ID_KEY = idKey;
    $('idFileInput').value = '';
    $('idFileInput').click();
  };

  $('idFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const idKey = PENDING_ID_KEY;
    PENDING_ID_KEY = null;
    if (!file || !idKey) return;
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret first.');
    try {
      const dataUrl = await compressImage(file, 1600, 0.72);
      const base64 = dataUrl.split(',')[1];
      const resp = await fetch('/.netlify/functions/upload-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key: idKey, type: 'military_id', imageBase64: base64, mimeType: 'image/jpeg' }),
      });
      if (resp.ok) { load(); }
      else {
        const detail = await resp.text().catch(() => '');
        showErr('ID upload failed (' + resp.status + '): ' + detail);
      }
    } catch (err) {
      showErr('Could not process photo: ' + (err.message || err));
    }
  });

  // Resizes/compresses an image file client-side via canvas, returns a JPEG data URL.
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else { width = Math.round(width * (maxDim / height)); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('Could not read image.'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('Could not read file.'));
      reader.readAsDataURL(file);
    });
  }

  // Opens a blank tab immediately (before the async fetch) so mobile Safari
  // doesn't treat it as a popup, then fills it in once the photo loads.
  window.viewIdPhoto = async (idKey) => {
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret first.');
    const win = window.open('', '_blank');
    if (win) {
      win.document.write(`<title>Military ID photo</title><body style="margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">Loading…</body>`);
    }
    try {
      const resp = await fetch('/.netlify/functions/get-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key: idKey, type: 'military_id' }),
      });
      if (!resp.ok) {
        const detail = await resp.text().catch(() => '');
        const msg = 'Could not load photo (' + resp.status + '): ' + detail;
        if (win) win.document.body.textContent = msg; else showErr(msg);
        return;
      }
      const data = await resp.json();
      if (win) {
        win.document.body.innerHTML = `<img src="data:${data.mimeType};base64,${data.imageBase64}" style="max-width:100%;max-height:100vh;">`;
      }
    } catch {
      if (win) win.document.body.textContent = 'Network error loading photo.'; else showErr('Network error loading photo.');
    }
  };

  function goToInvoice(r) {
    sessionStorage.setItem('rto-prefill-request', JSON.stringify(r));
    window.location.href = 'admin-invoice.html';
  }

  async function act(key, action, okMsg, extra) {
    const secret = $('secret').value.trim();
    try {
      const resp = await fetch('/.netlify/functions/update-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key, action, ...(extra || {}) }),
      });
      if (!resp.ok) return showErr('Update failed (' + resp.status + ').');
      const data = await resp.json();
      const idx = ALL.findIndex(x => x.key === key);
      if (idx >= 0) ALL[idx] = data.request;
      showOk(okMsg);
      render();
    } catch (e) {
      console.error('Update request failed:', e);
      showErr('Update failed — check the console for details.');
    }
  }

  async function patch(key, fields, okMsg) {
    const secret = $('secret').value.trim();
    try {
      const resp = await fetch('/.netlify/functions/update-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key, ...fields }),
      });
      if (!resp.ok) return showErr('Save failed (' + resp.status + ').');
      const data = await resp.json();
      const idx = ALL.findIndex(x => x.key === key);
      if (idx >= 0) ALL[idx] = data.request;
      showOk(okMsg);
      render();
    } catch (e) {
      console.error('Save failed:', e);
      showErr('Save failed — check the console for details.');
    }
  }

  // Rush = delivery date is today or tomorrow relative to when this is sent.
  // deliveryDate is a date-only string (YYYY-MM-DD), so "under 24 hrs notice"
  // is approximated as same-day or next-day rather than an exact hour count.
  function isRushRequest(r) {
    if (!r.deliveryDate) return false;
    const delivery = new Date(r.deliveryDate + 'T00:00:00');
    if (isNaN(delivery)) return false;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffDays = Math.round((delivery - today) / (1000 * 60 * 60 * 24));
    return diffDays <= 1;
  }

  function confirmMessage(r) {
    const first = (r.name || 'there').split(' ')[0];
    const pkg = r.package || 'your package';
    const rushNote = isRushRequest(r)
      ? ` Since that's a rush request (under 24 hrs out), a $25 expedite fee applies, it'll show as its own line on your invoice.`
      : '';
    return `Hi ${first}, Ready Tote Oklahoma here! Got your request for ${pkg}. Your dates, ${fmtReqDate(r.deliveryDate)} to ${fmtReqDate(r.pickupDate)}, work on our end.${rushNote} Reply YES to confirm and we will send you an invoice shortly.`;
  }

  // normalizePhone() and smsLink() now live in admin-shared.js.

  // This page shows an em dash rather than blank for a missing date —
  // wraps the shared fmtDate (from admin-shared.js) with that fallback.
  // Named differently on purpose: naming this fmtDate would shadow the
  // global admin-shared.js function of the same name (function declarations
  // hoist to global scope in a plain script), making sharedFmtDate below
  // resolve to this wrapper itself instead of the real one, infinite
  // self-recursion on every call.
  const sharedFmtDate = window.fmtDate;
  function fmtReqDate(iso) { return sharedFmtDate(iso, '\u2014'); }
  function fmtDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(2);
    const hh = d.getHours() % 12 || 12;
    const min = String(d.getMinutes()).padStart(2, '0');
    const ap = d.getHours() >= 12 ? 'PM' : 'AM';
    return `${mm}/${dd}/${yy} ${hh}:${min} ${ap}`;
  }
  function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }
  function showErr(m) { const s = $('status'); s.style.display = 'block'; s.className = 'status err'; s.textContent = m; }
  function showOk(m) { const s = $('status'); s.style.display = 'block'; s.className = 'status ok'; s.textContent = m; setTimeout(() => { s.style.display = 'none'; }, 2500); }
</script>
</body>
