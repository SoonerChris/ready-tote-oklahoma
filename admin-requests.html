<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F5F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ready Tote">
<link rel="apple-touch-icon" href="/app-icon-180.png">
<title>Requests · Ready Tote Oklahoma admin</title>
<link rel="stylesheet" href="admin-shared.css?v=20261022">
<script src="admin-shared.js?v=20261111"></script>
<script src="admin-availability.js?v=20261024"></script>
<style>
  :root{--col:820px;}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .toolbar select{width:auto;margin:0;min-width:220px;}
  .toolbar input[type=search]{flex:1;min-width:180px;margin:0;}
  .count-badge{font-size:14px;color:var(--steel);white-space:nowrap;}

  .req{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;background:var(--white);}
  .req-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .req-name{font-weight:bold;font-size:16px;}
  .req-sub{font-size:13px;color:var(--steel);margin-top:2px;font-variant-numeric:tabular-nums;}
  .req-sub .late{color:#831C1E;font-weight:600;}
  .req-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .avail-row{display:flex;align-items:flex-start;}
  .avail-row .lbl{flex:none;}
  .avail-list{display:flex;flex-wrap:wrap;min-width:0;}
  /* Decline: pick a reason in place instead of a browser pop-up */
  .decline-box{display:none;margin-top:12px;padding:12px 14px;border-radius:8px;background:#FAF8F3;}
  .decline-box.shown{display:block;}
  .decline-box p{margin:0 0 8px;font-size:14px;font-weight:600;}
  .decline-box .reasons{display:flex;flex-wrap:wrap;gap:6px;}
  .decline-box .reasons button{width:auto;margin:0;padding:7px 12px;font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--control);}
  .decline-box .reasons button:hover{background:#fff;border-color:var(--red);color:var(--red);}
  .decline-box .other{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .decline-box .other input{flex:1 1 220px;margin:0;height:36px;padding:6px 10px;font-size:14px;}
  .decline-box .other button{width:auto;margin:0;height:36px;padding:0 12px;font-size:14px;}
  .req-body{font-size:14px;line-height:1.65;}
  .req-body{font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;}
  .req-body .lbl{color:var(--steel);display:inline-block;min-width:84px;}
  .req-body a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--control);}
  .req-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .req-actions button{margin-top:0;width:auto;padding:8px 14px;font-size:14px;}
  .req-actions button.secondary{background:var(--white);border:1px solid var(--control);color:var(--ink);}
  .req-actions button.secondary:hover{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .req-actions button.linklike{background:var(--white);border:1px solid var(--control);color:var(--ink);}

  .toggle-note{margin-right:16px;background:none;border:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:bold;cursor:pointer;padding:0;margin-top:10px;width:auto;}
  .toggle-note:hover{background:none;}
  .note-block{display:none;margin-top:10px;}
  .note-block textarea{resize:vertical;}
  .note-block button{margin-top:8px;width:auto;padding:7px 14px;font-size:14px;}

  .edit-block{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:12px;}
  .edit-block .grid2{margin-bottom:10px;}
  .edit-block label{font-size:13px;margin:6px 0 4px;}
  .edit-block button{margin-top:6px;width:auto;padding:7px 14px;font-size:14px;}

  .no-results{padding:24px;text-align:center;color:var(--steel);font-size:15px;}

  /* Status tabs with counts */
  .tabs{display:flex;gap:2px;padding:2px;background:var(--track);border-radius:8px;flex-wrap:wrap;margin-bottom:10px;}
  .tabs button{all:unset;box-sizing:border-box;cursor:pointer;height:32px;padding:0 12px;border:1px solid transparent;border-radius:6px;font-size:13px;font-weight:600;color:var(--steel);white-space:nowrap;}
  .tabs button:hover{color:var(--ink);}
  .tabs button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:var(--line);}
  .tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:1px;}
  .tabs .n{margin-left:6px;font-variant-numeric:tabular-nums;color:var(--steel);font-weight:500;}
  .summary{margin:-8px 0 18px;font-size:15px;color:var(--steel);}
  .summary b{color:var(--ink);}

  /* Things to double-check before confirming */
  .warns{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .req-body .muted{color:var(--steel);font-size:13px;}
  .warn{padding:7px 10px;border-radius:6px;background:var(--gold-bg);color:#6B4C0C;font-size:13px;font-weight:600;line-height:1.4;}

  /* "Sent to Hannah?" after tapping Text to confirm */
  .ask{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:#FAF8F3;border-radius:8px;font-size:14px;font-weight:600;}
  .ask[hidden]{display:none;}
  .undo-line{display:flex;align-items:center;gap:12px;margin-top:12px;padding:9px 12px;border-radius:8px;background:var(--green-bg);color:#14492F;font-size:14px;font-weight:600;}
  .undo-line button.linklike{all:unset;cursor:pointer;margin-left:auto;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:600;}
  .ask button{width:auto;margin:0;padding:7px 14px;font-size:14px;}
  .ask button.linklike{background:none;border:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:7px 4px;}
</style>
</head>
<body>
<div class="wrap">
  <nav class="admin-nav wide" aria-label="Admin tools">
    <a href="admin.html">Dashboard</a>
    <a href="admin-requests.html" aria-current="page">Requests</a>
    <a href="admin-invoice.html">Send Invoice</a>
    <a href="admin-invoice.html?mode=log">Add Rental</a>
    <a href="admin-reminders.html">Reminders</a>
  <a href="admin-rentals.html">All Rentals</a>
    <a href="admin-contacts.html">Contacts</a>
    <a href="admin-finance.html">Finance</a>
    <a href="admin-outreach.html">Outreach</a>
    <a href="admin-inventory.html">Inventory</a>
  </nav>

  <h1>Booking requests</h1>
  <p class="summary" id="summary">Loading requests…</p>

  <div class="secret-bar">
  <input type="hidden" id="secret">
    <button id="loadBtn">Refresh</button>
  </div>
  <div class="status" id="status"></div>
  <input type="file" id="idFileInput" accept="image/*" style="display:none">

  <div id="results" style="display:none;">
    <div class="tabs" id="statusTabs" role="group" aria-label="Show"></div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, phone, email…">
      <span class="count-badge" id="countBadge"></span>
    </div>
    <div id="list"></div>
  </div>
</div>

<footer><a href="/">readytoteokc.com</a></footer>

<script>
  const $ = (id) => document.getElementById(id);
  $('secret').value = adminSessionMarker();   // signed-in marker; the session cookie is what the server checks

  let ALL = [];
  const STATUS_META = {
    new:                    { label: 'New',                     pill: 'pending' },
    reviewed:               { label: 'Reviewed',                 pill: 'pending' },
    awaiting_confirmation:  { label: 'Awaiting customer',        pill: 'pending' },
    confirmed:              { label: 'Confirmed',                pill: 'ok' },
    declined:               { label: 'Declined',                 pill: 'err' },
    invoiced:               { label: 'Invoiced',                 pill: 'ok' },
  };
  const ACTIVE_STATUSES = ['new', 'reviewed', 'awaiting_confirmation', 'confirmed'];

  $('loadBtn').addEventListener('click', load);
  let FILTER = 'active';
  const TABS = [
    ['active', 'Active'], ['new', 'New'], ['reviewed', 'Reviewed'], ['awaiting_confirmation', 'Awaiting customer'],
    ['confirmed', 'Ready to invoice'], ['invoiced', 'Invoiced'], ['declined', 'Declined'], ['all', 'All'],
  ];
  $('statusTabs').addEventListener('click', e => {
    const b = e.target.closest('[data-filter]');
    if (b) { FILTER = b.dataset.filter; render(); }
  });
  $('search').addEventListener('input', render);
  if ($('secret').value) load();

  async function load() {
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret.');
    const btn = $('loadBtn');
    btn.disabled = true; btn.textContent = 'Refresh';
    try {
      const [resp] = await Promise.all([
        fetch('/.netlify/functions/get-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret }),
        }),
        loadAvailability(),   // refreshed on every load, so status changes show up
      ]);
      if (resp.status === 401) { showErr('Wrong admin secret.'); return; }
      if (!resp.ok) { showErr('Load failed (' + resp.status + ').'); return; }
      const data = await resp.json();
      ALL = (data.requests || []).sort((a, b) => (b.submittedAt || '').localeCompare(a.submittedAt || ''));
      $('results').style.display = 'block';
      $('status').style.display = 'none';
      render();
    } catch (e) {
      console.error('Load requests failed:', e);
      showErr('Load failed. Try Refresh.');
    } finally {
      btn.disabled = false; btn.textContent = 'Refresh';
    }
  }

  const inTab = (r, f) => f === 'all' || (f === 'active' ? ACTIVE_STATUSES.includes(r.status) : r.status === f);

  // Waiting on you first, then waiting on the customer, soonest delivery
  // first within each; finished requests newest first.
  function sortRank(r) { return WAITING_ON_YOU.includes(r.status) ? 0 : r.status === 'awaiting_confirmation' ? 1 : 2; }
  function byUrgency(a, b) {
    const ra = sortRank(a), rb = sortRank(b);
    if (ra !== rb) return ra - rb;
    if (ra < 2) return (a.deliveryDate || '9999').localeCompare(b.deliveryDate || '9999');
    return (b.submittedAt || '').localeCompare(a.submittedAt || '');
  }

  function render() {
    // An Undo only makes sense while the request is still where that move
    // put it. If it moved since (the customer tapped the confirm link, or
    // someone else changed it), drop the Undo instead of offering a wrong one.
    if (LAST_MOVE && ALL.find(r => r.key === LAST_MOVE.key)?.status !== LAST_MOVE.status) LAST_MOVE = null;
    // Tabs with live counts; Reviewed only shows while something is in it
    $('statusTabs').innerHTML = TABS
      .filter(([f]) => f !== 'reviewed' || ALL.some(r => r.status === 'reviewed') || FILTER === 'reviewed')
      .map(([f, label]) => {
        const n = f === 'all' || f === 'declined' || f === 'invoiced' ? '' : ALL.filter(r => inTab(r, f)).length;
        return `<button type="button" data-filter="${f}" aria-pressed="${FILTER === f}">${label}${n !== '' ? `<span class="n">${n}</span>` : ''}</button>`;
      }).join('');

    // One line: what's waiting on you, and how long the oldest has waited
    const waiting = ALL.filter(r => WAITING_ON_YOU.includes(r.status));
    const oldest = waiting.reduce((m, r) => !m || (r.submittedAt || '') < (m.submittedAt || '') ? r : m, null);
    const withCustomer = ALL.filter(r => r.status === 'awaiting_confirmation').length;
    $('summary').innerHTML = waiting.length
      ? `<b>${waiting.length} waiting on you</b>${oldest && oldest.submittedAt ? `, oldest ${esc(ago(oldest.submittedAt).replace(' ago', ''))}` : ''}${withCustomer ? ` · ${withCustomer} waiting on the customer` : ''}.`
      : `Nothing waiting on you${withCustomer ? ` · ${withCustomer} waiting on the customer` : ''}.`;

    const q = $('search').value.trim().toLowerCase();
    let rows = ALL.filter(r => inTab(r, FILTER)).sort(byUrgency);
    if (q) {
      rows = rows.filter(r => [r.name, r.phone, r.email].filter(Boolean).join(' ').toLowerCase().includes(q));
    }
    $('countBadge').textContent = rows.length + (rows.length === 1 ? ' request' : ' requests');

    const list = $('list');
    if (!rows.length) {
      list.innerHTML = '<div class="no-results">No requests match this view.</div>';
      return;
    }
    list.innerHTML = rows.map(cardHtml).join('');
    rows.forEach(wireCard);
  }

  // Statuses still in play, where "do we have the totes?" matters
  const OPEN_STATUSES = ['new', 'reviewed', 'awaiting_confirmation', 'confirmed'];
  function requestAvailability(r) {
    const need = totesInPackageText(r.package);
    // Awaiting-confirmation and confirmed requests already hold their totes
    // in the availability numbers; add them back so it isn't counted twice.
    const needDollies = dolliesInPackageText(r.package);
    const held = ['awaiting_confirmation', 'confirmed'].includes(r.status) && need
      ? { start: r.deliveryDate, end: r.pickupDate, totes: need, dollies: needDollies } : null;
    return availabilityHtml(checkAvailability(r.deliveryDate, r.pickupDate, need, held, needDollies));
  }

  // "Submitted 5 hours ago · Oct 21, 3:41 PM". Requests waiting on you
  // (new, reviewed, confirmed) turn red after a day so nothing sits unanswered.
  const WAITING_ON_YOU = ['new', 'reviewed', 'confirmed'];
  function ago(iso) {
    const ms = Date.now() - new Date(iso).getTime();
    if (!iso || isNaN(ms)) return '';
    const m = Math.round(ms / 60000), h = Math.round(ms / 3600000), d = Math.floor(ms / 86400000);
    if (m < 2) return 'just now';
    if (m < 60) return m + ' minutes ago';
    if (h < 24) return h + (h === 1 ? ' hour' : ' hours') + ' ago';
    return d + (d === 1 ? ' day' : ' days') + ' ago';
  }
  function ageLine(r) {
    if (!r.submittedAt) return 'Submitted date unknown';
    const when = new Date(r.submittedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const late = WAITING_ON_YOU.includes(r.status) && Date.now() - new Date(r.submittedAt).getTime() > 86400000;
    const who = WAITING_ON_YOU.includes(r.status) ? ' · waiting on you' : r.status === 'awaiting_confirmation' ? ' · waiting on the customer' : '';
    const byLink = r.status === 'confirmed' && r.confirmedBy === 'customer' ? ' · customer confirmed by link' : '';
    return `Submitted <span class="${late ? 'late' : ''}">${esc(ago(r.submittedAt))}</span> · ${esc(when)}${esc(who)}${esc(byLink)}`;
  }

  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5);
  const todayCT = () => new Date().toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
  const phoneKey = p => String(p || '').replace(/\D/g, '').slice(-10);

  // Things worth a second look before confirming: odd rental length, a
  // delivery date already gone, or the same customer with another open request.
  function warnings(r) {
    if (!ACTIVE_STATUSES.includes(r.status)) return [];
    const out = [];
    if (r.deliveryDate && r.pickupDate) {
      const len = daysBetween(r.deliveryDate, r.pickupDate);
      if (len !== 14) out.push(len <= 0 ? 'Pickup is not after delivery. Fix the dates before confirming.'
        : `Pickup is ${len} days after delivery. Packages are 2 weeks.`);
    }
    if (r.deliveryDate && r.deliveryDate < todayCT()) out.push('The delivery date has already passed.');
    const other = ALL.find(o => o.key !== r.key && ACTIVE_STATUSES.includes(o.status) && (
      (r.email && o.email && o.email.toLowerCase() === r.email.toLowerCase()) ||
      (phoneKey(r.phone).length === 10 && phoneKey(o.phone) === phoneKey(r.phone))));
    if (other) out.push(`Same customer has another open request (delivery ${fmtReqDate(other.deliveryDate)}, ${(STATUS_META[other.status] || STATUS_META.new).label.toLowerCase()}).`);
    return out;
  }

  // Delivery today or tomorrow: the $25 expedite fee applies
  const isRush = r => ACTIVE_STATUSES.includes(r.status) && r.deliveryDate && r.deliveryDate >= todayCT() && isRushRequest(r);

  function cardHtml(r) {
    const meta = STATUS_META[r.status] || STATUS_META.new;
    const warns = warnings(r);
    const addr = deliveryAddressOf(r);
    const pref = w => w && !/no preference/i.test(w) ? ' · prefers ' + esc(w.replace(/\s*\(.*\)\s*$/, '').toLowerCase()) : '';
    const phoneDigits = (r.phone || '').replace(/[^0-9+]/g, '');
    return `
    <div class="req" data-key="${escAttr(r.key)}">
      <div class="req-head">
        <div>
          <div class="req-name">${esc(r.name || 'Unnamed request')}</div>
          <div class="req-sub">${ageLine(r)}</div>
        </div>
        <div class="req-tags">${isRush(r) ? '<span class="pill err">Rush</span>' : ''}<span class="pill ${meta.pill}">${meta.label}</span>${r.isMilitary ? '<span class="pill ok">Military</span>' : ''}${r.serviceType === 'self' ? '<span class="pill pending">Self pickup</span>' : ''}</div>
      </div>
      <div class="req-body">
        <div><span class="lbl">Package</span>${r.package ? `<span class="tag">${esc(r.package)}</span>` : 'Not given'}</div>
        <div><span class="lbl">Delivery</span>${esc(fmtReqDate(r.deliveryDate))}${pref(r.deliveryWindow)}</div>
        <div><span class="lbl">Pickup</span>${esc(fmtReqDate(r.pickupDate))}${pref(r.pickupWindow)}</div>
        <div><span class="lbl">Address</span>${addr ? `<a href="${escAttr(mapsLink(addr))}" target="_blank" rel="noopener">${esc(addr)}</a>` : r.serviceType === 'self' ? 'Not needed, self pickup' : 'Not given'}</div>
        ${OPEN_STATUSES.includes(r.status) ? `<div class="avail-row"><span class="lbl">Stock</span><span class="avail-list">${requestAvailability(r)}</span></div>` : ''}
        <div><span class="lbl">Phone</span>${r.phone ? `<a href="tel:${escAttr(phoneDigits)}">${esc(fmtPhone(r.phone))}</a>` : 'Not given'}</div>
        <div><span class="lbl">Email</span>${r.email ? `<a href="mailto:${escAttr(r.email)}">${esc(r.email)}</a>` : 'Not given'}</div>
        ${r.promoCode ? `<div><span class="lbl">Promo</span><b>${esc(r.promoCode)}</b> <span class="muted">check it's valid before invoicing</span></div>` : ''}
        ${r.reviewNotes ? `<div><span class="lbl">Notes</span>${esc(r.reviewNotes)}</div>` : ''}
        ${r.status === 'declined' && r.declineReason ? `<div><span class="lbl">Declined</span>${esc(r.declineReason)}</div>` : ''}
      </div>
      ${warns.length ? `<div class="warns">${warns.map(w => `<div class="warn">${esc(w)}</div>`).join('')}</div>` : ''}

      <div class="req-actions" data-actions></div>
      ${LAST_MOVE && LAST_MOVE.key === r.key ? `<div class="undo-line"><span>${esc(LAST_MOVE.label)}</span><button type="button" class="linklike" data-undo>Undo</button></div>` : ''}
      <div class="ask" data-ask${OPEN_ASKS.has(r.key) ? '' : ' hidden'}>
        <span>Sent the confirm text to ${esc((r.name || 'them').split(' ')[0])}?</span>
        <button type="button" data-ask-yes>Yes, sent</button>
        <button type="button" class="linklike" data-ask-no>Not yet</button>
      </div>
      <div class="decline-box" data-decline>
        <p>Why decline ${esc((r.name || 'this request').split(' ')[0])}?</p>
        <div class="reasons">
          <button type="button" data-reason="Booked up for these dates">Booked up</button>
          <button type="button" data-reason="Outside our service area">Outside service area</button>
          <button type="button" data-reason="Customer cancelled">Customer cancelled</button>
          <button type="button" data-reason="No response from customer">No response</button>
        </div>
        <div class="other">
          <input type="text" data-reason-other placeholder="Or type a reason" aria-label="Other reason">
          <button type="button" data-decline-other>Decline</button>
          <button type="button" class="secondary" data-decline-cancel>Cancel</button>
        </div>
      </div>

      <button type="button" class="toggle-note" data-toggle="edit">Edit details</button>
      <div class="edit-block" data-edit>
        <div class="grid2">
          <div><label>Name</label><input type="text" data-f="name" value="${escAttr(r.name || '')}"></div>
          <div><label>Phone</label><input type="tel" data-f="phone" value="${escAttr(r.phone || '')}"></div>
        </div>
        <div class="grid2">
          <div><label>Email</label><input type="email" data-f="email" value="${escAttr(r.email || '')}"></div>
          <div><label>Street Address</label><input type="text" data-f="deliveryAddressStreet" value="${escAttr(r.deliveryAddressStreet || '')}"></div>
        </div>
        <div class="grid2">
          <div><label>City</label><input type="text" data-f="deliveryAddressCity" value="${escAttr(r.deliveryAddressCity || '')}"></div>
          <div><label>State</label><input type="text" data-f="deliveryAddressState" value="${escAttr(r.deliveryAddressState || 'OK')}" maxlength="2"></div>
        </div>
        <div class="grid2">
          <div><label>Zip</label><input type="text" data-f="deliveryAddressZip" value="${escAttr(r.deliveryAddressZip || '')}" inputmode="numeric" maxlength="10"></div>
          <div></div>
        </div>
        <div class="grid2">
          <div><label>Package</label><select data-f="package">${packageOptions(r.package)}</select></div>
          <div><label>Promo code</label><input type="text" data-f="promoCode" maxlength="40" value="${escAttr(r.promoCode || '')}"></div>
        </div>
        <div class="grid2">
          <div><label>Delivery date</label><input type="date" data-f="deliveryDate" value="${escAttr(r.deliveryDate || '')}"></div>
          <div><label>Pickup date</label><input type="date" data-f="pickupDate" value="${escAttr(r.pickupDate || '')}"></div>
        </div>
        <div class="grid2">
          <div><label>Delivery time</label><select data-f="deliveryWindow">${windowOptions(r.deliveryWindow)}</select></div>
          <div><label>Pickup time</label><select data-f="pickupWindow">${windowOptions(r.pickupWindow)}</select></div>
        </div>
        <button type="button" data-save-edit>Save changes</button>
      </div>

      ${STEP_BACK[r.status] ? `<button type="button" class="toggle-note" data-move-back>${STEP_BACK[r.status](r)[1]}</button>` : ''}
      <button type="button" class="toggle-note" data-toggle="note">${r.reviewNotes ? 'Edit note' : '+ Add note'}</button>
      <button type="button" class="toggle-note" data-toggle-military>${r.isMilitary ? 'Unmark military' : 'Mark military'}</button>
      ${r.hasMilitaryIdPhoto ? '<button type="button" class="toggle-note" data-view-id>View ID photo</button>' : ''}
      <button type="button" class="toggle-note" data-add-id>${r.hasMilitaryIdPhoto ? 'Replace ID photo' : 'Add ID photo'}</button>
      <div class="note-block" data-note>
        <textarea rows="2" data-note-text placeholder="e.g. gate code, dog on property, availability check…">${esc(r.reviewNotes || '')}</textarea>
        <button type="button" data-save-note>Save note</button>
      </div>
    </div>`;
  }

  // Package choices for Edit details: the four packages from packages.json,
  // plus whatever the request says now if it's not one of them, so saving
  // without touching it never changes it.
  let PACKAGES = [];
  fetch('packages.json').then(r => r.json()).then(d => { PACKAGES = (d.packages || []).map(p => p.name); if (ALL.length) render(); }).catch(() => {});
  function packageOptions(current) {
    const names = [...PACKAGES];
    const cur = String(current || '');
    const list = cur && !names.includes(cur) ? [cur, ...names] : names;
    if (!list.length) return `<option value="">No package</option>`;
    return list.map(n => `<option value="${escAttr(n)}"${n === cur ? ' selected' : ''}>${esc(n)}</option>`).join('');
  }
  const WINDOWS = ['No preference', 'Morning (8 AM – 12 PM)', 'Afternoon (12 – 5 PM)', 'Evening (5 – 8 PM)'];
  function windowOptions(current) {
    const cur = current || 'No preference';
    const list = WINDOWS.includes(cur) ? WINDOWS : [cur, ...WINDOWS];
    return list.map(w => `<option value="${escAttr(w)}"${w === cur ? ' selected' : ''}>${esc(w)}</option>`).join('');
  }

  const OPEN_ASKS = new Set();   // requests showing "Sent the confirm text?"; kept across re-renders

  // Undo for status changes. The latest change shows an Undo right in its
  // card; every open request also has a "Move back" link for later.
  let LAST_MOVE = null;   // { key, prev, label, status }
  const STEP_BACK = {
    awaiting_confirmation: (r) => r.reviewedAt ? ['review', 'Move back to reviewed'] : ['reopen', 'Move back to new'],
    confirmed: () => ['unconfirm', 'Move back to awaiting customer'],
  };
  const UNDO_ACTION = { new: 'reopen', reviewed: 'review', awaiting_confirmation: 'unconfirm', confirmed: 'confirm' };
  function moveBack(r, action) {
    LAST_MOVE = null;
    act(r.key, action, 'Moved back to ' + (action === 'unconfirm' ? 'awaiting customer' : action === 'review' ? 'reviewed' : 'new') + '.');
  }

  // Text to confirm: check stock first, open Messages, then ask whether it
  // went out before moving the request to "Awaiting customer".
  function textToConfirm(r, card) {
    const need = totesInPackageText(r.package);
    const needDollies = dolliesInPackageText(r.package);
    const held = ['awaiting_confirmation', 'confirmed'].includes(r.status) && need
      ? { start: r.deliveryDate, end: r.pickupDate, totes: need, dollies: needDollies } : null;
    const res = checkAvailability(r.deliveryDate, r.pickupDate, need, held, needDollies);
    if (res && !res.ok) {
      const short = !res.totesOk ? `Only ${res.free} totes free on the tightest day, this needs ${res.need}.`
        : `Only ${res.dolly.free} dollies free on the tightest day, this needs ${res.dolly.need}.`;
      if (!confirm(`Not enough stock for these dates. ${short}\n\nThe text tells the customer their dates work. Text anyway?`)) return;
    } else if (AVAIL_FAILED && !confirm('Couldn’t check stock right now. The text tells the customer their dates work. Text anyway?')) {
      return;
    }
    if (!r.confirmToken) saveConfirmToken(r);
    window.open(smsLink(r.phone, confirmMessage(r)), '_blank');
    if (r.status === 'awaiting_confirmation') return;   // a re-send; status is already right
    OPEN_ASKS.add(r.key);
    setTimeout(() => { const a = card.querySelector('[data-ask]'); if (a) a.hidden = false; }, 400);
  }

  function wireCard(r) {
    const card = document.querySelector(`.req[data-key="${cssEscape(r.key)}"]`);
    if (!card) return;

    // Toggle note / edit blocks
    card.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const which = btn.dataset.toggle === 'note' ? '[data-note]' : '[data-edit]';
        const block = card.querySelector(which);
        block.style.display = block.style.display === 'block' ? 'none' : 'block';
      });
    });

    card.querySelector('[data-save-note]')?.addEventListener('click', () => {
      const notes = card.querySelector('[data-note-text]').value.trim();
      patch(r.key, { reviewNotes: notes }, 'Note saved.');
    });

    // Packages are 2 weeks: a new delivery date moves the pickup with it,
    // unless the pickup was changed by hand in this edit
    const dIn = card.querySelector('[data-f=deliveryDate]'), pIn = card.querySelector('[data-f=pickupDate]');
    let pickupTouched = false;
    pIn.addEventListener('input', () => { pickupTouched = true; });
    dIn.addEventListener('change', () => {
      if (!pickupTouched && /^\d{4}-\d{2}-\d{2}$/.test(dIn.value)) {
        const d = new Date(dIn.value + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + 14);
        pIn.value = d.toISOString().slice(0, 10);
      }
    });

    card.querySelector('[data-undo]')?.addEventListener('click', () => {
      const m = LAST_MOVE; if (!m) return;
      LAST_MOVE = null;
      act(r.key, UNDO_ACTION[m.prev], 'Undone. Back to ' + (STATUS_META[m.prev] || STATUS_META.new).label.toLowerCase() + '.');
    });
    card.querySelector('[data-move-back]')?.addEventListener('click', () => {
      const [action, label] = STEP_BACK[r.status](r);
      if (confirm(label + ' for ' + (r.name || 'this request') + '?')) moveBack(r, action);
    });

    card.querySelector('[data-ask-yes]').addEventListener('click', () => {
      OPEN_ASKS.delete(r.key);
      act(r.key, 'send-confirmation', 'Marked awaiting the customer.');
    });
    card.querySelector('[data-ask-no]').addEventListener('click', () => {
      OPEN_ASKS.delete(r.key);
      card.querySelector('[data-ask]').hidden = true;
    });

    card.querySelector('[data-save-edit]')?.addEventListener('click', () => {
      const fields = {};
      card.querySelectorAll('[data-f]').forEach(inp => { fields[inp.dataset.f] = inp.value.trim(); });
      patch(r.key, fields, 'Details updated.');
    });

    card.querySelector('[data-toggle-military]')?.addEventListener('click', () => {
      patch(r.key, { isMilitary: !r.isMilitary }, r.isMilitary ? 'Unmarked military.' : 'Marked as military.');
    });
    card.querySelector('[data-add-id]')?.addEventListener('click', () => triggerIdCapture(r.militaryIdKey));
    card.querySelector('[data-view-id]')?.addEventListener('click', () => viewIdPhoto(r.militaryIdKey));

    const actions = card.querySelector('[data-actions]');
    actions.innerHTML = '';

    const addBtn = (label, cls, handler) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; if (cls) b.className = cls;
      b.addEventListener('click', handler);
      actions.appendChild(b);
    };

    if (r.status === 'new' || r.status === 'reviewed') {
      if (r.phone) addBtn('Text to confirm', '', () => textToConfirm(r, card));
      if (r.status === 'new') addBtn('Mark reviewed', 'linklike', () => act(r.key, 'review', 'Marked reviewed.'));
      addBtn('Decline', 'secondary', () => declineFlow(r.key));
    } else if (r.status === 'awaiting_confirmation') {
      addBtn('Mark confirmed', '', () => act(r.key, 'confirm', 'Marked confirmed.'));
      if (r.phone) addBtn('Re-send text', 'linklike', () => textToConfirm(r, card));
      addBtn('Decline', 'secondary', () => declineFlow(r.key));
    } else if (r.status === 'confirmed') {
      addBtn('Create invoice', '', () => goToInvoice(r));
      addBtn('Decline', 'secondary', () => declineFlow(r.key));
    } else if (r.status === 'declined') {
      addBtn('Reopen', 'linklike', () => act(r.key, 'reopen', 'Reopened as new.'));
    }
    // invoiced: no actions, read-only

    // Decline opens the reasons in the card; one tap declines with that reason
    function declineFlow() { card.querySelector('[data-decline]').classList.toggle('shown'); }
    const decline = reason => act(r.key, 'decline', 'Declined' + (reason ? ': ' + reason.toLowerCase() : '') + '.', { declineReason: reason });
    card.querySelectorAll('[data-reason]').forEach(b => b.addEventListener('click', () => decline(b.dataset.reason)));
    card.querySelector('[data-decline-other]').addEventListener('click', () => decline(card.querySelector('[data-reason-other]').value.trim()));
    card.querySelector('[data-reason-other]').addEventListener('keydown', e => { if (e.key === 'Enter') decline(e.target.value.trim()); });
    card.querySelector('[data-decline-cancel]').addEventListener('click', () => card.querySelector('[data-decline]').classList.remove('shown'));
  }

  // ---- Military ID photo (staff-added) ----
  // Same upload-photo / get-photo pattern used for delivery/pickup proof
  // photos on admin-rentals.html. r.militaryIdKey already falls back to
  // r.key server-side (get-requests.mjs) when no customer self-upload
  // happened, so a staff-added photo is keyed to the request itself.
  let PENDING_ID_KEY = null;

  window.triggerIdCapture = (idKey) => {
    PENDING_ID_KEY = idKey;
    $('idFileInput').value = '';
    $('idFileInput').click();
  };

  $('idFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const idKey = PENDING_ID_KEY;
    PENDING_ID_KEY = null;
    if (!file || !idKey) return;
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret first.');
    try {
      const dataUrl = await compressImage(file, 1600, 0.72);
      const base64 = dataUrl.split(',')[1];
      const resp = await fetch('/.netlify/functions/upload-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key: idKey, type: 'military_id', imageBase64: base64, mimeType: 'image/jpeg' }),
      });
      if (resp.ok) { load(); }
      else {
        const detail = await resp.text().catch(() => '');
        showErr('ID upload failed (' + resp.status + '): ' + detail);
      }
    } catch (err) {
      showErr('Could not process photo: ' + (err.message || err));
    }
  });

  // Resizes/compresses an image file client-side via canvas, returns a JPEG data URL.
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width >= height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
            else { width = Math.round(width * (maxDim / height)); height = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => reject(new Error('Could not read image.'));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error('Could not read file.'));
      reader.readAsDataURL(file);
    });
  }

  // Opens a blank tab immediately (before the async fetch) so mobile Safari
  // doesn't treat it as a popup, then fills it in once the photo loads.
  window.viewIdPhoto = async (idKey) => {
    const secret = $('secret').value.trim();
    if (!secret) return showErr('Enter the admin secret first.');
    const win = window.open('', '_blank');
    if (win) {
      win.document.write(`<title>Military ID photo</title><body style="margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;">Loading…</body>`);
    }
    try {
      const resp = await fetch('/.netlify/functions/get-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key: idKey, type: 'military_id' }),
      });
      if (!resp.ok) {
        const detail = await resp.text().catch(() => '');
        const msg = 'Could not load photo (' + resp.status + '): ' + detail;
        if (win) win.document.body.textContent = msg; else showErr(msg);
        return;
      }
      const data = await resp.json();
      if (win) {
        win.document.body.innerHTML = `<img src="data:${data.mimeType};base64,${data.imageBase64}" style="max-width:100%;max-height:100vh;">`;
      }
    } catch {
      if (win) win.document.body.textContent = 'Network error loading photo.'; else showErr('Network error loading photo.');
    }
  };

  function goToInvoice(r) {
    sessionStorage.setItem('rto-prefill-request', JSON.stringify(r));
    window.location.href = 'admin-invoice.html';
  }

  async function act(key, action, okMsg, extra) {
    const secret = $('secret').value.trim();
    const before = ALL.find(x => x.key === key);
    const prev = before && before.status;
    try {
      const resp = await fetch('/.netlify/functions/update-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key, action, ...(extra || {}) }),
      });
      if (!resp.ok) return showErr('Update failed (' + resp.status + ').');
      const data = await resp.json();
      const idx = ALL.findIndex(x => x.key === key);
      if (idx >= 0) ALL[idx] = data.request;
      // Forward moves can be undone from the card; undoing doesn't offer another undo
      LAST_MOVE = ['send-confirmation', 'confirm', 'decline'].includes(action) && UNDO_ACTION[prev]
        ? { key, prev, label: okMsg.replace(/\.$/, ''), status: data.request.status } : null;
      showOk(okMsg);
      refreshBadge();
      render();
    } catch (e) {
      console.error('Update request failed:', e);
      showErr('Update failed. Nothing was changed.');
    }
  }

  async function patch(key, fields, okMsg) {
    const secret = $('secret').value.trim();
    try {
      const resp = await fetch('/.netlify/functions/update-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ secret, key, ...fields }),
      });
      if (!resp.ok) return showErr('Save failed (' + resp.status + ').');
      const data = await resp.json();
      const idx = ALL.findIndex(x => x.key === key);
      if (idx >= 0) ALL[idx] = data.request;
      showOk(okMsg);
      render();
    } catch (e) {
      console.error('Save failed:', e);
      showErr('Save failed. Nothing was changed.');
    }
  }

  // Rush: the request came in less than 24 hours before delivery (shared
  // rule in admin-shared.js, the same one Send Invoice charges by).
  function isRushRequest(r) {
    return isRushBooking(r.submittedAt, r.deliveryDate, windowStart(r.deliveryWindow));
  }

  function confirmMessage(r) {
    const first = (r.name || 'there').split(' ')[0];
    const pkg = r.package || 'your package';
    const rushNote = isRushRequest(r)
      ? ` Since that's a rush request (under 24 hrs out), a $${RUSH_FEE} expedite fee applies, it'll show as its own line on your invoice.`
      : '';
    return `Hi ${first}, it's ${TEXT_SIGNER}! Got your request for ${pkg}. Your dates, ${fmtReqDate(r.deliveryDate)} to ${fmtReqDate(r.pickupDate)}, work on our end.${rushNote} Tap here to confirm and we'll send your invoice:\n${confirmLink(r)}\n(or just reply YES)`;
  }

  // One-tap confirm link: readytoteokc.com/c/CODE shows confirm.html (see
  // _redirects); phones make it tappable without the https://. The random
  // code is made here, put in the text right away and saved on the request
  // in the background, so Messages still opens straight from the tap.
  function confirmLink(r) {
    return 'readytoteokc.com/c/' + encodeURIComponent(r.confirmToken || '');
  }
  function saveConfirmToken(r) {
    const bytes = crypto.getRandomValues(new Uint8Array(12));
    r.confirmToken = btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    fetch('/.netlify/functions/update-request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: $('secret').value.trim(), key: r.key, confirmToken: r.confirmToken }),
    }).then(resp => { if (!resp.ok) showErr("Couldn't save the confirm link (" + resp.status + "). The customer can still reply YES."); })
      .catch(() => showErr("Couldn't save the confirm link. The customer can still reply YES."));
  }

  // normalizePhone() and smsLink() now live in admin-shared.js.

  // This page shows an em dash rather than blank for a missing date —
  // wraps the shared fmtDate (from admin-shared.js) with that fallback.
  // Named differently on purpose: naming this fmtDate would shadow the
  // global admin-shared.js function of the same name (function declarations
  // hoist to global scope in a plain script), making sharedFmtDate below
  // resolve to this wrapper itself instead of the real one, infinite
  // self-recursion on every call.
  const sharedFmtDate = window.fmtDate;
  // "Fri, Oct 23" like the rest of the app (year added when it isn't this year)
  function fmtReqDate(iso) {
    if (!/^\d{4}-\d{2}-\d{2}/.test(String(iso || ''))) return sharedFmtDate(iso, '\u2014');
    const d = new Date(String(iso).slice(0, 10) + 'T12:00:00Z');
    const sameYear = String(iso).slice(0, 4) === todayCT().slice(0, 4);
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', ...(sameYear ? {} : { year: 'numeric' }), timeZone: 'UTC' });
  }
  function fmtDateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(2);
    const hh = d.getHours() % 12 || 12;
    const min = String(d.getMinutes()).padStart(2, '0');
    const ap = d.getHours() >= 12 ? 'PM' : 'AM';
    return `${mm}/${dd}/${yy} ${hh}:${min} ${ap}`;
  }
  function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }
  function showErr(m) { const s = $('status'); s.style.display = 'block'; s.className = 'status err'; s.textContent = m; }
  function showOk(m) { const s = $('status'); s.style.display = 'block'; s.className = 'status ok'; s.textContent = m; setTimeout(() => { s.style.display = 'none'; }, 2500); }
</script>
</body>
</html>
